# Globale Volumes
volumes:
  caddy_data:
  caddy_config:
  postgres-data:
  valkey-data:
  local-backups:
  open-webui-data:
  pipelines-data:
  postgres-komodo-data:
  gpustack-data:
  dify-app-data:
  dify-sandbox-dependencies:
  dify-sandbox-conf:
  dify-plugin-daemon:
  speaches-data:
  searxng-data:
  authentik-media:
  authentik-templates:
  authentik-certs:
  authentik-blueprints:
  gitea-data:
  lightrag-data:
  cognee-data:
  cognee-data-storage:
  docling-scratch:
  stirling-pdf-config:
  stirling-pdf-logs:
  paperclip-data:
  # M020 S07 + M023 S06: hermes / moltis volumes removed (per-user via
