  # operator boxes can be reclaimed manually via `docker volume rm`.
  synapse-data:
  smtp-relay-data:
  paperless-data:
  paperless-media:
  vaultwarden-data:
  onyx-vespa-data:
  onyx-model-cache:
  onyx-indexer-model-cache:
  openhands-workspace:
  # M020 S07 + M023 S06: coding-tools-workspace removed (per-user via
  # agent-manager — `agent-coding-tools-<slug>-workspace`).

networks:
  default:
    driver: bridge
  ssrf_proxy_network:
    driver: bridge
    internal: true