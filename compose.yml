name: razzfazz-stack

# ==============================================================================
# RAZZFAZZ AI SERVICE STACK - MAIN COMPOSE FILE
# ==============================================================================
# This is the entry point for the stack. It orchestrates all sub-modules using
# Docker Compose `include` feature.
#
# CONFIGURATION:
# - Global settings are in `.env` (check this file first!)
# - Dify specific settings are in `.env.dify`
# - Enabled services are controlled via `COMPOSE_PROFILES` in `.env`
#
# USAGE:
# - Start all enabled profiles: docker compose up -d
# - Start specific profile: docker compose --profile chat up -d
# ==============================================================================

include:
  # 1. Core Infrastructure (IMMER AN)
  - path: ./core/compose.yml
    env_file: 
      - .env
      - .env.dify

  # 2. Chat UI & Pipelines (Profile: chat)
  - path: ./modules/chat/compose.yml
    env_file: .env

  # 4. Monitoring / Komodo (Profile: monitor)
  - path: ./modules/monitor/compose.yml
    env_file: .env

  # 5. LLM Backend (Profile: llm)
  - path: ./modules/llm/compose.yml
    env_file: .env

  # 5b. Mac LLM Gateway — LiteLLM fronting Macs running Ollama (Profile: mac-llm)
  #     [EXPERIMENTAL, opt-in, off by default] (2026.08). GPUStack untouched.
  - path: ./modules/llm/mac-gateway/compose.yml
    env_file: .env

  # 6. SearXNG (Profile: searxng)
  - path: ./modules/search/searxng/compose.yml
    env_file: .env

  # 6b. Crawl4AI (Profile: crawl4ai) — RAG-friendly web crawler [EXPERIMENTAL]
  - path: ./modules/search/crawl4ai/compose.yml
    env_file: .env

  # 7. Gotenberg (Profile: gotenberg)
  - path: ./modules/doc-processing/gotenberg/compose.yml
    env_file: .env

  # 8. Speech (Profile: stts)
  - path: ./modules/stts/compose.yml
    env_file: .env

  # 9. Dify (Profile: dify)
  - path: ./modules/dify/compose.yml
    env_file: 
      - .env
      - .env.dify

  # 10. Gitea (Profile: gitea)
  - path: ./modules/gitea/compose.yml
    env_file: .env

  # 11. LightRAG (Profile: lightrag) [EXPERIMENTAL]
  - path: ./modules/knowledge/lightrag/compose.yml
    env_file: .env

  # 12. Cognee (Profile: cognee) [EXPERIMENTAL]
  - path: ./modules/knowledge/cognee/compose.yml
    env_file: .env

  # 13. Apache Tika (Profile: tika) [EXPERIMENTAL]
  - path: ./modules/doc-processing/tika/compose.yml
    env_file: .env

  # 14. Docling Serve (Profile: docling) [EXPERIMENTAL]
  - path: ./modules/doc-processing/docling/compose.yml
    env_file: .env

  # 15. Presidio PII Detection (Profile: presidio) [EXPERIMENTAL]
  - path: ./modules/doc-processing/presidio/compose.yml
    env_file: .env

  # 16. Stirling-PDF (Profile: stirling-pdf) [EXPERIMENTAL]
  - path: ./modules/doc-processing/stirling-pdf/compose.yml
    env_file: .env

  # 17. Paperclip — AI Company Orchestration (Profile: paperclip) [EXPERIMENTAL]
  - path: ./modules/apps/paperclip/compose.yml
    env_file: .env

  # 18. (M020 S07) hermes profile removed — moved to per-user via agent-manager.

  # 19. Matrix — Synapse Homeserver + Element Web (Profile: matrix) [EXPERIMENTAL]
  - path: ./modules/apps/matrix/compose.yml
    env_file: .env

  # 20. (M020 S07) moltis profile removed — moved to per-user via agent-manager.

  # 21. Paperless-ngx — Document Management (Profile: paperless-ngx) [EXPERIMENTAL]
  - path: ./modules/doc-processing/paperless-ngx/compose.yml
    env_file: .env

  # 22. Vaultwarden — Password Manager (Profile: vaultwarden) [EXPERIMENTAL]
