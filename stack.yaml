# =============================================================================
# PER-USER AGENTS — provisioned on demand by the Agent Manager (catalog.py)
# (not compose profiles; one isolated container set per Authentik user)
# =============================================================================
per_user_agents:

  hermes:
    name: "Hermes (Personal)"
    category: "Agents"
    tier: lightweight
    license: "upstream:Apache-2.0"
    edition: bundled
    built_from: "https://github.com/NousResearch"
    provisioned_by: "agents (agent-manager)"
    containers:
      - { name: "hermes-agent (per user)", image: "razzfazz-stack-hermes-agent" }
      - { name: "hermes-workspace (companion)", image: "razzfazz-stack-hermes-workspace" }
    purpose: |
      A self-improving Python AI agent (NousResearch) with a workspace UI —
      memory browser, skills explorer, terminal, and multi-session support.
      Provisioned per user as an isolated personal assistant.
    user_facing_capabilities:
      - "A personal agent that learns/extends its own Python skills over time."
      - "Browse its memory, explore/edit skills, drive it from a web terminal."
    use_cases:
      - "A long-lived personal assistant that accumulates skills and context."
    dependencies: { required: ["core", "agents"], recommended: ["llm-manager"], optional: [] }
    talks_to:
      - { service: "gpustack", purpose: "LLM inference (LLM_MODEL default qwen3.6)" }
    databases: []

  moltis:
    name: "Moltis"
    category: "Agents"
    tier: lightweight
    license: "upstream:MIT"
    edition: bundled
    built_from: "https://github.com/moltis-org/moltis"
    provisioned_by: "agents (agent-manager)"
    containers:
      - { name: "moltis (per user)", image: "razzfazz-stack-moltis" }
    purpose: |
      A Rust personal-agent server with a Matrix, Telegram and Discord gateway,
      so a user's agent is reachable from chat platforms. Integrates with the
      cognee MCP for long-term memory.
    user_facing_capabilities:
      - "Talk to your personal agent from Matrix/Telegram/Discord."
      - "Persistent memory via cognee MCP (remember/recall)."
    use_cases:
      - "A chat-platform-native personal assistant/bot."
    dependencies: { required: ["core", "agents"], recommended: ["llm-manager"], optional: ["cognee", "matrix"] }
    talks_to:
      - { service: "gpustack", purpose: "LLM inference" }
      - { service: "cognee-mcp", purpose: "memory remember/recall/search" }
    databases: []

  # coding-agent-web — the coding-agent SPLIT (#36 / PR #84). The 2026.04
  # "Coding Tools" bundle (a single razzfazz-coding-tools image baking gsd-pi +
  # opencode) was replaced by four per-type images built from ONE shared
  # Dockerfile (modules/agents/coding-agent-web): opencode, codex, a bare
  # "user-defined" agent, and — retired as a baked agent — gsd-pi, now only a
  # User Defined install suggestion (`npm i -g @opengsd/gsd-pi`). razzfazz.ai
  # ships ONLY the web-terminal wiring + local-model shim, which are Apache-2.0
  # (Community — NEVER BSL, because they ride in the same image as the wrapped
  # upstream CLIs); each bundled CLI keeps its own upstream licence. The legacy
  # razzfazz-coding-tools image is DEPRECATED/DISABLED (catalog enabled=False)
  # and is intentionally NOT listed here as a current shipped component.
  coding-agent-web:
    name: "Coding Agents"
    category: "Developer Tools"
    tier: lightweight
    license: "mixed"
    edition: mixed
    provisioned_by: "agents (agent-manager)"
    # Per-container licence OVERRIDES the module default: the bundled CLIs keep
    # their upstream SPDX (opencode MIT · codex Apache-2.0 · gsd-pi MIT); our own
    # web-terminal + shim wiring is Apache-2.0 Community. Verified 2026-07-04 via
    # `npm view <pkg> license` on the pinned versions.
    containers:
      - { name: "opencode", image: "razzfazz-coding-agent-opencode", license: "upstream:MIT", edition: bundled, built_from: "https://github.com/sst/opencode" }
      - { name: "codex", image: "razzfazz-coding-agent-codex", license: "upstream:Apache-2.0", edition: bundled, built_from: "https://github.com/openai/codex" }
      - { name: "gsd-pi", image: "razzfazz-coding-agent-user-defined (user install: @opengsd/gsd-pi)", license: "upstream:MIT", edition: bundled, built_from: "https://github.com/open-gsd/gsd-pi" }
      - { name: "coding-agent web terminal + shim (wiring)", image: "razzfazz-coding-agent-user-defined", license: "apache-2.0", edition: community }
    purpose: |
      A persistent per-user coding workspace: an in-browser tmux terminal with a
      durable /workspace + /home volume, pre-wired (via a local-model shim) to run
      a coding-agent CLI against the local GPUStack LLM. Split (#36 / PR #84) into
      per-type images — opencode (opencode-ai CLI), codex (@openai/codex), and a
      bare "user-defined" agent that lets a user bring + persist their own CLI
      (e.g. `npm i -g @opengsd/gsd-pi`, the retired gsd agent). All four build from
      the shared Dockerfile; razzfazz.ai ships only the Apache-2.0 web-terminal
      wiring, and every bundled CLI keeps its own upstream licence.
    user_facing_capabilities:
      - "AI-assisted coding in a browser terminal (opencode / codex / your own CLI)."
      - "Persistent per-user workspace; bring-your-own agent survives restarts."
    use_cases:
      - "Personal AI pair-programmer with a durable workspace."
    dependencies: { required: ["core", "agents"], recommended: ["llm-manager"], optional: ["gitea"] }
    talks_to:
      - { service: "gpustack", purpose: "LLM inference (coding model, via local shim)" }
      - { service: "cognee-mcp", purpose: "memory (optional)" }
      - { service: "gitea", purpose: "repo access (optional)" }
    databases: []

  # openhands + paperclip are also provisionable per-user — see the `modules`
  # section above for their full definition (also_provisioned_per_user: true).
