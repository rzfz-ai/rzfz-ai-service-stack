    github: null
    subdomains: ["agents"]
    containers:
      - { name: agent-manager, image: "razzfazz-agent-manager (built)", license: "busl-1.1", edition: enterprise }
    purpose: |
      The orchestrator for per-user AI agents. Authenticated users launch their
      own isolated agent containers (Hermes, Moltis, Coding Agents, OpenHands,
      Paperclip) with quota-based resource governance, each on its own subdomain,
      with dynamic Caddy routing, idle auto-shutdown and stale-instance cleanup.
      Admins configure available agent types and quota tiers (Basic/Power/Admin)
      in the Config UI.
    user_facing_capabilities:
      - "Self-provision a personal AI agent from the 'My Agents' drawer."
      - "Each agent runs isolated, per-user, with its own URL + persistent volumes."
      - "Idle agents auto-stop; quota tiers cap resource use per user."
    use_cases:
      - "Multi-user AI agent platform with per-person isolation."
      - "Give every developer a personal coding agent + memory."
    dependencies: { required: ["core"], recommended: ["llm-manager"], optional: ["openhands"] }
    talks_to:
      - { service: "postgres", purpose: "instance registry + quotas (agent_manager_db)" }
      - { service: "caddy admin API", purpose: "dynamic per-user subdomain routes" }
      - { service: "docker-socket-proxy", purpose: "per-user container lifecycle" }
    databases: ["agent_manager_db"]

  mcp:
