      - "Audio note transcription."
    dependencies: { required: ["core"], recommended: [], optional: [] }
    talks_to:
      - { service: "consumed by openwebui", purpose: "STT (:8000) + TTS (:5050) for chat voice" }
    databases: []

# =============================================================================
# DOCUMENTS  (Tier: production / experimental)
# =============================================================================
  gotenberg:
    name: "Document Conversion (Gotenberg)"
    category: "Documents"
    tier: production
    origin: FR
    license: "upstream:MIT"
    edition: bundled
    github: "https://github.com/gotenberg/gotenberg"
    subdomains: []  # internal backend
    containers:
      - { name: gotenberg, image: "gotenberg/gotenberg" }
    purpose: |
      A stateless API that converts HTML, Markdown and Office documents
      (DOCX/XLSX/PPTX) to PDF using Chromium + LibreOffice. Used as a backend
      for Paperless-ngx and available to Dify document workflows.
    user_facing_capabilities:
      - "Convert Office and HTML documents to PDF programmatically."
    use_cases:
      - "Office-to-PDF for archival in Paperless-ngx."
      - "Render report templates to PDF in a workflow."
    dependencies: { required: ["core"], recommended: [], optional: [] }
    talks_to:
      - { service: "consumed by paperless-ngx / dify", purpose: "document → PDF conversion via :3000" }
    databases: []

  tika:
    name: "Apache Tika"
    category: "Documents"
    tier: experimental
    origin: US
    license: "upstream:Apache-2.0"
    edition: bundled
    github: "https://github.com/apache/tika"
    subdomains: []  # internal backend
    containers:
      - { name: tika, image: "apache/tika:full" }
    purpose: |
      Detects and extracts text, metadata and language from 1000+ file formats
      via a simple REST API. Backs Paperless-ngx text extraction and is callable
      from Dify document flows.
    user_facing_capabilities:
      - "Extract text + metadata from heterogeneous files (PDF, Office, email, images, archives)."
      - "Detect document language."
    use_cases:
      - "High-quality text extraction for Paperless-ngx search."
      - "Metadata harvesting in document pipelines."
    dependencies: { required: ["core"], recommended: [], optional: [] }
    talks_to:
      - { service: "consumed by paperless-ngx / dify", purpose: "text + metadata extraction via :9998" }
    databases: []

  docling:
    name: "Docling"
    category: "Documents"
    tier: experimental
    origin: US
    license: "upstream:MIT"
    edition: bundled
    github: "https://github.com/docling-project/docling"
    subdomains: ["docling"]
    containers:
      - { name: docling, image: "ghcr.io/docling-project/docling-serve-cpu" }
      - { name: docling-rq-worker, image: "ghcr.io/docling-project/docling-serve-cpu (RQ worker)" }
    purpose: |
      Converts PDF, DOCX, PPTX, images and HTML into structured Markdown/JSON
      with layout analysis that preserves tables, headings and reading order.
      Exposes a REST API and a Gradio UI; can optionally use a GPUStack
      granite-docling vision model for complex layouts. Uses an RQ (valkey)
      job engine so the UI works under concurrent load.
    user_facing_capabilities:
      - "Convert PDFs/scans/Office docs to clean structured Markdown or JSON."
      - "Interactive conversion via a Gradio web UI, or batch via REST."
