# =============================================================================
# stack.yaml — Single Source of Truth for the razzfazz.ai Service Stack
# =============================================================================
# Purpose: one versioned, machine-readable description of every module, agent,
# and container in the platform — for infographics, architecture diagrams,
# customer-facing capability maps, onboarding decks, and the marketing site.
#
# This is a CURATED, human-authored companion to the operational sources of
# truth (do NOT auto-generate over it; reconcile by hand):
#   - core/config/profiles.yaml  — module metadata the Config UI renders
#   - config/manifests/versions.json — image pins / versions
#   - agents/manager/app/services/catalog.py — per-user agent definitions
#   - docs/security-architecture.md — as-built security posture
#
# Fields per module/agent:
#   id, name, category, tier, origin, license, github
#
# Open-core licensing SSOT (2026.07, license reorg — #68):
#   license  — enum: `busl-1.1` (our Enterprise code), `apache-2.0` (our
#              Community code / wiring), `upstream:<SPDX>` (bundled/built third-
#              party, keeps its own licence), or `mixed` (module bundles several).
#   edition  — enum: `enterprise` (BSL-1.1), `community` (Apache-2.0),
#              `bundled` (upstream image, unchanged), or `mixed`.
#   built_from — for wrapped/built images: the upstream source URL.
#   Container-level `license`/`edition`/`built_from` on an inline container dict
#   OVERRIDE the module default (used where a module bundles heterogeneous
#   components, e.g. core = our BSL web UIs + upstream Caddy/Postgres/Authentik).
#   This block is the single source of truth the razzfazz-licenses container
#   renders and the root NOTICE is reconciled against. `upstream:TBD` would mark
#   an unresolved SPDX LEGAL-FLAG pending counsel — currently none (Authentik
#   resolved to MIT per the 2026-07-04 legal research: core is MIT, we ship no
#   `authentik/enterprise/` features). Do not guess a licence — flag it TBD.
#   NB: Enterprise (BSL 1.1) is *source-available*, NOT OSI open source; only the
#   Community edition (Apache-2.0) is open source. See docs/LICENSING.md.
#   subdomains            — user-facing https://<sub>.<domain> entry points
#   containers            — the docker containers that make up the module
#   purpose               — verbose: what it is and why it exists
#   user_facing_capabilities — verbose: what a user can actually DO with it
#   use_cases             — concrete scenarios / jobs-to-be-done
#   dependencies          — required / recommended / optional modules
#   talks_to              — outbound runtime connections (the "edges" of the graph)
#   databases             — postgres tenants (shared pg instance unless noted)
#
# tiers:
#   core          — always-on foundation; cannot be toggled off
#   production     — supported, validated, GA-quality
#   experimental   — opt-in, EXPERIMENTAL; functional but evolving
#
# origin codes: AT=Austria (razzfazz.ai/SEQIS), US, EU, GB, FR, CN, etc.
# =============================================================================

schema_version: 1
stack_version: "2026.07-ga.9"
generated: "2026-06-16"
maintainer: "razzfazz.ai GmbH — Member of SEQIS Group"

legend:
  tiers:
    core: "Always-on foundation; runs unconditionally, cannot be disabled."
    production: "Supported, GA-quality, validated each release."
    experimental: "Opt-in; functional but still evolving."
  networks:
    default: "Bridge network all services share; addressed by container name via Docker DNS."
    ssrf_proxy_network: "Internal-only network for SSRF-isolated outbound HTTP (Dify code/HTTP nodes via Caddy:8195)."
  edge: "Caddy (ports 80/443) is the sole external entry point; every user-facing UI is gated by Authentik SSO forward-auth."

# =============================================================================
# CORE — always-on foundation (Tier: core)
# =============================================================================
modules:

  core:
    name: "Core Infrastructure"
    category: "Core"
    tier: core
    origin: AT
    license: "mixed"
    edition: mixed
    github: null
    subdomains: ["auth", "setup", "config", "help", "license", "backup"]
    containers:
      - { name: caddy, image: "razzfazz-caddy (built)", license: "upstream:Apache-2.0", edition: bundled, built_from: "https://github.com/caddyserver/caddy" }
      - { name: postgres, image: "pgvector/pgvector:pg17", license: "upstream:PostgreSQL", edition: bundled, built_from: "https://github.com/pgvector/pgvector" }
      - { name: authentik-server, image: "ghcr.io/goauthentik/server", license: "upstream:MIT", edition: bundled, built_from: "https://github.com/goauthentik/authentik" }
      - { name: authentik-worker, image: "ghcr.io/goauthentik/server", license: "upstream:MIT", edition: bundled, built_from: "https://github.com/goauthentik/authentik" }
      - { name: valkey, image: "valkey/valkey", license: "upstream:BSD-3-Clause", edition: bundled }
      - { name: smtp-relay, image: "boky/postfix", license: "upstream:MIT", edition: bundled, built_from: "https://github.com/bokysan/docker-postfix" }
      - { name: backup-service, image: "offen/docker-volume-backup", license: "upstream:MPL-2.0", edition: bundled, built_from: "https://github.com/offen/docker-volume-backup" }
      - { name: razzfazz-config, image: "razzfazz-config (built)", license: "busl-1.1", edition: enterprise }
      - { name: razzfazz-help, image: "razzfazz-help (built)", license: "busl-1.1", edition: enterprise }
      - { name: razzfazz-licenses, image: "razzfazz-licenses (built)", license: "busl-1.1", edition: enterprise }
      - { name: razzfazz-backup-management, image: "razzfazz-backup-management (built)", license: "busl-1.1", edition: enterprise }
      - { name: razzfazz-start-portal, image: "razzfazz-start-portal (built)", license: "busl-1.1", edition: enterprise }
      - { name: mcp-manager, image: "razzfazz-mcp-manager (built)", license: "busl-1.1", edition: enterprise }
      - { name: docker-socket-proxy, image: "tecnativa/docker-socket-proxy", license: "upstream:Apache-2.0", edition: bundled, built_from: "https://github.com/Tecnativa/docker-socket-proxy" }
      - { name: autoheal, image: "willfarrell/autoheal", license: "upstream:MIT", edition: bundled, built_from: "https://github.com/willfarrell/docker-autoheal" }
    purpose: |
      The always-on foundation every other module builds on. Caddy is the sole
      external entry point — it terminates TLS, reverse-proxies every subdomain,
      and enforces Authentik SSO via forward-auth (plus an internal SSRF proxy on
      :8195). Authentik provides identity, SSO, OIDC and group-based access
      control. PostgreSQL (pgvector) is the shared relational + vector database
      with a separate tenant DB per service. Valkey is the shared cache / task
      queue. A Postfix relay sends mail; the backup service snapshots all Docker
      volumes on a cron schedule (encrypted). docker-socket-proxy brokers a
      locked-down Docker API to the few services that need it; autoheal restarts
      any container that goes unhealthy. The Setup, Config, Help, Licenses and
      Backup web UIs round out the operator surface.
    user_facing_capabilities:
      - "Single sign-on across every app with one identity (Authentik)."
      - "Self-service config portal to enable/disable modules, manage secrets, run backups, view governance checksums."
      - "Guided first-time setup wizard and an offline documentation hub."
      - "Automated encrypted nightly backups of all data volumes, with a restore UI."
      - "Per-app access control via Authentik groups."
    use_cases:
      - "Admin enables a new module from the Config portal and it appears, SSO-gated, within minutes."
      - "Operator rotates a secret or takes a governance checksum snapshot before an audit."
      - "Recover a service from a nightly backup after a bad change."
    dependencies: { required: [], recommended: [], optional: [] }
    talks_to:
      - { service: "all-services", purpose: "Caddy reverse-proxy + forward-auth for every gated subdomain" }
      - { service: "postgres", purpose: "shared DB for Authentik + every tenant" }
      - { service: "valkey", purpose: "Authentik cache/sessions; shared cache" }
      - { service: "docker-socket-proxy", purpose: "brokered Docker API for config/backup/agent-manager/gpustack" }
    databases: ["authentik_db"]

# =============================================================================
# AI & CHAT  (Tier: production)
# =============================================================================
  chat:
    name: "Chat (Open WebUI)"
    category: "AI & Chat"
    tier: production
    origin: US
    license: "upstream:BSD-3-Clause"
    edition: bundled
    built_from: "https://github.com/open-webui/open-webui"
    github: "https://github.com/open-webui/open-webui"
    subdomains: ["chat"]
    containers:
      - { name: openwebui, image: "ghcr.io/open-webui/open-webui" }
      - { name: pipelines, image: "ghcr.io/open-webui/pipelines", license: "upstream:MIT", edition: bundled }
    purpose: |
      A full-featured, ChatGPT-like workspace for talking to the box's local LLMs.
      Multi-model conversations, retrieval-augmented generation (RAG) over uploaded
      documents, web search grounding via SearXNG, voice in/out via the speech
      services, a custom "pipelines" extension layer, and multi-user access control
      through Authentik SSO. It is the primary day-to-day interface most users see.
    user_facing_capabilities:
      - "Chat with local models (qwen3.6 by default) — fully private, nothing leaves the box."
      - "Upload documents (PDF, DOCX, etc.) and ask questions over them (RAG with reranking)."
      - "Ground answers in live web results via SearXNG web search."
      - "Dictate by voice and have responses read back (STT/TTS)."
      - "Switch models per conversation; manage prompts, knowledge collections, and per-user chat history."
      - "Extend behaviour with pipelines (filters, custom tools, observability hooks)."
    use_cases:
      - "Team AI assistant for drafting, summarising, translating, brainstorming."
      - "Private document Q&A over contracts, manuals, or internal wikis."
      - "Code review and generation against pasted snippets."
      - "Research with web-grounded, citation-style answers."
    dependencies: { required: ["core"], recommended: ["llm-manager"], optional: ["searxng", "stts", "observability"] }
    talks_to:
      - { service: "gpustack", purpose: "LLM inference (OpenAI-compatible) + embeddings + reranker" }
      - { service: "postgres", purpose: "chat history, RAG config, users (openwebui_db)" }
      - { service: "searxng", purpose: "web search grounding (when enabled)" }
      - { service: "speaches", purpose: "speech-to-text + text-to-speech (when enabled)" }
      - { service: "openlit", purpose: "LLM call tracing via the global pipeline filter (when observability enabled)" }
    databases: ["openwebui_db"]

# =============================================================================
# WORKFLOWS  (Tier: production)
# =============================================================================
  dify:
    name: "Workflows (Dify)"
    category: "Workflows"
    tier: production
    origin: US
    license: "upstream:Apache-2.0"
    edition: bundled
    built_from: "https://github.com/langgenius/dify"
    github: "https://github.com/langgenius/dify"
    subdomains: ["dify"]
    containers:
      - { name: dify-api, image: "langgenius/dify-api" }
      - { name: dify-worker, image: "langgenius/dify-api" }
      - { name: dify-worker-beat, image: "langgenius/dify-api" }
      - { name: dify-web, image: "razzfazz-dify-web (built)" }
      - { name: dify-sandbox, image: "langgenius/dify-sandbox" }
      - { name: dify-plugin-daemon, image: "langgenius/dify-plugin-daemon" }
      - { name: dify-init-permissions, image: "busybox (one-shot)" }
    purpose: |
      A visual, low-code platform for building LLM applications — AI agents, RAG
      pipelines, chatbots, and multi-step workflow automations — without writing
      code. Drag-and-drop a workflow, wire in the box's local models, document
      knowledge bases, HTTP calls (through the SSRF-safe proxy), and code nodes
      that run in an isolated sandbox. Publish flows as chat apps or as APIs.
    user_facing_capabilities:
      - "Build AI workflows visually (LLM, knowledge-retrieval, condition, code, HTTP, tool nodes)."
      - "Create RAG knowledge bases from uploaded documents and query them in flows."
      - "Run sandboxed Python/Node code nodes safely inside a workflow."
      - "Publish a workflow as a hosted chat app or call it as a REST API."
      - "Call internal doc tools (docling/tika/presidio) and web search from a flow."
    use_cases:
      - "Customer-support / triage bots over a curated knowledge base."
      - "Document pipelines: PDF → extract → classify → structured JSON (e.g. the PSA CMT demo)."
      - "Multi-step autonomous agents that chain tools and models."
      - "API-driven LLM features embedded into other internal apps."
    dependencies: { required: ["core"], recommended: ["llm-manager"], optional: ["searxng", "docling", "tika", "presidio"] }
    talks_to:
      - { service: "gpustack", purpose: "LLM inference + embeddings" }
      - { service: "postgres", purpose: "app + plugin databases (dify_db, dify_plugin_db)" }
      - { service: "valkey", purpose: "task queue + cache" }
      - { service: "caddy:8195", purpose: "SSRF-protected outbound HTTP for HTTP/code nodes" }
      - { service: "searxng / docling / tika / presidio", purpose: "web search + document tooling from flows" }
    databases: ["dify_db", "dify_plugin_db"]

# =============================================================================
# LLM INFERENCE  (mutually-exclusive variants; pick one)
# =============================================================================
  llm-legacy:
    name: "LLM Inference — GPUStack 0.7.1 (stable default for every GPU box)"
    category: "LLM Inference"
    tier: production
    origin: US
    license: "mixed"
    edition: mixed
    github: "https://github.com/gpustack/gpustack"
    subdomains: ["llm"]
    containers:
      - { name: gpustack, image: "razzfazz-gpustack:vulkan (built, GPUStack 0.7.1 + custom AMD Vulkan runner; HARDWARE=amd)", license: "upstream:Apache-2.0", edition: bundled, built_from: "https://github.com/gpustack/gpustack" }
      - { name: gpustack, image: "razzfazz-gpustack:cuda (built, GPUStack 0.7.1 + custom CUDA llama.cpp b9851; HARDWARE=nvidia)", license: "upstream:Apache-2.0", edition: bundled, built_from: "https://github.com/gpustack/gpustack" }
      - { name: model-sync, image: "razzfazz-model-sync (built)", license: "busl-1.1", edition: enterprise }
      - { name: ollama-proxy, image: "eyalrot2/ollama-openai-proxy", license: "upstream:MIT", edition: bundled, built_from: "https://github.com/eyalrot/ollama_openai" }
    purpose: |
      The model-serving engine that downloads, loads, and serves LLMs over an
      OpenAI-compatible API to the whole stack. This is the STABLE production
      default for every GPU box; ONE profile since the #1448 cutover (C8), with
      HARDWARE selecting the device overlay: `amd` runs GPUStack 0.7.1 with a
      locally-built Vulkan runner (validated leak-free under stop/start cycles),
      `nvidia` runs the same 0.7.1 control plane with a locally-built CUDA
      llama.cpp runner (b9851, sm_120 — Blackwell / RTX PRO 6000). A model-sync
      sidecar mirrors the active model list into Open WebUI; an Ollama-compatible
      proxy lets legacy Ollama tools talk to it. Behind the LLM Manager it is an
      optional backend (#979 cutover decision, 2026-09-04).
    user_facing_capabilities:
      - "Serve local chat / coding / vision / embedding / reranker models over one OpenAI-compatible endpoint."
      - "Manage models (download, start/stop, scale replicas) from the GPUStack dashboard."
      - "Offload models to the GPU (VRAM) for fast inference, fully on-box — AMD via Vulkan, NVIDIA via CUDA."
      - "Expose an Ollama-compatible API for tools that expect Ollama."
    use_cases:
      - "Back the Chat, Dify, RAG, and agent modules with private inference."
      - "Run qwen3.6 at 1M context for chat/coding/vision on a single Strix Halo box."
    dependencies: { required: ["core"], recommended: [], optional: [] }
    mutually_exclusive_with: []
    talks_to:
      - { service: "postgres", purpose: "GPUStack metadata (gpustack_db)" }
      - { service: "consumers", purpose: "serves chat, dify, cognee, lightrag, agents, openhands via :9090" }
    databases: ["gpustack_db"]

  monitor:
    name: "Monitoring (Komodo)"
    category: "Monitoring"
    tier: production
    origin: US
    license: "upstream:GPL-3.0"
    edition: bundled
    built_from: "https://github.com/moghtech/komodo"
    github: "https://github.com/moghtech/komodo"
    subdomains: ["admin"]
    containers:
      - { name: komodo-core, image: "ghcr.io/moghtech/komodo-core" }
      - { name: komodo-periphery, image: "ghcr.io/moghtech/komodo-periphery" }
      - { name: ferretdb, image: "ghcr.io/ferretdb/ferretdb", license: "upstream:Apache-2.0", edition: bundled }
      - { name: postgres-komodo, image: "ghcr.io/ferretdb/postgres-documentdb", license: "upstream:Apache-2.0", edition: bundled }
    purpose: |
      A web dashboard to monitor and manage every Docker container in the stack —
      real-time logs, resource usage, restart/stop controls, and deployment
      history. Runs its own database (FerretDB over a dedicated Postgres) so it
      never contends with the main DB.
    user_facing_capabilities:
      - "View live logs and resource usage for any container."
      - "Restart / stop / start individual services from the browser."
      - "Track deployment and update history."
    use_cases:
      - "On-call triage: inspect a failing container's logs and bounce it."
      - "Capacity review across the running stack."
    dependencies: { required: [], recommended: [], optional: [] }
    talks_to:
      - { service: "ferretdb -> postgres-komodo", purpose: "Mongo-compatible document store on a dedicated Postgres" }
      - { service: "docker socket", purpose: "container management + log collection (periphery)" }
    databases: []

  observability:
    name: "Observability (OpenLIT + ClickHouse)"
    category: "Monitoring"
    tier: experimental
    origin: US
    license: "upstream:Apache-2.0"
    edition: bundled
    github: "https://github.com/openlit/openlit"
    subdomains: ["observability"]
    containers:
      - { name: openlit, image: "ghcr.io/openlit/openlit" }
      - { name: clickhouse, image: "clickhouse/clickhouse-server" }
    purpose: |
      Stack-wide LLM observability. OpenLIT captures every LLM call that flows
      through Open WebUI's pipeline layer (Dify, GPUStack, hermes, moltis,
      opencode) and indexes it in ClickHouse for cost / latency / token /
      prompt-quality dashboards, with 30-day auto-pruned retention.
    user_facing_capabilities:
      - "See cost, latency, token usage and prompt/response quality per model and per app."
      - "Drill into individual LLM traces to debug slow or expensive prompts."
    use_cases:
      - "Track LLM spend and performance trends over time."
      - "Find and fix prompts that blow the token budget or run slow."
    dependencies: { required: ["core"], recommended: ["chat"], optional: [] }
    talks_to:
      - { service: "clickhouse", purpose: "span/trace store" }
      - { service: "pipelines", purpose: "receives OTLP traces from the Open WebUI global filter" }
    databases: []

# =============================================================================
# SEARCH  (Tier: production / experimental)
# =============================================================================
  searxng:
    name: "Search (SearXNG)"
    category: "Search"
    tier: production
    origin: EU
    license: "upstream:AGPL-3.0"
    edition: bundled
    github: "https://github.com/searxng/searxng"
    subdomains: []  # internal-only backend (no SSO-gated UI)
    containers:
      - { name: searxng, image: "searxng/searxng" }
    purpose: |
      A privacy-respecting metasearch engine that aggregates results from 70+
      engines without tracking. Runs internal-only as the web-search backend for
      Chat and Dify (URL discovery), not exposed as an end-user UI.
    user_facing_capabilities:
      - "Web-search grounding inside AI chat and Dify workflows (no external tracking)."
    use_cases:
      - "Give chat answers current, web-grounded context."
      - "Discover source URLs to feed into Crawl4AI / RAG ingestion."
    dependencies: { required: ["core"], recommended: [], optional: [] }
    talks_to:
      - { service: "consumed by openwebui / dify-api", purpose: "web search queries via :8080" }
    databases: []

  crawl4ai:
    name: "Crawl4AI"
    category: "Search"
    tier: experimental
    origin: US
    license: "upstream:Apache-2.0"
    edition: bundled
    github: "https://github.com/unclecode/crawl4ai"
    subdomains: ["crawl4ai"]
    containers:
      - { name: crawl4ai, image: "unclecode/crawl4ai" }
    purpose: |
      A RAG-friendly web crawler. Runs headless Chromium under Playwright,
      executes JavaScript, and emits clean Markdown / structured JSON suitable
      for direct ingestion into knowledge bases. Where SearXNG finds URLs,
      Crawl4AI fetches and distils the actual page content.
    user_facing_capabilities:
      - "Crawl a URL and get clean Markdown/JSON (not just a link)."
      - "Use a playground UI to test extraction recipes; call /crawl /scrape /llm via REST."
      - "Feed distilled pages into LightRAG / Cognee / Onyx / Dify knowledge bases."
    use_cases:
      - "Scheduled ingestion of curated URLs into a knowledge base."
      - "\"Read this URL and summarise\" on demand from chat."
    dependencies: { required: ["core"], recommended: [], optional: [] }
    talks_to:
      - { service: "consumed by dify-api / openwebui", purpose: "RAG ingestion + on-demand page distillation via :11235" }
    databases: []

# =============================================================================
# SPEECH  (Tier: production)
