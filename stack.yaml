  llm-manager:
    name: "LLM Manager"
    category: "LLM Inference"
    tier: core          # #1443: always-on since the 2026.09 cutover (#979)
    origin: AT
    license: "mixed"
    edition: mixed
    github: null
    subdomains: ["llm-manager", "llm"]
    containers:
      - { name: llm-manager, image: "razzfazz-llm-manager (built)", license: "busl-1.1", edition: enterprise }
      - { name: llm-manager-ui, image: "razzfazz-llm-manager-ui (built)", license: "busl-1.1", edition: enterprise }
      - { name: llm-manager-router, image: "ghcr.io/berriai/litellm", license: "upstream:MIT", edition: bundled, built_from: "https://github.com/BerriAI/litellm" }
    purpose: |
      Sovereign, Kubernetes-free control plane over a heterogeneous LLM fleet
      (CUDA / AMD Strix Halo / Mac / GB10): an OpenAI-compatible gateway with
      API-key auth and per-key enforcement, a streaming proxy, worker
      enrolment, desired-state deployments with placement, a model catalog,
      and the fleet console. The single front door for inference on the box
      since the 2026.09 cutover (#979); GPUStack remains an optional backend
      behind it. The router is a bundled LiteLLM proxy (OSS image, no
      enterprise features).
    dependencies: { required: ["core"], recommended: ["llm-worker-agent"], optional: ["llm-registry", "mac-llm", "llm-legacy"] }
    talks_to:
      - { service: "llm-worker-agent", purpose: "commands (load/unload engines) over the command channel; heartbeats + metrics back" }
      - { service: "consumers", purpose: "serves chat, dify, cognee, lightrag, agents via the OpenAI-compatible gateway" }

