    name: "Cognee (GraphRAG / AI Memory)"
    category: "Knowledge"
    tier: experimental
    origin: US
    license: "upstream:Apache-2.0"
    edition: bundled
    built_from: "https://github.com/topoteretes/cognee"
    github: "https://github.com/topoteretes/cognee"
