  wazuh:
    name: "Wazuh (Security Monitoring / SIEM)"
    category: "Security"
    tier: experimental
    origin: US
    # DECISION-6 (#855): the shipped distribution is NOT one licence. The module
    # default is the Wazuh server's GPL-2.0; the indexer and dashboard are
    # OpenSearch / OpenSearch-Dashboards forks and override to Apache-2.0 below.
    # GPL-2.0 is not on the add-module skill's Q32 SPDX allow-list — recorded as
    # a deliberate deviation pending legal sign-off, not a silent widening.
    license: "upstream:GPL-2.0"
    edition: bundled
    github: "https://github.com/wazuh/wazuh"
    subdomains: ["wazuh"]
    containers:
      - { name: wazuh-manager, image: "wazuh/wazuh-manager", built_from: "https://github.com/wazuh/wazuh" }
      - { name: wazuh-indexer, image: "wazuh/wazuh-indexer", license: "upstream:Apache-2.0", built_from: "https://github.com/wazuh/wazuh-indexer" }
      - { name: wazuh-dashboard, image: "wazuh/wazuh-dashboard", license: "upstream:Apache-2.0", built_from: "https://github.com/wazuh/wazuh-dashboard" }
      - { name: wazuh-certs-generator, image: "wazuh/wazuh-certs-generator", license: "upstream:Apache-2.0", built_from: "https://github.com/wazuh/wazuh-docker" }
      - { name: wazuh-securityconfig-init, image: "wazuh/wazuh-indexer", license: "upstream:Apache-2.0", built_from: "https://github.com/wazuh/wazuh-indexer" }
      - { name: wazuh-securityadmin, image: "wazuh/wazuh-indexer", license: "upstream:Apache-2.0", built_from: "https://github.com/wazuh/wazuh-indexer" }
      - { name: wazuh-dashboard-config-init, image: "wazuh/wazuh-dashboard", license: "upstream:Apache-2.0", built_from: "https://github.com/wazuh/wazuh-dashboard" }
    purpose: |
      Open-source SIEM/XDR for the box and the fleet around it: host intrusion
      detection (HIDS), file-integrity monitoring, security-configuration
      assessment against CIS benchmarks, log correlation, and built-in
      regulatory-compliance mappings (PCI DSS, GDPR, NIST 800-53). Three
      long-running services (manager, an OpenSearch-fork indexer, and the web
      console) plus four one-shots that generate the module's own TLS PKI and
      every credential it uses — no upstream demo credential survives. A
      per-box wazuh-agent reports journald, an operator-supplied allow-list of
      container logs, and file-integrity events; agent enrolment is
      password-gated and every manager listener is CIDR-fenced. Stores all
      state in its own indexer, never shared Postgres. EXPERIMENTAL, opt-in,
      in no preset.
    user_facing_capabilities:
      - "See intrusion, file-integrity and configuration-drift alerts for every enrolled box in one console."
      - "Search and correlate collected security events across the fleet."
      - "Run CIS benchmark scans and read the compliance mappings (PCI DSS, GDPR, NIST 800-53)."
    use_cases:
      - "NIS2 / ISO 27001 evidence: continuous monitoring and retained security events."
      - "Detect tampering with the stack's own configuration and host binaries."
      - "Ingest syslog over TCP from agentless sources that can be pointed at the box (UDP-only devices are not supported)."
    dependencies: { required: ["core"], recommended: [], optional: [] }
    talks_to:
      - { service: "authentik-server", purpose: "forward_auth gate + native OIDC login for the dashboard" }
    databases: []

