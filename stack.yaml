    subdomains: []
    containers:
      - { name: llm-registry, image: "ghcr.io/project-zot/zot-linux-amd64", license: "upstream:Apache-2.0", edition: bundled, built_from: "https://github.com/project-zot/zot" }
    purpose: |
      Content-addressed OCI registry (Zot) holding model artifacts (GGUF,
      safetensors, mmproj) and runner images as OCI blobs for the LLM Manager
      fleet. Nodes pull artifacts BY DIGEST into their models volume —
      deduplicated, verifiable, and the only registry a worker may pull a
      runner from (air-gap invariant, #307/#549).
    dependencies: { required: ["core", "llm-manager"], recommended: [], optional: [] }
    talks_to:
      - { service: "llm-worker-agent", purpose: "serves model + runner blobs by digest" }

  llm-worker-agent:
    name: "LLM Worker-Agent"
    category: "LLM Inference"
    tier: core          # #1443: always-on since the 2026.09 cutover (#979)
    origin: AT
    license: "busl-1.1"
    edition: enterprise
    github: null
    subdomains: []
    containers:
      - { name: llm-worker-agent, image: "razzfazz-llm-worker-agent (built)", license: "busl-1.1", edition: enterprise }
    purpose: |
      Per-node agent of the LLM Manager: enrols the box as a worker, launches
      and supervises engine containers (llama.cpp on AMD Vulkan / CPU, vLLM or
      llama.cpp on CUDA, the GB10 class) per the manager's deployments, and
      self-registers what it serves. Drives docker through a scoped socket
      proxy; the thin worker install (two containers) is the whole footprint
      of an inference-only node.
    dependencies: { required: ["core"], recommended: ["llm-manager"], optional: ["llm-registry"] }
    talks_to:
      - { service: "llm-manager", purpose: "enrolment, heartbeats, command channel" }
      - { service: "llm-registry", purpose: "pulls model artifacts + runner images by digest" }

