# razzfazz.ai — kernel stability tunables
# ============================================================================
# Installed by razzfazz-init.sh / razzfazz-upgrade.sh into /etc/sysctl.d/
# and applied via `sysctl --system`. Designed for the Strix Halo single-box
# layout (32 GiB host RAM + 96 GiB BIOS-pinned VRAM) running sustained LLM
# inference workloads.
#
# Motivation: the M018 / S03.1 stress test surfaced a host-OOM cascade after
# ~5 hours of phase-3 inference. The kernel OOM-killed llama-server, but
# subsequent svm/userptr workqueue thrash left the box network-unreachable
# without panicking — required manual reboot after ~5 hours of silent hang.
# These settings make the kernel reboot promptly when it can't recover, so
# the stack comes back via the docker `restart: unless-stopped` policy
# instead of needing operator intervention.
# ============================================================================

# Panic on system-wide OOM events.
# 0 = kill offending (largest) process. Kernel default. **CURRENT CHOICE
#     (operator decision 2026-05-07)** after a panic+reboot cycle on the dev
#     box terminated a working session. Rebooting an entire box to contain a
#     single oversized process is the wrong trade for any host where the
#     operator cares about uptime of OTHER processes (dev sessions, SSH
#     connections, parallel test workloads, etc.). Letting the OOM-killer
#     pick the largest cgroup process matches what most users intuit when
#     they say "out of memory." Recovery story:
#       - Process gets killed → docker restart-policy or systemd restarts it.
#       - For gpustack v2.x EXPERIMENTAL: leaked server gets killed, container
#         restarts, models re-spawn (~30s outage on chat, then green).
#       - For gpustack v0.7.1 STABLE (M029-S04 default): leak-free per S01,
#         this path basically never fires.
# 1 = panic on system-wide OOM only. Previous choice; motivated by the
#     M018/S03.1 silent-hang cascade where amdgpu svm/userptr workqueue thrash
#     continued after the OOM-killer ran. Flipped 2026-05-07 because (a) the
#     original cascade was on v2.x gpustack with no cgroup mem_limits;
#     (b) since then we've added the bus_fix backport plus per-container
#     mem_limits which contain the leak before it reaches host OOM; (c) M029-
#     S04 promotes v0.7.1 (no leak) to the stable default.
# 2 = panic on any OOM, including cgroup OOMs. Tried in rc6.7 #48, caused
#     reboot loops; reverted in rc6.7 #50.
vm.panic_on_oom = 0

# Reboot N seconds after panic (0 = halt forever; bad for unattended servers).
# 10 s gives time for a kernel crash dump to drain before reboot.
kernel.panic = 10

# Also panic on kernel oops (typically a precursor to deeper hangs).
# Combined with kernel.panic = 10, an oops triggers a clean reboot.
kernel.panic_on_oops = 1

# Don't kill the task that asked for memory; kill the biggest hog.
# (default; kept here for clarity / explicit-is-better-than-implicit)
vm.oom_kill_allocating_task = 0

# Reduce the kernel's eagerness to swap process pages out under VRAM/SVM
# pressure. With unified-memory APUs the kernel can mistake amdgpu's
# SVM-managed ranges as swappable; lowering swappiness keeps the LLM
# working set resident.
vm.swappiness = 10

# OpenSearch-family engines (wazuh-indexer, Profile: wazuh [EXPERIMENTAL])
# refuse to start below this mmap limit — a hard runtime requirement of the
# Lucene index engine, not a tuning knob. Harmless / zero cost when the wazuh
# profile is disabled, so it is applied unconditionally rather than gated on a
# profile (the writer is a straight `cp` with no profile awareness). This is a
# FLEET-WIDE change for an opt-in module — see DECISION-8 in
# docs/superpowers/plans/2026-08-29-855-wazuh-module-integration.md.
# Repair on a box installed before this line landed:
#   sudo cp core/sysctl/99-razzfazz-stability.conf /etc/sysctl.d/ && sudo sysctl --system
vm.max_map_count = 262144
