# razzfazz.ai fleet hardening (#675): kernel 7.0.0-22 panics at boot in
# lp_register -> sysfs (kernfs_get BUG, RIP 0x0 in filp_flush) when
# systemd-modules autoloads the parallel-port stack — observed as a full
# boot-panic loop on worker 10.163 (RCA 2026-08-24). No box in the fleet
# has a parallel-port use case; blacklisting the whole stack removes the
# trigger. Installed by rzfz upgrade (install_parport_blacklist) and baked
# into the appliance autoinstall.
blacklist lp
blacklist ppdev
blacklist parport_pc
blacklist parport
