version: 1
metadata:
  name: "Module - Onyx AI Search"
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # ==========================================
  # Provider: Caddy Forward Auth for Onyx
  # ==========================================
  - model: authentik_providers_proxy.proxyprovider
    identifiers:
      name: "Caddy Forward Auth Provider for Onyx"
    attrs:
      client_id: "onyx_app_client_id"
      client_secret: "${ONYX_CLIENT_SECRET}"
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      external_host: "https://${ONYX_DOMAIN}"
      mode: forward_single
      intercept_header_auth: true
      access_token_validity: "hours=24"
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'email'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'profile'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: Proxy outpost"]]

  # ==========================================
  # Application: AI Search (Onyx)
  # ==========================================
  - model: authentik_core.application
    identifiers:
      slug: onyx
    attrs:
      name: Search
      group: "1 Productivity"
      provider: !Find [authentik_providers_proxy.proxyprovider, [name, "Caddy Forward Auth Provider for Onyx"]]
      meta_launch_url: "blank://blank"
      meta_description: "AI-powered enterprise search across Gitea repos and documents"
      meta_publisher: "Onyx"
      icon: "https://${AUTHENTIK_DOMAIN}/branding/razzfazz-ai_search_icon.png"
      open_in_new_tab: true
      policy_engine_mode: any
