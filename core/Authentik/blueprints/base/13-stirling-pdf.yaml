version: 1
metadata:
  name: "Module - Stirling-PDF"
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # ==========================================
  # Provider: Caddy Forward Auth for Stirling-PDF
  # ==========================================
  - model: authentik_providers_proxy.proxyprovider
    identifiers:
      name: "Caddy Forward Auth Provider for Stirling-PDF"
    attrs:
      client_id: "stirling_pdf_app_client_id"
      client_secret: "${STIRLING_CLIENT_SECRET}"
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      external_host: "https://pdf.${MAIN_DOMAIN}"
      mode: forward_single
      intercept_header_auth: true
      access_token_validity: "hours=24"
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'email'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'profile'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: Proxy outpost"]]

  # ==========================================
  # Application: PDF Tools
  # ==========================================
  - model: authentik_core.application
    identifiers:
      slug: stirling-pdf
    attrs:
      name: PDF Tools
      group: "1 Productivity"
      provider: !Find [authentik_providers_proxy.proxyprovider, [name, "Caddy Forward Auth Provider for Stirling-PDF"]]
      meta_launch_url: "blank://blank"
      meta_description: "PDF manipulation and processing suite"
      meta_publisher: "Stirling-PDF"
      icon: "https://${AUTHENTIK_DOMAIN}/branding/razzfazz-ai_pdf_icon.png"
      open_in_new_tab: true
      policy_engine_mode: any
