---
# Blueprint: Personal MCP Manager — BACKEND-ONLY forward-auth (#36 / #61)
# Profile: mcp
#
# UNIFICATION (#36/#61): the MCP Manager is no longer a separate user-facing
# app. The single user-facing application is "MCP & Agent Manager" (slug
# my-agents, blueprint 28-my-agents.yaml). This blueprint now provides ONLY
# the forward-auth plumbing that keeps the mcp.${MAIN_DOMAIN} site SSO-gated:
#   * the "Caddy Forward Auth Provider for MCP" proxy provider, and
#   * a hidden backing Application (Authentik requires a provider↔application
#     link to route the provider through the embedded outpost).
#
# The backing app:
#   * meta_launch_url=blank://blank  → NO tile in the Authentik App library,
#   * is bound to the SAME single group as the combined app
#     ("razzfazz.ai AI Agents Users", via apply-policy-bindings.py) so
#     mcp.${MAIN_DOMAIN} is access-gated identically to the agent dashboard,
#   * is reached ONLY via the "MCP Integrations" link on the combined
#     dashboard at AGENTS_DOMAIN — never as its own start-portal tile.
#
# The provider is auto-attached to the embedded outpost by
# apply-policy-bindings.py (do NOT add it to 04-outposts.yaml — mcp is
# profile-gated).
version: 1
metadata:
  name: "31 — MCP Manager (backend forward-auth)"
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # ==========================================
  # Provider: Caddy Forward Auth for MCP Manager
  # ==========================================
  - model: authentik_providers_proxy.proxyprovider
    identifiers:
      name: "Caddy Forward Auth Provider for MCP"
    attrs:
      client_id: "mcp_manager_client_id"
      client_secret: "${MCP_CLIENT_SECRET}"
      external_host: "https://${MCP_DOMAIN}"
      mode: forward_single
      intercept_header_auth: true
      access_token_validity: "hours=24"
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'email'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'profile'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: Proxy outpost"]]

  # ==========================================
  # Application: MCP Manager (hidden backend — no tile)
  # ==========================================
  # Exists solely so the forward-auth provider above routes through the
  # embedded outpost and can carry policy bindings. NOT a user-facing app:
  # meta_launch_url=blank://blank keeps it out of the Authentik App library,
  # and it is deliberately NOT surfaced as a start-portal tile. Users reach
  # the MCP dashboard through the combined "MCP & Agent Manager" (slug
  # my-agents) → "MCP Integrations" link. Bound to the single group
  # "razzfazz.ai AI Agents Users" in apply-policy-bindings.py so mcp.<domain>
  # is access-gated identically to the combined dashboard.
  - model: authentik_core.application
    identifiers:
      slug: mcp
    attrs:
      name: "MCP Manager (backend)"
      group: "2 AI Assistants"
      provider: !Find [authentik_providers_proxy.proxyprovider, [name, "Caddy Forward Auth Provider for MCP"]]
      meta_launch_url: "blank://blank"
      meta_description: "Backend forward-auth for the MCP dashboard — reached via MCP & Agent Manager."
      meta_publisher: "razzfazz.ai"
      icon: "https://${AUTHENTIK_DOMAIN}/branding/razzfazz-ai_mcp_icon.png"
      open_in_new_tab: true
      policy_engine_mode: any
