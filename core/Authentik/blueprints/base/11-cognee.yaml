version: 1
metadata:
  name: "Module - Cognee"
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # ==========================================
  # Group: Cognee Users
  # ==========================================
  - model: authentik_core.group
    identifiers:
      name: "razzfazz.ai Cognee Users"

  # ==========================================
  # Provider: Caddy Forward Auth for Cognee
  # ==========================================
  - model: authentik_providers_proxy.proxyprovider
    identifiers:
      name: "Caddy Forward Auth Provider for Cognee"
    attrs:
      client_id: "cognee_app_client_id"
      client_secret: "${COGNEE_CLIENT_SECRET}"
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      external_host: "https://${COGNEE_DOMAIN}"
      mode: forward_single
      intercept_header_auth: true
      access_token_validity: "hours=24"
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'email'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'profile'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: Proxy outpost"]]

  # ==========================================
  # Application: Cognee Knowledge Engine
  # ==========================================
  - model: authentik_core.application
    identifiers:
      slug: cognee
    attrs:
      name: Cognee Knowledge Engine
      group: "3 Knowledge & Search"
      provider: !Find [authentik_providers_proxy.proxyprovider, [name, "Caddy Forward Auth Provider for Cognee"]]
      meta_launch_url: "blank://blank"
      meta_description: "GraphRAG knowledge engine for AI agent memory"
      meta_publisher: "Cognee"
      icon: "https://${AUTHENTIK_DOMAIN}/branding/razzfazz-ai_cognee_icon.png"
      open_in_new_tab: true
      policy_engine_mode: any
