version: 1
metadata:
  name: "Base - Apps and Providers"
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # ==========================================
  # 1. Chat (Open WebUI)
  # ==========================================
  # Forced refresh 2026-01-26
  - model: authentik_providers_proxy.proxyprovider

    identifiers:
      name: "Caddy Forward Auth Provider To Chat"
    attrs:
      client_id: "x94xyVeA1kkV2n8zZhXgXoQOkBsPy3YvynDhFvFk"
      client_secret: "${CHAT_CLIENT_SECRET}"
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      external_host: "https://${OPENWEBUI_DOMAIN}"
      mode: forward_single
      intercept_header_auth: true
      access_token_validity: "hours=24"
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'email'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'profile'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: Proxy outpost"]]

  - model: authentik_core.application
    identifiers:
      slug: chat
    attrs:
      name: Chat
      group: "1 Productivity"
      provider: !Find [authentik_providers_proxy.proxyprovider, [name, "Caddy Forward Auth Provider To Chat"]]
      meta_launch_url: "blank://blank"   # M028 S05-redo: hidden from Authentik App library; tile lives in start-portal manifest
      meta_description: "The razzfazz.ai recommend way to chat with local AI models."
      meta_publisher: "Open WebUI LLM Chat"
      icon: "https://${AUTHENTIK_DOMAIN}/branding/razzfazz-ai_chat_icon.png"
      open_in_new_tab: true
      policy_engine_mode: any

