      meta_launch_url: "blank://blank"   # M028 S05-redo: hidden; tile lives in start-portal manifest
      meta_description: "Workflow automation, RAG, Agentic AI"
      meta_publisher: "Dify.ai"
      icon: "https://${AUTHENTIK_DOMAIN}/branding/razzfazz-ai_workflow_icon.png"
      open_in_new_tab: true
      policy_engine_mode: any

