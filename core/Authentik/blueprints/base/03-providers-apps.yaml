  # ==========================================
  # 7. (#22) Setup app removed in 2026.07 — the setup.<domain> web UI is
  #    gone. Its functions live in the Configuration Portal (config.<domain>,
  #    already gated by the razzfazz-config app) and the host `rzfz setup`
  #    CLI. The Caddy forward_auth provider + application have been removed.
  # ==========================================

