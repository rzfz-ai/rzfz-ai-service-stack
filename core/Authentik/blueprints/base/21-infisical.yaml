version: 1
metadata:
  name: "Module - Infisical"
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # ==========================================
  # Provider: Caddy Forward Auth for Infisical
  # ==========================================
  - model: authentik_providers_proxy.proxyprovider
    identifiers:
      name: "Caddy Forward Auth Provider for Infisical"
    attrs:
      client_id: "infisical_app_client_id"
      client_secret: "${INFISICAL_CLIENT_SECRET}"
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      external_host: "https://${INFISICAL_DOMAIN}"
      mode: forward_single
      intercept_header_auth: true
      access_token_validity: "hours=24"
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'email'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'profile'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: Proxy outpost"]]

  # ==========================================
  # Application: Infisical Secrets Management
  # ==========================================
  - model: authentik_core.application
    identifiers:
      slug: infisical
    attrs:
      name: Secrets Manager
      group: "5 Administration"
      provider: !Find [authentik_providers_proxy.proxyprovider, [name, "Caddy Forward Auth Provider for Infisical"]]
      meta_launch_url: "blank://blank"
      meta_description: "Self-hosted secrets management for developers and AI coding agents"
      meta_publisher: "Infisical, Inc."
      icon: "https://${AUTHENTIK_DOMAIN}/branding/razzfazz-ai_secrets_icon.png"
      open_in_new_tab: true
      policy_engine_mode: any
