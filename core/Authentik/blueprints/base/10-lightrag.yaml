version: 1
metadata:
  name: "Module - LightRAG"
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # ==========================================
  # Group: RAG Users
  # ==========================================
  - model: authentik_core.group
    identifiers:
      name: "razzfazz.ai RAG Users"

  # ==========================================
  # Provider: Caddy Forward Auth for LightRAG
  # ==========================================
  - model: authentik_providers_proxy.proxyprovider
    identifiers:
      name: "Caddy Forward Auth Provider for LightRAG"
    attrs:
      client_id: "lightrag_app_client_id"
      client_secret: "${LIGHTRAG_CLIENT_SECRET}"
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      external_host: "https://${LIGHTRAG_DOMAIN}"
      mode: forward_single
      intercept_header_auth: true
      access_token_validity: "hours=24"
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'email'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'profile'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: Proxy outpost"]]

  # ==========================================
  # Application: RAG Knowledge Base
  # ==========================================
  - model: authentik_core.application
    identifiers:
      slug: lightrag
    attrs:
      name: RAG Knowledge Base
      group: "3 Knowledge & Search"
      provider: !Find [authentik_providers_proxy.proxyprovider, [name, "Caddy Forward Auth Provider for LightRAG"]]
      meta_launch_url: "blank://blank"
      meta_description: "Graph-based RAG knowledge management"
      meta_publisher: "LightRAG"
      icon: "https://${AUTHENTIK_DOMAIN}/branding/razzfazz-ai_rag_icon.png"
      open_in_new_tab: true
      policy_engine_mode: any
