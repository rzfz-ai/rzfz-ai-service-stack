version: 1
metadata:
  name: "Module - LLM Manager UI"
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # ==========================================
  # Provider: Caddy Forward Auth for the LLM Manager console
  # (llm-manager.<domain>). Distinct from "…for LLM" (GPUStack, llm.<domain>).
  # init-authentik.sh auto-attaches every ProxyProvider to the embedded outpost.
  # ==========================================
  - model: authentik_providers_proxy.proxyprovider
    identifiers:
      name: "Caddy Forward Auth Provider for LLM Manager"
    attrs:
      client_id: "llm_manager_app_client_id"
      client_secret: "${LLM_MANAGER_UI_CLIENT_SECRET}"
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      external_host: "https://${LLM_DOMAIN}"
      mode: forward_single
      intercept_header_auth: true
      access_token_validity: "hours=24"
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'email'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'profile'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: Proxy outpost"]]

  # ==========================================
  # Application: LLM Manager (console). Hidden from the library
  # (meta_launch_url blank://blank, M028 pattern) — reached at llm.<domain> (#1444; llm-manager.<domain> 301s there);
  # the start-portal tile repoint from GPUStack lands in Phase-3 S5. Access to
  # the *actions* is additionally gated by the manager's require_admin on /api/*.
  # ==========================================
  - model: authentik_core.application
    identifiers:
      slug: llm-manager
    attrs:
      name: "LLM Manager"
      group: "7 LLM Infrastructure"
      provider: !Find [authentik_providers_proxy.proxyprovider, [name, "Caddy Forward Auth Provider for LLM Manager"]]
      meta_launch_url: "blank://blank"
      meta_description: "Sovereign control plane over the LLM fleet — keys, deployments, usage."
      meta_publisher: "razzfazz.ai"
      icon: "https://${AUTHENTIK_DOMAIN}/branding/razzfazz-ai_llm_icon.png"
      open_in_new_tab: true
      policy_engine_mode: any
