version: 1
metadata:
  name: "Module - Docling"
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # ==========================================
  # Provider: Caddy Forward Auth for Docling
  # ==========================================
  - model: authentik_providers_proxy.proxyprovider
    identifiers:
      name: "Caddy Forward Auth Provider for Docling"
    attrs:
      client_id: "docling_app_client_id"
      client_secret: "${DOCLING_CLIENT_SECRET}"
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      external_host: "https://docling.${MAIN_DOMAIN}"
      mode: forward_single
      intercept_header_auth: true
      access_token_validity: "hours=24"
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'email'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'profile'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: Proxy outpost"]]

  # ==========================================
  # Application: Docling Document Converter
  # ==========================================
  - model: authentik_core.application
    identifiers:
      slug: docling
    attrs:
      name: Docling Converter
      group: "2 Documents"
      provider: !Find [authentik_providers_proxy.proxyprovider, [name, "Caddy Forward Auth Provider for Docling"]]
      meta_launch_url: "blank://blank"
      meta_description: "Document conversion and understanding API with Gradio UI"
      meta_publisher: "IBM / Docling Project"
      icon: "https://${AUTHENTIK_DOMAIN}/branding/razzfazz-ai_docling_icon.png"
      open_in_new_tab: true
      policy_engine_mode: any
