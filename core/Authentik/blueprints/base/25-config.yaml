version: 1
metadata:
  name: "Module - Configuration UI"
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # ==========================================
  # Provider: Caddy Forward Auth for Config UI
  # ==========================================
  - model: authentik_providers_proxy.proxyprovider
    identifiers:
      name: "Caddy Forward Auth Provider for Config"
    attrs:
      client_id: "config_app_client_id"
      # #386 (F-P4-12): generated per box — was the last hardcoded literal
      # of the F-P4-12 remediation, published to the public mirror.
      client_secret: "${CONFIG_CLIENT_SECRET}"
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      # #1200 (2026.09): the portal answers on settings.<domain>. The embedded
      # outpost matches the forward_auth Host against this value — a stale
      # config.<domain> here 404s every request on the new name (INIT_VERSION
      # 4.4 re-applies it on upgrade).
      external_host: "https://${SETTINGS_DOMAIN}"
      mode: forward_single
      intercept_header_auth: true
      access_token_validity: "hours=24"
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'email'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'profile'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: Proxy outpost"]]

  # ==========================================
  # Application: Configuration
  # ==========================================
  - model: authentik_core.application
    identifiers:
      slug: config
    attrs:
      name: razzfazz.ai Management
      group: "8 Administration"
      provider: !Find [authentik_providers_proxy.proxyprovider, [name, "Caddy Forward Auth Provider for Config"]]
      meta_launch_url: "blank://blank"
      meta_description: "Stack management — modules, backup, governance, security"
      meta_publisher: "razzfazz.ai"
      icon: "https://${AUTHENTIK_DOMAIN}/branding/razzfazz-ai_setup_icon.png"
      open_in_new_tab: true
      policy_engine_mode: any
