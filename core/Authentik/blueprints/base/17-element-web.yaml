version: 1
metadata:
  name: "Module - Element Web"
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # ==========================================
  # Provider: Caddy Forward Auth for Element Web
  # ==========================================
  - model: authentik_providers_proxy.proxyprovider
    identifiers:
      name: "Caddy Forward Auth Provider for Element Web"
    attrs:
      client_id: "element_web_app_client_id"
      client_secret: "${ELEMENT_WEB_CLIENT_SECRET}"
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      external_host: "https://${ELEMENT_WEB_DOMAIN}"
      mode: forward_single
      intercept_header_auth: true
      access_token_validity: "hours=24"
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'email'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'profile'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: Proxy outpost"]]

  # ==========================================
  # Application: Element Web (Matrix Browser Client)
  # ==========================================
  - model: authentik_core.application
    identifiers:
      slug: element-web
    attrs:
      name: Matrix
      group: "1 Productivity"
      provider: !Find [authentik_providers_proxy.proxyprovider, [name, "Caddy Forward Auth Provider for Element Web"]]
      meta_launch_url: "blank://blank"
      icon: "https://${AUTHENTIK_DOMAIN}/branding/razzfazz-ai_matrix_icon.png"
      meta_description: "Matrix browser client — encrypted messaging, rooms, and direct messages via the razzfazz.ai Matrix homeserver"
      meta_publisher: "Element HQ"
      open_in_new_tab: true
      policy_engine_mode: any
