version: 1
metadata:
  name: "Module - OpenUEM"
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # ==========================================
  # Provider: Caddy Forward Auth for OpenUEM
  # ==========================================
  # DECISION-2 (#1075): forward_auth, not native OIDC. OpenUEM DOES support
  # OIDC (>= 0.10.0, with Authentik among the documented providers), but it is
  # configured from inside the console's Authentication admin section and stored
  # in the database — there is no OIDC environment variable to template. A
  # blueprint alone therefore cannot enable it, and shipping an OAuth2Provider
  # whose credentials nothing reads would be a decoration. Enabling console-side
  # OIDC is a separate, box-gated slice.
  # ==========================================
  - model: authentik_providers_proxy.proxyprovider
    identifiers:
      name: "Caddy Forward Auth Provider for OpenUEM"
    attrs:
      client_id: "openuem_app_client_id"
      client_secret: "${OPENUEM_CLIENT_SECRET}"
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      external_host: "https://${OPENUEM_DOMAIN}"
      mode: forward_single
      intercept_header_auth: true
      access_token_validity: "hours=24"
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'email'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'profile'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: Proxy outpost"]]

  # ==========================================
  # Application: OpenUEM
  # ==========================================
  - model: authentik_core.application
    identifiers:
      slug: openuem
    attrs:
      name: OpenUEM
      group: "8 Administration"
      provider: !Find [authentik_providers_proxy.proxyprovider, [name, "Caddy Forward Auth Provider for OpenUEM"]]
      meta_launch_url: "blank://blank"
      meta_description: "Unified endpoint management — inventory, software deployment and remote assistance for the fleet"
      meta_publisher: "OpenUEM"
      icon: "https://${AUTHENTIK_DOMAIN}/branding/razzfazz-ai_admin_icon.png"
      open_in_new_tab: true
      policy_engine_mode: any
