version: 1
metadata:
  name: "Module - Start Portal (M028)"
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # ==========================================
  # Provider: Caddy Forward Auth for Start Portal
  # ==========================================
  - model: authentik_providers_proxy.proxyprovider
    identifiers:
      name: "Caddy Forward Auth Provider for Start Portal"
    attrs:
      client_id: "start_portal_app_client_id"
      client_secret: "${START_PORTAL_CLIENT_SECRET}"
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
      # Start portal is the SSO landing: logout must end the whole Authentik
      # session, so use the brand invalidation flow (has the user_logout stage).
      # The provider-default flow is an empty no-op → "Logout successful" but the
      # core session survives (half-logged-in; forward-auth silently re-admits).
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
      external_host: "https://${START_DOMAIN}"
      mode: forward_single
      intercept_header_auth: true
      access_token_validity: "hours=24"
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'email'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'profile'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: Proxy outpost"]]

  # ==========================================
  # Application: Start Portal — appears in the Authentik App library
  # ==========================================
  - model: authentik_core.application
    identifiers:
      slug: start
    attrs:
      name: Start Portal
      group: "0 Launch"
      provider: !Find [authentik_providers_proxy.proxyprovider, [name, "Caddy Forward Auth Provider for Start Portal"]]
      meta_launch_url: "${START_LAUNCH_URL}"
      meta_description: "Personalized launcher — your applications, agents, and favorites"
      meta_publisher: "razzfazz.ai"
      icon: "https://${AUTHENTIK_DOMAIN}/branding/razzfazz-ai_home_icon.png"
      open_in_new_tab: false
      policy_engine_mode: any
