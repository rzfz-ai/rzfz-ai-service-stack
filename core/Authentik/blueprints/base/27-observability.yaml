version: 1
metadata:
  name: "Module - Observability"
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # ==========================================
  # Group: Observability Users
  # ==========================================
  - model: authentik_core.group
    identifiers:
      name: "razzfazz.ai Observability Users"

  # ==========================================
  # Provider: Caddy Forward Auth for Observability
  # ==========================================
  - model: authentik_providers_proxy.proxyprovider
    identifiers:
      name: "Caddy Forward Auth Provider for Observability"
    attrs:
      client_id: "observability_app_client_id"
      client_secret: "${OBSERVABILITY_CLIENT_SECRET}"
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      external_host: "https://${OBSERVABILITY_DOMAIN}"
      mode: forward_single
      intercept_header_auth: true
      access_token_validity: "hours=24"
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'email'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'profile'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: Proxy outpost"]]

  # ==========================================
  # Application: Observability
  # ==========================================
  - model: authentik_core.application
    identifiers:
      slug: observability
    attrs:
      name: "Observability"
      group: "7 LLM Infrastructure"
      provider: !Find [authentik_providers_proxy.proxyprovider, [name, "Caddy Forward Auth Provider for Observability"]]
      meta_launch_url: "blank://blank"
      meta_description: "Stack-wide LLM observability: cost, latency, tokens, prompt analysis."
      meta_publisher: "OpenLIT"
      icon: "https://${AUTHENTIK_DOMAIN}/branding/razzfazz-ai_admin_icon.png"
      open_in_new_tab: true
      policy_engine_mode: any
