version: 1
metadata:
  name: "Module - OpenBao"
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # ==========================================
  # #2476: OpenBao — DUAL-LAYER, the 37-wazuh.yaml shape
  # ==========================================
  # Caddy forward_auths the whole bao.<domain> vhost (core/Caddy/Caddyfile
  # §23b), so the embedded outpost needs a PROXY provider to match the host
  # against; OpenBao's own UI and CLI sign-in is native OIDC on a second,
  # hidden application. apply-policy-bindings.py binds BOTH applications to
  # the role catalogue's openbao groups (openbao/admin ∪ openbao/user) and
  # attaches the proxy provider to the embedded outpost in its attach-ALL loop.
  # init-authentik.sh deploys this file only with the openbao profile and all
  # three credentials set (gate_openbao_blueprint).
  - model: authentik_providers_proxy.proxyprovider
    identifiers:
      name: "Caddy Forward Auth Provider for OpenBao"
    attrs:
      client_id: "openbao_app_client_id"
      client_secret: "${OPENBAO_CLIENT_SECRET}"
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      external_host: "https://${OPENBAO_DOMAIN}"
      mode: forward_single
      intercept_header_auth: true
      access_token_validity: "hours=24"
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'email'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'profile'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: Proxy outpost"]]

  # ==========================================
  # Layer 2: native OIDC provider for OpenBao's `oidc/` auth mount
  # ==========================================
  # Decision record D8/D9: a person's OpenBao paths are keyed by the `sub`
  # (OpenBao's role default: user_claim=sub, so the entity alias NAME is the
  # sub). sub_mode is set EXPLICITLY to hashed_user_id — Authentik documents
  # that `sub` as the user's `uid`, which is what the purge reconcile compares
  # with the Authentik users that exist. An upstream default change must not
  # move every user's path. The groups mapping carries the `groups` claim the
  # external groups (catalogue roles, teams) are matched on.
  # Redirect URI: the UI callback only. The CLI is used on the box (rzfz
  # openbao admin-shell, docker exec); bao.<domain> stays behind forward-auth
  # for every path but /v1/sys/health.
  # The purge's confirmation (decision record D9, A17's owner rule): the
  # user's Authentik pk as the claim rzfz_pk, which OpenBao's role copies
  # into the identity alias's metadata (claim_mappings rzfz_pk=ak_pk). A
  # deleted user is purged only after a direct lookup of that pk answers 404.
  - model: authentik_providers_oauth2.scopemapping
    identifiers:
      name: "razzfazz.ai OAuth Mapping: openbao pk"
    attrs:
      name: "razzfazz.ai OAuth Mapping: openbao pk"
      scope_name: "rzfz_pk"
      description: "razzfazz.ai: the user's Authentik pk, for OpenBao's deleted-user purge"
      expression: |
        return {"rzfz_pk": str(request.user.pk)}

  - model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: "OpenBao OIDC Provider"
    attrs:
      client_id: "${OPENBAO_OIDC_CLIENT_ID}"
      client_secret: "${OPENBAO_OIDC_CLIENT_SECRET}"
      client_type: confidential
      # ga.10 (#OIDC-grant-types): Authentik 2026.5.x requires grant_types.
      grant_types:
        - authorization_code
        - refresh_token
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      redirect_uris:
        - matching_mode: strict
          url: "https://${OPENBAO_DOMAIN}/ui/vault/auth/oidc/oidc/callback"
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      access_code_validity: "minutes=1"
      access_token_validity: "hours=1"
      refresh_token_validity: "days=1"
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'openid'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'email'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'profile'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "razzfazz.ai OAuth Mapping: groups"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "razzfazz.ai OAuth Mapping: openbao pk"]]

  # ==========================================
  # Application: OpenBao — the GATED one (holds the proxy provider)
  # ==========================================
  - model: authentik_core.application
    identifiers:
      slug: openbao
    attrs:
      name: OpenBao
      group: "4 Security & Secrets"
      provider: !Find [authentik_providers_proxy.proxyprovider, [name, "Caddy Forward Auth Provider for OpenBao"]]
      meta_launch_url: "blank://blank"
      meta_description: "Secrets management — personal, team and application secrets"
      meta_publisher: "OpenBao"
      open_in_new_tab: true
      policy_engine_mode: any

  # ==========================================
  # Application: OpenBao (OIDC) — hidden, and bound too
  # ==========================================
  # Unlike wazuh-oidc it is policy-bound (the same groups as `openbao`): an
  # OAuth2 application without a binding is open to every Authentik user
  # (#2090), and OpenBao's CLI login reaches it without passing the proxy app.
  # Discovery: https://${AUTHENTIK_DOMAIN}/application/o/openbao-oidc/ (the slug).
  - model: authentik_core.application
    identifiers:
      slug: openbao-oidc
    attrs:
      name: OpenBao (OIDC)
      group: ""
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, "OpenBao OIDC Provider"]]
      meta_description: "OpenBao native OIDC sign-in (internal)"
      open_in_new_tab: false
      policy_engine_mode: any
