version: 1
metadata:
  name: "Module - Paperless-ngx"
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # ==========================================
  # Group: razzfazz.ai Paperless Users
  # ==========================================
  - model: authentik_core.group
    identifiers:
      name: "razzfazz.ai Paperless Users"
    attrs:
      name: "razzfazz.ai Paperless Users"

  # ==========================================
  # Provider: Caddy Forward Auth for Paperless-ngx
  # ==========================================
  - model: authentik_providers_proxy.proxyprovider
    identifiers:
      name: "Caddy Forward Auth Provider for Paperless-ngx"
    attrs:
      client_id: "paperless_app_client_id"
      client_secret: "${PAPERLESS_CLIENT_SECRET}"
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      external_host: "https://${PAPERLESS_DOMAIN}"
      mode: forward_single
      intercept_header_auth: true
      access_token_validity: "hours=24"
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'email'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'profile'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: Proxy outpost"]]

  # ==========================================
  # Application: Documents (paperless-ngx)
  # ==========================================
  - model: authentik_core.application
    identifiers:
      slug: paperless-ngx
    attrs:
      name: Documents
      group: "2 Documents"
      provider: !Find [authentik_providers_proxy.proxyprovider, [name, "Caddy Forward Auth Provider for Paperless-ngx"]]
      meta_launch_url: "blank://blank"
      meta_description: "Scan, archive, and search your physical documents with OCR"
      meta_publisher: "paperless-ngx Project"
      icon: "https://${AUTHENTIK_DOMAIN}/branding/razzfazz-ai_documents_icon.png"
      open_in_new_tab: true
      policy_engine_mode: any
