version: 1
metadata:
  name: "Entra - Policies"
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - model: authentik_policies_expression.expressionpolicy
    identifiers:
      name: "Entra - Domain Restriction"
    attrs:
      execution_logging: true
      expression: |
        # Optional domain restriction — blocks guest accounts whose email/UPN
        # does not match ENTRA_OAUTH_DOMAIN. If the domain is empty, all users
        # from the configured tenant are allowed through.
        domain = "${ENTRA_OAUTH_DOMAIN}"
        if not domain:
            return True

        userinfo = context.get("oauth_userinfo", {})
        email = userinfo.get("email", "")
        upn   = userinfo.get("preferred_username", "")

        for candidate in (email, upn):
            if candidate.lower().endswith("@" + domain.lower()):
                return True

        ak_logger.warning(
            f"Entra domain policy: rejected email={email!r} upn={upn!r} "
            f"(required domain: @{domain})"
        )
        return False

  # A first Microsoft sign-in whose e-mail matches an existing account is LINKED
  # to it (13-source.yaml, user_matching_mode email_link) and signs in as that
  # account with all its groups, administrators included. The domain restriction
  # above runs only when a new user is created, never on a link. Microsoft's
  # e-mail claim is not verified, so this policy, bound on the source
  # authentication flow (12-flows.yaml, policy engine mode `all`), lets a link
  # happen only when
  #   * Microsoft vouches that the tenant owns the address: the ID token's
  #     `xms_edov` claim is true for exactly this e-mail (the mapping
  #     "razzfazz.ai - E-mail link proof (Entra)" passes it on), and
  #   * the address's domain is on this box's allowed list (ENTRA_OAUTH_DOMAIN,
  #     one domain or a comma/space separated list; empty = no link at all).
  # Everything else is refused with a message; nothing is linked, nobody is
  # signed in. A returning user (the source connection exists already), a
  # first sign-in that creates a new user (the enrollment flow) and a link the
  # user makes while signed in (account settings) are not affected. Other
  # sources pass through. Never raises: an error refuses the link.
  - model: authentik_policies_expression.expressionpolicy
    identifiers:
      name: "razzfazz.ai - Link by e-mail (Microsoft)"
    attrs:
      execution_logging: true
      expression: |
        SLUG = "entra"
        CONNECTION = "goauthentik.io/sources/connection"
        REFUSED = ("This Microsoft account matches an existing account here, but Microsoft "
                   "did not confirm that your organisation owns its e-mail address, so it was "
                   "not connected. Sign in the usual way and connect Microsoft under your "
                   "account settings, or ask your administrator.")
        try:
            ctx = request.context
            if getattr(ctx.get("source"), "slug", None) != SLUG:
                return True
            connection = ctx.get(CONNECTION)
            if connection is not None and getattr(connection, "pk", None) is not None:
                return True
            allowed = [
                d.strip().lstrip("@").lower()
                for d in "${ENTRA_OAUTH_DOMAIN}".replace(" ", ",").split(",")
                if d.strip().lstrip("@")
            ]
            user = ctx.get("pending_user")
            email = (getattr(user, "email", "") or "").strip().lower()
            domain = email.rsplit("@", 1)[1] if email.count("@") == 1 else ""
            prompt = ctx.get("prompt_data")
            proof = prompt.get("rzfz_link_proof") if isinstance(prompt, dict) else None
            proof = proof if isinstance(proof, dict) else {}
            if connection is None:
                reason = "no source connection in the flow"
            elif not domain or domain not in allowed:
                reason = "e-mail domain not on the allowed list (ENTRA_OAUTH_DOMAIN)"
            elif proof.get("source") != SLUG or proof.get("email_domain_verified") is not True:
                reason = "Microsoft did not vouch for the e-mail domain (no xms_edov claim)"
            elif not isinstance(proof.get("email"), str) or proof["email"].strip().lower() != email:
                reason = "the verified e-mail is not the matched account's e-mail"
            else:
                ak_logger.info("rzfz-source-link: linked by a verified e-mail domain", source=SLUG, domain=domain)
                return True
        except Exception as exc:
            domain, reason = "", "check failed: " + type(exc).__name__
        ak_logger.warning("rzfz-source-link: link by e-mail refused", source=SLUG, domain=domain, reason=reason)
        ak_message(REFUSED)
        return False
