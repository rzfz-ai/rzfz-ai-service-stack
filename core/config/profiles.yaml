# profiles.yaml — Profile metadata manifest for razzfazz.ai Configuration UI
# Single source of truth for all module metadata, status, and resource info.
# Fields marked [deferred] are populated in later slices.

categories:
  Core: { order: 0, icon: server }
  AI & Chat: { order: 1, icon: chat }
  Workflows: { order: 2, icon: workflow }
  LLM Inference: { order: 3, icon: cpu }
  Monitoring: { order: 4, icon: monitor }
  Search: { order: 5, icon: search }
  Speech: { order: 6, icon: mic }
  Documents: { order: 7, icon: doc }
  Git: { order: 8, icon: git }
  Knowledge: { order: 9, icon: brain }
  Agents: { order: 10, icon: bot }
  Communication: { order: 11, icon: message }
  Security: { order: 12, icon: shield }
  Enterprise Search: { order: 13, icon: search }
  Developer Tools: { order: 14, icon: code }

profiles:
  # ==========================================================================
  # CORE (always-on, no profile toggle)
  # ==========================================================================
  core:
    name: "Core Infrastructure"
    category: "Core"
    maturity: production
    origin: AT
    license: Proprietary
    github: null
    description: "Always-on foundation: reverse proxy, database, identity, cache, SMTP, backup"
    long_description: |
      The core infrastructure layer runs unconditionally and provides shared
      services for every other module. Caddy serves as the sole external entry
      point (reverse proxy, TLS termination), Authentik provides SSO and OIDC
      identity management, PostgreSQL (pgvector) is the shared relational
      database, and Valkey handles caching and task queues. An internal Postfix
      SMTP relay delivers mail, and the backup service snapshots Docker volumes
      on a cron schedule. The Setup, Help, and Licenses web UIs are also part
      of core.
    has_ui: false
    containers:
      - name: caddy
        image: "razzfazz-caddy:latest"
        check_updates: false
      - name: postgres
        image: "pgvector/pgvector:pg17"
        check_updates: true
      - name: authentik-server
        image: "ghcr.io/goauthentik/server"
        check_updates: true
      - name: authentik-worker
        image: "ghcr.io/goauthentik/server"
        check_updates: false
      - name: valkey
        image: "valkey/valkey:8-alpine"
        check_updates: true
      - name: smtp-relay
        image: "boky/postfix:latest"
        check_updates: true
      # #538: this claimed the upstream `offen/docker-volume-backup:latest`, but
      # core/compose.yml BUILDS `razzfazz-backup-service` locally (F-069 adds
      # docker-cli + openssl). With check_updates: true the portal compared a
      # Docker Hub digest against a locally-built image, which can never match —
      # a permanent phantom "update available". A local build has no registry to
      # check, so the flag is off; the upstream base is tracked via BACKUP_VERSION.
      - name: backup-service
        image: "razzfazz-backup-service:latest"
        check_updates: false
      - name: razzfazz-help
        image: "razzfazz-help:latest"
        check_updates: false
      - name: razzfazz-licenses
        image: "razzfazz-licenses:latest"
        check_updates: false
      - name: razzfazz-backup-management
        image: "razzfazz-backup-management:latest"
        check_updates: false
      - name: razzfazz-config
        image: "razzfazz-config:latest"
        check_updates: false
      # F-A3: docker socket isolation. razzfazz-config, agent-manager,
      # backup-service, authentik-worker, and gpustack all talk to this
      # proxy via DOCKER_HOST tcp://docker-socket-proxy:2375 instead of
      # mounting the raw /var/run/docker.sock.
      - name: docker-socket-proxy
        image: "tecnativa/docker-socket-proxy:v0.4.2"
        check_updates: true
      # M018 / S03.5: autoheal sidecar. Watches `autoheal=true`-labelled
      # containers in Docker `unhealthy` state and restarts them after the
      # configured grace period. ~120 s unattended recovery from the
      # gpustack-server hang failure mode + similar Docker-healthcheck-
      # signaled stalls anywhere in the stack.
      - name: autoheal
        image: "willfarrell/autoheal:1.2.0"
        check_updates: true
    urls: []
    databases:
      - authentik_db
    ram_estimate_mb: 3400
    dependencies:
      required: []
    mutual_exclusion: []
    enable_impact: "Core services cannot be toggled — they are always running."
    disable_impact: "Core services cannot be disabled."
    stack_impact: none
    risk_on_toggle: danger

  # ==========================================================================
  # PRODUCTION PROFILES
  # ==========================================================================
  chat:
    name: "Chat"
    category: "AI & Chat"
    maturity: production
    origin: US
    license: MIT
    github: "https://github.com/open-webui/open-webui"
    description: "ChatGPT-like interface for local LLM models with RAG, tools, and user management"
    long_description: |
      Open WebUI provides a full-featured ChatGPT-like interface for interacting
      with locally-running AI models. It supports multi-model conversations,
      retrieval-augmented generation (RAG) with document upload, web search
      integration via SearXNG, voice input/output via Speaches, custom pipelines,
      and multi-user access control via Authentik SSO.

      Use cases: team AI chat, document Q&A, code review, content generation,
      knowledge base queries with uploaded documents.
    has_ui: true
    # #1962: does this module show ITS OWN login mask after the Authentik SSO?
    own_login:
      state: expected
      reason: "Open WebUI keeps its own account store; after Authentik it lands on /auth?redirect=%2F (0.91, 2026-09-11: 1 password field). Native OIDC per module is its own integration (#1962)."
    app_icon: "razzfazz-ai_chat_icon.png"
    containers:
      - name: openwebui
        image: "ghcr.io/open-webui/open-webui"
        check_updates: true
      - name: pipelines
        image: "ghcr.io/open-webui/pipelines"
        check_updates: true
      # #538: one-shot init containers. Missing here, a portal-enabled chat
      # skipped BOTH the schema migrate/reconcile and the OWUI seed. They exit
      # after running; get_profile_health() already ignores exited one-shots.
      - name: openwebui-migrate-reconcile
        image: "postgres:17.10"
        check_updates: false
      - name: openwebui-seed
        image: "razzfazz-stack-openwebui-seed:latest"
        check_updates: false
    urls:
      - subdomain: chat
        label: "Chat UI"
    databases:
      - openwebui_db
    ram_estimate_mb: 800
    dependencies:
      required: ["core"]
      recommended: ["llm-manager"]
      optional: ["searxng", "stts"]
    mutual_exclusion: []
    enable_impact: "Pulls ~2 GB image, creates database, starts in ~30s"
    disable_impact: "Stops containers, data preserved in volumes"
    stack_impact: none
    risk_on_toggle: caution
    compose_file: "modules/chat/compose.yml"
    compose_depends_on: ["postgres", "valkey"]
    networking:
      caddy_routes:
        - subdomain: chat
          target: "openwebui:8080"
      internal_connections:
        - from: openwebui
          to: "llm:8080"
          purpose: "LLM inference API (OpenAI-compatible)"
        - from: openwebui
          to: "postgres:5432"
          purpose: "Application database"
        - from: openwebui
          to: "searxng:8080"
          purpose: "Web search (when enabled)"
        - from: pipelines
          to: "openwebui:8080"
          purpose: "Pipeline callbacks"
    storage:
      volumes:
        - name: open-webui-data
          purpose: "User uploads, RAG documents, chat history"
        - name: pipelines-data
          purpose: "Pipeline configurations and custom code"
    authentik:
      app_name: "Chat"
      provider: "Caddy Forward Auth Provider To Chat"
      user_group: "razzfazz.ai Chat Users"
    env_vars:
      - name: OPENWEBUI_PORT
        default: "8080"
        secret: false
        description: "Internal port for Open WebUI"
      - name: WEBUI_SECRET_KEY
        secret: true
        description: "Session encryption key"
      - name: ENABLE_OLLAMA_API
        default: "false"
        secret: false
        description: "Expose Ollama-compatible API via GPUStack"

  dify:
    name: "Workflows (Dify)"
    category: "Workflows"
    maturity: production
    origin: US
    license: Apache-2.0
    github: "https://github.com/langgenius/dify"
    description: "LLM workflow automation platform — visual builder for AI agents, RAG pipelines, and chatbots"
    has_ui: true
    # #1962: does this module show ITS OWN login mask after the Authentik SSO?
    own_login:
      state: expected
      reason: "Dify's console authenticates by itself (/signin?redirect_url=%2F); measured 1 password field after SSO on 0.91, 2026-09-11 (#1962)."
    app_icon: "razzfazz-ai_workflow_icon.png"
    containers:
      - name: dify-api
        image: "langgenius/dify-api"
        check_updates: true
      - name: dify-worker
        image: "langgenius/dify-api"
        check_updates: false
      - name: dify-worker-beat
        image: "langgenius/dify-api"
        check_updates: false
      - name: dify-web
        image: "razzfazz-dify-web:latest"
        check_updates: false
      - name: dify-sandbox
        image: "langgenius/dify-sandbox"
        check_updates: true
      - name: dify-plugin-daemon
        image: "langgenius/dify-plugin-daemon"
        check_updates: true
      - name: dify-init-permissions
        image: "busybox:latest"
        check_updates: false
    urls:
      - subdomain: dify
        label: "Workflow Builder"
    databases:
      - dify_db
      - dify_plugin_db
    ram_estimate_mb: 2100
    dependencies:
      required: ["core"]
      recommended: ["llm-manager"]
      optional: ["searxng"]
    mutual_exclusion: []
    enable_impact: "Starts 7 containers (~2 GB RAM), creates 2 databases"
    disable_impact: "Stops all Dify containers, data preserved"
    stack_impact: none
    risk_on_toggle: caution
    compose_file: "modules/dify/compose.yml"
    compose_depends_on: ["postgres", "valkey", "caddy"]
    networking:
      caddy_routes:
        - subdomain: dify
          target: "dify-web:3000"
        - subdomain: dify
          path: "/console/api/*, /api/*, /v1/*, /files/*, /triggers/*"
          target: "dify-api:5001"
      internal_connections:
        - from: dify-api
          to: "postgres:5432"
          purpose: "Application database (dify_db)"
        - from: dify-api
          to: "valkey:6379"
          purpose: "Task queue and cache"
        - from: dify-api
          to: "caddy:8195"
          purpose: "SSRF-protected outbound HTTP proxy"
        - from: dify-plugin-daemon
          to: "dify-api:5001"
          purpose: "Plugin callbacks to Dify API"
        - from: dify-sandbox
          to: "caddy:8195"
          purpose: "Sandboxed code execution outbound proxy"
    storage:
      volumes:
        - name: dify-app-data
          purpose: "Uploaded files, workflow data, app storage"
        - name: dify-sandbox-dependencies
          purpose: "Cached Python dependencies for sandbox"
        - name: dify-sandbox-conf
          purpose: "Sandbox configuration"
        - name: dify-plugin-daemon
          purpose: "Installed plugins and plugin storage"
    authentik:
      app_name: "Workflow Automation"
      provider: "Caddy Forward Auth Provider to Dify"
      user_group: "razzfazz.ai Workflow Automation Users"
    env_vars:
      - name: DIFY_VERSION
        default: "latest"
        secret: false
        description: "Dify API/worker image tag"
      - name: DIFY_DOMAIN
        default: "dify.${MAIN_DOMAIN}"
        secret: false
        description: "Public subdomain for the Dify web UI"
      - name: DIFY_CLIENT_SECRET
        secret: true
        description: "Authentik forward-auth client secret for Dify"
      - name: SANDBOX_API_KEY
        default: "dify-sandbox"
        secret: true
        description: "API key for Dify sandbox code execution service"
    long_description: |
      Dify is a visual LLM application platform for building AI agents, RAG
      pipelines, chatbots, and workflow automations without writing code. It
      connects to local models via GPUStack, supports document ingestion with
      vector search, and provides a plugin marketplace for extending capabilities.

      Use cases: customer support bots, document summarization workflows,
      multi-step AI agents, internal knowledge bases, API-driven LLM apps.

  llm-legacy:
    name: "LLM Inference (GPUStack 0.7.1)"
    category: "LLM Inference"
    maturity: production
    origin: US
    license: Apache-2.0
    github: "https://github.com/gpustack/gpustack"
    description: "GPUStack v0.7.1 — THE stable GPU backend module. #1448 (cutover C8, decision D4): one profile for both GPU lines, the hardware chosen by HARDWARE + the device overlay modules/llm/compose.devices.<HARDWARE>.yml — amd runs the custom AMD Vulkan build (validated leak-free on Strix Halo, M029-S01), nvidia runs GPUStack 0.7.1 + custom CUDA llama.cpp (b9851, sm_120; Blackwell/RTX PRO 6000, 598-run soak, #946). The retired `llm-cuda` and `llm-cpu` profiles were both merged in here (#1448 C8 and #1447 part b); cli/upgrade.sh rewrites an existing box."
    has_ui: true
    # #1962: does this module show ITS OWN login mask after the Authentik SSO?
    own_login:
      state: expected
      reason: "GPUStack 0.7.1 keeps its own account store; after Authentik it shows its own login mask (0.79, 2026-09-20, a 2026.08-ga.15 box crossed to 2026.09 with the profile retained: 1 password field, page text 'Log in … © 2026 SEAL … v0.7.1'). Native OIDC per module is its own integration (#1962)."
    # #1962: words this module's OWN UI shows that its name does not — GPUStack's
    # login mask shows only its vendor mark ("© 2026 SEAL") and a version.
    identity_words: ["seal"]
    app_icon: "razzfazz-ai_llm_icon.png"
    containers:
      - name: gpustack
        image: "razzfazz-gpustack:vulkan"
        check_updates: false
      - name: model-sync
        image: "razzfazz-model-sync:latest"
        check_updates: false
    urls:
      - subdomain: gpustack
        label: "GPUStack Dashboard"
    databases:
      - gpustack_db
    ram_estimate_mb: 800
    ram_dynamic: true
    ram_notes: |
      Base GPUStack with Vulkan uses ~800 MB. Models are offloaded
      to GPU VRAM when possible, reducing CPU memory usage.
    dependencies:
      required: ["core"]
    # #1447 part b: `llm-cpu` was folded in — this is the only GPUStack
    # profile, so there is nothing left to be exclusive WITH. Kept as an empty
    # list rather than deleted: the key is what the portal and the CLI read,
    # and an absent key is a different question from an empty one.
    mutual_exclusion: []
    enable_impact: "Starts GPUStack 0.7.1 with the device overlay HARDWARE selects (AMD Vulkan or the CUDA llama.cpp build). Optional LEGACY backend beside the LLM Manager, which is this box's default and federates it (#1442). SECURITY: GPUStack 0.7.1 has a known, unfixed authentication flaw reachable from inside the box network — read the security notice in this module's description before enabling."
    disable_impact: "Stops LLM inference. Chat and Dify lose model access."
    stack_impact: none
    risk_on_toggle: caution
    compose_file: "modules/llm/compose.yml"
    compose_depends_on: ["postgres"]
    networking:
      caddy_routes:
        - subdomain: gpustack
          target: "gpustack:9090"
      internal_connections:
        - from: gpustack
          to: "postgres:5432"
          purpose: "GPUStack metadata database"
        - from: model-sync
          to: "llm:8080"
          purpose: "Poll GPUStack API for model list"
        - from: model-sync
          to: "postgres:5432"
          purpose: "Sync model list to Open WebUI database"
        - from: ollama-proxy
          to: "llm:8080"
          purpose: "Translate Ollama API to GPUStack OpenAI API"
    storage:
      volumes:
        - name: gpustack-data
          purpose: "Model files, GPUStack state, inference cache"
    authentik:
      app_name: "LLM Management"
      provider: "Caddy Forward Auth Provider for LLM"
      user_group: "razzfazz.ai LLM Management Users"
    env_vars:
      - name: GPUSTACK_PORT
        default: "9090"
        secret: false
        description: "Internal API port for GPUStack"
      - name: GPUSTACK_API_KEY
        default: "gpustack_CHANGEME_AFTER_FIRST_START"
        secret: true
        description: "API key for GPUStack model management and inference"
      - name: GPUSTACK_MODE
        default: "standalone"
        secret: false
        description: "Deployment mode: standalone, master, or worker"
    long_description: |
      SECURITY NOTICE — please read before enabling this module.

      GPUStack v0.7.1 carries a known authentication flaw that is not fixed in
      this version. Its SAML callback accepts a login assertion without
      verifying the signature on it, so anyone able to reach that endpoint can
      obtain a session as any GPUStack user, an administrator included. The
      endpoint answers whether or not you have configured SAML. The GPUStack
      project fixed this in v2.2.2.

      razzfazz.ai stays on v0.7.1 deliberately and does not plan to upgrade it:
      the pinned build carries hardware work this box depends on (the AMD Vulkan
      build, and the CUDA llama.cpp build for Blackwell), which a two-major-
      version jump would invalidate. This module is the LEGACY inference path.

      What limits the flaw on this box: the reverse proxy requires single
      sign-on for every GPUStack address except the health check and the
      OpenAI-compatible API, so the callback cannot be reached from the
      internet. It CAN be reached from inside the box's own container network —
      which includes Dify workflows, because gpustack is on Dify's outbound
      allow-list (DIFY_DOC_TOOLS_SSRF_ALLOW). Anyone who can author a Dify
      workflow on this box can therefore reach it.

      The LLM Manager is this box's default inference backend and is NOT
      affected. Enabling GPUStack is your decision; this notice is here so that
      it is an informed one.

      ---

      GPUStack with Vulkan/ROCm GPU acceleration for AMD Radeon GPUs.
      Offloads model layers to GPU VRAM for significantly faster inference
      compared to CPU-only mode. Built from a custom Dockerfile that includes
      Vulkan ICD and ROCm libraries. Otherwise identical to the CPU profile
      in features: model sync, Ollama proxy, and OpenAI-compatible API.

      Use cases: high-throughput local LLM inference on AMD GPUs, serving
      large models that benefit from VRAM offloading, real-time chat.

  mac-llm:
    name: "Mac LLM Gateway (LiteLLM)"
    category: "LLM Inference"
    maturity: experimental
    origin: US
    license: MIT
    github: "https://github.com/BerriAI/litellm"
    description: "Fronts one-or-more Macs running Ollama (Apple-Silicon / MLX) as a SECOND OpenAI-compatible endpoint — load-balanced + health-checked — via a LiteLLM proxy. Opt-in, OFF by default; GPUStack is UNTOUCHED. Declare Macs in modules/llm/mac-gateway/config.yaml (from config.example.yaml); a Config Portal panel (P2) will manage them. Internal-only in P1 (master-key auth, no Caddy route)."
    has_ui: false
    containers:
      - name: llm-mac-gateway
        image: "ghcr.io/berriai/litellm:main-v1.93.0-stable"
        check_updates: true
    ram_estimate_mb: 400
    ram_dynamic: false
    ram_notes: |
      LiteLLM proxy is a lightweight Python service (mem_limit 1g). All
      inference happens ON the Macs (outside the stack) — no model memory here.
    dependencies:
      required: ["core"]
    enable_impact: "Starts the llm-mac-gateway LiteLLM proxy. Requires MAC_GATEWAY_MASTER_KEY set and modules/llm/mac-gateway/config.yaml populated with your Macs. Add http://llm-mac-gateway:4000/v1 as a 2nd OpenAI endpoint in Open WebUI / Dify to surface the Mac models."
    disable_impact: "Stops the Mac gateway. Mac-hosted models disappear from the model list; the GPUStack path is unaffected."
    stack_impact: none
    risk_on_toggle: caution
    compose_file: "modules/llm/mac-gateway/compose.yml"
    compose_depends_on: []
    networking:
      internal_connections:
        - from: openwebui
          to: "llm-mac-gateway:4000"
          purpose: "2nd OpenAI-compatible endpoint (Mac-hosted models), master-key auth"
        - from: llm-mac-gateway
          to: "<mac-ip>:11434"
          purpose: "Route inference to each Mac's Ollama OpenAI-compatible /v1 endpoint (host LAN, plaintext — firewall each Mac to this box's IP)"
    env_vars:
      - name: MAC_GATEWAY_MASTER_KEY
        secret: true
        description: "Master key components present to authenticate to the gateway. Required when mac-llm is enabled."
      - name: MAC_GATEWAY_PORT
        default: "4000"
        secret: false
        description: "Loopback host-side debug port (127.0.0.1); in-network consumers use llm-mac-gateway:4000"
      - name: LITELLM_VERSION
        default: "main-v1.93.0-stable"
        secret: false
        description: "Pinned LiteLLM image tag (ghcr.io/berriai/litellm:<tag>). Repin to a reviewed tag / digest at ship."
    long_description: |
      An opt-in LiteLLM proxy (llm-mac-gateway) that federates Mac-hosted
      Ollama/MLX models into the stack as a SECOND OpenAI-compatible endpoint,
      load-balanced and health-checked. GPUStack is left completely untouched —
      the gateway is a second endpoint alongside the canonical
      http://llm:8080/v1 (#1445), not a replacement (design decision,
      2026-07-12; the endpoint moved with the cutover, the design did not).

      Each Mac is a host ip:port plus one-or-more {alias, ollama_tag} models,
      declared in the per-box, gitignored config.yaml (template:
      config.example.yaml). Two Macs sharing an alias for the same model
      auto-form one load-balance group.

      P1 (this release) is declarative: hand-edit config.yaml + wire Open WebUI.
      P2 adds a Config Portal "Mac LLM backends" panel (add/remove Macs, live
      health, Tier-1 model management over Ollama's HTTP API). Internal-only —
      no external route in P1; managed via the SSO-gated Config Portal.

  # ==========================================================================
  # #254 LLM ORCHESTRATOR (append-only module block — Phase 1, 2026.09)
  # ==========================================================================
  llm-manager:
    name: "LLM Manager (manager)"
    category: "LLM Inference"
    maturity: production
    # #1443 (cutover C3, operator decisions D1/D2 2026-09-04): the LLM Manager is
    # the ONLY front for LLM traffic on every box; this module is always-on —
    # the portal refuses to disable it (like `core`), the presets/upgrade carry it.
    # #1443: part of the always-on manager trio. The PROFILE migration for
    # installed boxes (writing the trio into COMPOSE_PROFILES) is cutover
    # strand C6 — cli/upgrade.sh `migrate_to_llm_manager_trio` (#1446); the
    # presets and the wizard build it for NEW boxes (#1292). Until one of the
    # two ran, this flag is a Portal rule (no disable) and not yet a compose
    # fact, which is why the toggle still offers ENABLE while the module is off.
    always_on: true
    origin: AT
    license: Proprietary
    github: null
    description: "Sovereign, Kubernetes-free control plane over a heterogeneous LLM fleet (CUDA / AMD Strix Halo / Mac). Phase-1: an OpenAI-compatible gateway with API-key auth, per-key enforcement, a streaming proxy, and TOKEN-ONLY chargeback (input/output/cached tokens per key per window — no euros, no GPU-hours). LiteLLM runs as a PURE ROUTER behind the manager."
    has_ui: true
    # #1962: does this module show ITS OWN login mask after the Authentik SSO?
    own_login:
      state: unexpected
      reason: "0 password fields after SSO on 0.91, 2026-09-11 (lands on /dashboard) — a login mask here is a defect (#1962)."
    urls:
      - subdomain: "llm-manager"
        label: "LLM Manager Console"
    containers:
      - name: llm-manager
        image: "razzfazz-llm-manager:latest"
        check_updates: false
      - name: llm-manager-router
        image: "ghcr.io/berriai/litellm:main-v1.93.0-stable"
        check_updates: true
      # Surfaced by the #538 consistency test on the ga.15 forward-merge:
      # the console SPA container was in compose but not declared here, so a
      # module enable never started it and nothing reported that.
      - name: llm-manager-ui
        image: "razzfazz-llm-manager-ui:latest"
        check_updates: false
      # #1445 / D5: the Ollama-protocol proxy on :11434 fronts the LLM Manager
      # (moved here from the four GPUStack profiles).
      - name: ollama-proxy
        image: "eyalrot2/ollama-openai-proxy:latest"
        check_updates: true
    ram_estimate_mb: 2176
    ram_dynamic: false
    ram_notes: |
      #333: manager 1g + LiteLLM router 1g + console SPA 128m mem_limit =
      ~2.1 GB worst case. All inference happens on the fleet's engines (out
      of this module) — no model memory here.
    dependencies:
      required: ["core"]
    enable_impact: "Starts the llm-manager manager + llm-manager-router (LiteLLM). Requires LITELLM_INTERNAL_KEY + LLM_MANAGER_DB_PASSWORD set. The manager creates/migrates llm_manager_db on the shared Postgres and generates the router config. Reachable via Caddy at llm-manager.<domain> (SSO forward-auth on /api/* + /ui/*; /v1/* key-authed in-app; /api/workers node-key machine auth; /metrics internal); loopback port for smoke."
    disable_impact: "Stops the orchestrator manager + router. Any API keys / usage history remain in llm_manager_db. GPUStack and the mac-llm gateway are unaffected."
    stack_impact: none
    risk_on_toggle: caution
    compose_file: "modules/llm/manager/compose.yml"
    compose_depends_on: []
    networking:
      internal_connections:
        - from: llm-manager
          to: "llm-manager-router:4000"
          purpose: "Forward OpenAI /v1 traffic to the LiteLLM pure router (Bearer LITELLM_INTERNAL_KEY)"
        - from: llm-manager
          to: "postgres:5432"
          purpose: "llm_manager_db — keys, cost-centers, usage_events (token counters), fleet/catalog/deployment state"
        - from: llm-manager
          to: "valkey:6379"
          purpose: "Auth-key cache + rpm/tpm sliding-window counters (DB index 9)"
    env_vars:
      - name: LLM_MANAGER_PORT
        default: "8091"
        secret: false
        description: "Loopback host-side debug port (127.0.0.1); in-network consumers use llm-manager:8080"
      - name: LLM_MANAGER_DB
        default: "llm_manager_db"
        secret: false
        description: "Postgres database name for the orchestrator (per-service-DB pattern)"
      - name: LLM_MANAGER_DB_USER
        default: "llm_manager_user"
        secret: false
        description: "Postgres login role for llm_manager_db"
      - name: LLM_MANAGER_DB_PASSWORD
        secret: true
        description: "Password for llm_manager_user. Generated by razzfazz-init.sh."
      - name: LITELLM_INTERNAL_KEY
        secret: true
        description: "Internal master key the manager uses to authenticate to the LiteLLM pure router. Known only to the manager."
      - name: LITELLM_VERSION
        default: "main-v1.93.0-stable"
        secret: false
        description: "Pinned LiteLLM image tag for the router (shared with the mac gateway). Repin to a reviewed tag / digest at ship."
    long_description: |
      The LLM Manager is the sovereign replacement for GPUStack: one
      control plane over a heterogeneous fleet of CUDA nodes, AMD Strix Halo
      (gfx1151) boxes, and Macs — no Kubernetes, shipped as a Compose module.

      Phase-1 (this release) is the gateway + chargeback MVP. A client presents
      a rzfz-sk-… bearer key; the manager authenticates it (hashed, cached in
      Valkey), enforces per-key policy (active · allowed models · rpm/tpm), and
      streams the completion through to the LiteLLM router and on to the fleet's
      engines. After the stream it records TOKEN-ONLY usage — input, output, and
      cached token counters per key per window — into llm_manager_db. There is
      no currency anywhere: no euros, no GPU-hours, no model_pricing table.

      LiteLLM is used strictly as a stateless router (load-balancing + failover);
      the manager owns keys, enforcement, and metering. Later phases add the
      per-node worker agent, the scheduler (deployments → instances, replicas,
      per-track artifact resolution, rolling updates), Tier-1↔2 model
      distribution, the entitlement hub, and HA.

  llm-registry:
    name: "LLM Model Registry (Zot)"
    category: "LLM Inference"
    maturity: production
    # #1443 (cutover C3, operator decisions D1/D2 2026-09-04): the LLM Manager is
    # the ONLY front for LLM traffic on every box; this module is always-on —
    # the portal refuses to disable it (like `core`), the presets/upgrade carry it.
    # #1443: part of the always-on manager trio. The PROFILE migration for
    # installed boxes (writing the trio into COMPOSE_PROFILES) is cutover
    # strand C6 — cli/upgrade.sh `migrate_to_llm_manager_trio` (#1446); the
    # presets and the wizard build it for NEW boxes (#1292). Until one of the
    # two ran, this flag is a Portal rule (no disable) and not yet a compose
    # fact, which is why the toggle still offers ENABLE while the module is off.
    always_on: true
    origin: AT
    license: Apache-2.0
    github: "https://github.com/project-zot/zot"
    description: "Content-addressed OCI registry (Zot) storing model artifacts (GGUF/safetensors/mmproj) as OCI blobs for the LLM Manager fleet. Fleet nodes pull artifacts BY DIGEST into their models volume — deduplicated, air-gap friendly (seed once, no WAN to serve)."
    has_ui: false
    containers:
      - name: llm-registry
        image: "ghcr.io/project-zot/zot-linux-amd64:v2.1.3"
        check_updates: true
    urls: []
    databases: []
    ram_estimate_mb: 200
    dependencies:
      required: ["core"]
    mutual_exclusion: []
    enable_impact: "Starts the Zot OCI registry (loopback + in-network llm-registry:5000). The manager records model artifacts by digest; worker-agents pull blobs from here. Ingress route added with the manager SSO ingress."
    disable_impact: "Fleet nodes can't pull model artifacts by digest from the in-stack registry."
    stack_impact: none
    risk_on_toggle: safe

  llm-worker-agent:
    name: "LLM Worker-Agent"
    category: "LLM Inference"
    maturity: production
    # #1443 (cutover C3, operator decisions D1/D2 2026-09-04): the LLM Manager is
    # the ONLY front for LLM traffic on every box; this module is always-on —
    # the portal refuses to disable it (like `core`), the presets/upgrade carry it.
    # #1443: part of the always-on manager trio. The PROFILE migration for
    # installed boxes (writing the trio into COMPOSE_PROFILES) is cutover
    # strand C6 — cli/upgrade.sh `migrate_to_llm_manager_trio` (#1446); the
    # presets and the wizard build it for NEW boxes (#1292). Until one of the
    # two ran, this flag is a Portal rule (no disable) and not yet a compose
    # fact, which is why the toggle still offers ENABLE while the module is off.
    always_on: true
    origin: AT
    license: Proprietary
    github: null
    description: "Per-node worker agent for the LLM Manager (#254): launches + supervises engine containers (llama.cpp on AMD Vulkan, CUDA or CPU) per the manager's deployments and self-registers what it serves. Drives docker through the scoped docker-socket-proxy (no raw socket); GPU passthrough is applied per engine by the driver. On the master node in-stack; remote workers run it standalone."
    has_ui: false
