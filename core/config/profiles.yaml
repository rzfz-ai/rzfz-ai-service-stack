# profiles.yaml — Profile metadata manifest for razzfazz.ai Configuration UI
# Single source of truth for all module metadata, status, and resource info.
# Fields marked [deferred] are populated in later slices.

categories:
  Core: { order: 0, icon: server }
  AI & Chat: { order: 1, icon: chat }
  Workflows: { order: 2, icon: workflow }
  LLM Inference: { order: 3, icon: cpu }
  Monitoring: { order: 4, icon: monitor }
  Search: { order: 5, icon: search }
  Speech: { order: 6, icon: mic }
  Documents: { order: 7, icon: doc }
  Git: { order: 8, icon: git }
  Knowledge: { order: 9, icon: brain }
  Agents: { order: 10, icon: bot }
  Communication: { order: 11, icon: message }
  Security: { order: 12, icon: shield }
  Enterprise Search: { order: 13, icon: search }
  Developer Tools: { order: 14, icon: code }

profiles:
  # ==========================================================================
  # CORE (always-on, no profile toggle)
  # ==========================================================================
  core:
    name: "Core Infrastructure"
    category: "Core"
    maturity: production
    origin: AT
    license: Proprietary
    github: null
    description: "Always-on foundation: reverse proxy, database, identity, cache, SMTP, backup"
    long_description: |
      The core infrastructure layer runs unconditionally and provides shared
      services for every other module. Caddy serves as the sole external entry
      point (reverse proxy, TLS termination), Authentik provides SSO and OIDC
      identity management, PostgreSQL (pgvector) is the shared relational
      database, and Valkey handles caching and task queues. An internal Postfix
      SMTP relay delivers mail, and the backup service snapshots Docker volumes
      on a cron schedule. The Setup, Help, and Licenses web UIs are also part
      of core.
    has_ui: false
    containers:
      - name: caddy
        image: "razzfazz-caddy:latest"
        check_updates: false
      - name: postgres
        image: "pgvector/pgvector:pg17"
        check_updates: true
      - name: authentik-server
        image: "ghcr.io/goauthentik/server"
        check_updates: true
      - name: authentik-worker
        image: "ghcr.io/goauthentik/server"
        check_updates: false
      - name: valkey
        image: "valkey/valkey:8-alpine"
        check_updates: true
      - name: smtp-relay
        image: "boky/postfix:latest"
        check_updates: true
      - name: backup-service
        image: "offen/docker-volume-backup:latest"
        check_updates: true
      - name: razzfazz-help
        image: "razzfazz-help:latest"
        check_updates: false
      - name: razzfazz-licenses
        image: "razzfazz-licenses:latest"
        check_updates: false
      - name: razzfazz-backup-management
        image: "razzfazz-backup-management:latest"
        check_updates: false
      - name: razzfazz-config
        image: "razzfazz-config:latest"
        check_updates: false
      # F-A3: docker socket isolation. razzfazz-config, agent-manager,
      # backup-service, authentik-worker, and gpustack all talk to this
      # proxy via DOCKER_HOST tcp://docker-socket-proxy:2375 instead of
      # mounting the raw /var/run/docker.sock.
      - name: docker-socket-proxy
        image: "tecnativa/docker-socket-proxy:v0.4.2"
        check_updates: true
      # M018 / S03.5: autoheal sidecar. Watches `autoheal=true`-labelled
      # containers in Docker `unhealthy` state and restarts them after the
      # configured grace period. ~120 s unattended recovery from the
      # gpustack-server hang failure mode + similar Docker-healthcheck-
      # signaled stalls anywhere in the stack.
      - name: autoheal
        image: "willfarrell/autoheal:1.2.0"
        check_updates: true
    urls: []
    databases:
      - authentik_db
    ram_estimate_mb: 3400
    dependencies:
      required: []
    mutual_exclusion: []
    enable_impact: "Core services cannot be toggled — they are always running."
    disable_impact: "Core services cannot be disabled."
    stack_impact: none
    risk_on_toggle: danger

  # ==========================================================================
  # PRODUCTION PROFILES
  # ==========================================================================
  chat:
    name: "Chat"
    category: "AI & Chat"
    maturity: production
    origin: US
    license: MIT
    github: "https://github.com/open-webui/open-webui"
    description: "ChatGPT-like interface for local LLM models with RAG, tools, and user management"
    long_description: |
      Open WebUI provides a full-featured ChatGPT-like interface for interacting
      with locally-running AI models. It supports multi-model conversations,
      retrieval-augmented generation (RAG) with document upload, web search
      integration via SearXNG, voice input/output via Speaches, custom pipelines,
      and multi-user access control via Authentik SSO.

      Use cases: team AI chat, document Q&A, code review, content generation,
      knowledge base queries with uploaded documents.
    has_ui: true
    app_icon: "razzfazz-ai_chat_icon.png"
    containers:
      - name: openwebui
        image: "ghcr.io/open-webui/open-webui"
        check_updates: true
      - name: pipelines
        image: "ghcr.io/open-webui/pipelines"
        check_updates: true
    urls:
      - subdomain: chat
        label: "Chat UI"
    databases:
      - openwebui_db
    ram_estimate_mb: 800
    dependencies:
      required: ["core"]
      recommended: ["llm"]
      optional: ["searxng", "stts"]
    mutual_exclusion: []
    enable_impact: "Pulls ~2 GB image, creates database, starts in ~30s"
    disable_impact: "Stops containers, data preserved in volumes"
    stack_impact: none
    risk_on_toggle: caution
    compose_file: "chat/compose.yml"
    compose_depends_on: ["postgres", "valkey"]
    networking:
      caddy_routes:
        - subdomain: chat
          target: "openwebui:8080"
      internal_connections:
        - from: openwebui
          to: "gpustack:9090"
          purpose: "LLM inference API (OpenAI-compatible)"
        - from: openwebui
          to: "postgres:5432"
          purpose: "Application database"
        - from: openwebui
          to: "searxng:8080"
          purpose: "Web search (when enabled)"
        - from: pipelines
          to: "openwebui:8080"
          purpose: "Pipeline callbacks"
    storage:
      volumes:
        - name: open-webui-data
          purpose: "User uploads, RAG documents, chat history"
        - name: pipelines-data
          purpose: "Pipeline configurations and custom code"
    authentik:
      app_name: "Chat"
      provider: "Caddy Forward Auth Provider To Chat"
      user_group: "razzfazz.ai Chat Users"
    env_vars:
      - name: OPENWEBUI_PORT
        default: "8080"
        secret: false
        description: "Internal port for Open WebUI"
      - name: WEBUI_SECRET_KEY
        secret: true
        description: "Session encryption key"
      - name: ENABLE_OLLAMA_API
        default: "false"
        secret: false
        description: "Expose Ollama-compatible API via GPUStack"

  dify:
    name: "Workflows (Dify)"
    category: "Workflows"
    maturity: production
    origin: US
    license: Apache-2.0
    github: "https://github.com/langgenius/dify"
    description: "LLM workflow automation platform — visual builder for AI agents, RAG pipelines, and chatbots"
    has_ui: true
    app_icon: "razzfazz-ai_workflow_icon.png"
    containers:
      - name: dify-api
        image: "langgenius/dify-api"
        check_updates: true
      - name: dify-worker
        image: "langgenius/dify-api"
        check_updates: false
      - name: dify-worker-beat
        image: "langgenius/dify-api"
        check_updates: false
      - name: dify-web
        image: "razzfazz-dify-web:latest"
        check_updates: false
      - name: dify-sandbox
        image: "langgenius/dify-sandbox"
        check_updates: true
      - name: dify-plugin-daemon
        image: "langgenius/dify-plugin-daemon"
        check_updates: true
      - name: dify-init-permissions
        image: "busybox:latest"
        check_updates: false
    urls:
      - subdomain: dify
        label: "Workflow Builder"
    databases:
      - dify_db
      - dify_plugin_db
    ram_estimate_mb: 2100
    dependencies:
      required: ["core"]
      recommended: ["llm"]
      optional: ["searxng"]
    mutual_exclusion: []
    enable_impact: "Starts 7 containers (~2 GB RAM), creates 2 databases"
    disable_impact: "Stops all Dify containers, data preserved"
    stack_impact: none
    risk_on_toggle: caution
    compose_file: "dify/compose.yml"
    compose_depends_on: ["postgres", "valkey", "caddy"]
    networking:
      caddy_routes:
        - subdomain: dify
          target: "dify-web:3000"
        - subdomain: dify
          path: "/console/api/*, /api/*, /v1/*, /files/*, /triggers/*"
          target: "dify-api:5001"
      internal_connections:
        - from: dify-api
          to: "postgres:5432"
          purpose: "Application database (dify_db)"
        - from: dify-api
          to: "valkey:6379"
          purpose: "Task queue and cache"
        - from: dify-api
          to: "caddy:8195"
          purpose: "SSRF-protected outbound HTTP proxy"
        - from: dify-plugin-daemon
          to: "dify-api:5001"
          purpose: "Plugin callbacks to Dify API"
        - from: dify-sandbox
          to: "caddy:8195"
          purpose: "Sandboxed code execution outbound proxy"
    storage:
      volumes:
        - name: dify-app-data
          purpose: "Uploaded files, workflow data, app storage"
        - name: dify-sandbox-dependencies
          purpose: "Cached Python dependencies for sandbox"
        - name: dify-sandbox-conf
          purpose: "Sandbox configuration"
        - name: dify-plugin-daemon
          purpose: "Installed plugins and plugin storage"
    authentik:
      app_name: "Workflow Automation"
      provider: "Caddy Forward Auth Provider to Dify"
      user_group: "razzfazz.ai Workflow Automation Users"
    env_vars:
      - name: DIFY_VERSION
        default: "latest"
        secret: false
        description: "Dify API/worker image tag"
      - name: DIFY_DOMAIN
        default: "dify.${MAIN_DOMAIN}"
        secret: false
        description: "Public subdomain for the Dify web UI"
      - name: DIFY_CLIENT_SECRET
        secret: true
        description: "Authentik forward-auth client secret for Dify"
      - name: SANDBOX_API_KEY
        default: "dify-sandbox"
        secret: true
        description: "API key for Dify sandbox code execution service"
    long_description: |
      Dify is a visual LLM application platform for building AI agents, RAG
      pipelines, chatbots, and workflow automations without writing code. It
      connects to local models via GPUStack, supports document ingestion with
      vector search, and provides a plugin marketplace for extending capabilities.

      Use cases: customer support bots, document summarization workflows,
      multi-step AI agents, internal knowledge bases, API-driven LLM apps.

  llm-cpu:
    name: "LLM Inference (CPU, stable)"
    category: "LLM Inference"
    maturity: production
    origin: US
    license: Apache-2.0
    github: "https://github.com/gpustack/gpustack"
    description: "GPUStack v0.7.1-cpu — STABLE CPU LLM inference path. M029-S04 reverted the deprecation: while upstream GPUStack v2.x stabilizes, the v0.7.1 CPU path is the production default for CPU-only deployments. Use the `llm` profile + HARDWARE=cpu only as the EXPERIMENTAL opt-in."
    has_ui: true
    app_icon: "razzfazz-ai_llm_icon.png"
    containers:
      - name: gpustack
        image: "gpustack/gpustack:v0.7.1-cpu"
        check_updates: true
      - name: model-sync
        image: "razzfazz-model-sync:latest"
        check_updates: false
      - name: ollama-proxy
        image: "eyalrot2/ollama-openai-proxy:latest"
        check_updates: true
    urls:
      - subdomain: llm
        label: "GPUStack Dashboard"
    databases:
      - gpustack_db
    ram_estimate_mb: 800
    ram_dynamic: true
    ram_notes: |
      Base GPUStack container uses ~800 MB. Loaded models consume
      additional CPU memory depending on model size and quantization:
      gemma4 (Q4): ~5 GB, qwen3-coder-next (Q4): ~9 GB.
      Model memory is ON TOP of the container estimate.
    dependencies:
      required: ["core"]
    mutual_exclusion: ["llm", "llm-legacy"]
    enable_impact: "Starts GPUStack + model sync + Ollama proxy. Models must be deployed separately."
    disable_impact: "Stops LLM inference. Chat and Dify lose model access."
    stack_impact: none
    risk_on_toggle: caution
    compose_file: "llm/compose.yml"
    compose_depends_on: ["postgres"]
    networking:
      caddy_routes:
        - subdomain: llm
          target: "gpustack:9090"
      internal_connections:
        - from: gpustack
          to: "postgres:5432"
          purpose: "GPUStack metadata database"
        - from: model-sync
          to: "gpustack:9090"
          purpose: "Poll GPUStack API for model list"
        - from: model-sync
          to: "postgres:5432"
          purpose: "Sync model list to Open WebUI database"
        - from: ollama-proxy
          to: "caddy:8989"
          purpose: "Translate Ollama API to GPUStack OpenAI API"
    storage:
      volumes:
        - name: gpustack-data
          purpose: "Model files, GPUStack state, inference cache"
    authentik:
      app_name: "LLM Management"
      provider: "Caddy Forward Auth Provider for LLM"
      user_group: "razzfazz.ai LLM Management Users"
    env_vars:
      - name: GPUSTACK_PORT
        default: "9090"
        secret: false
        description: "Internal API port for GPUStack"
      - name: GPUSTACK_API_KEY
        default: "gpustack_CHANGEME_AFTER_FIRST_START"
        secret: true
        description: "API key for GPUStack model management and inference"
      - name: GPUSTACK_MODE
        default: "standalone"
        secret: false
        description: "Deployment mode: standalone, master, or worker"
      - name: GPUSTACK_DATABASE_URL
        secret: true
        description: "PostgreSQL connection string for GPUStack"
    long_description: |
      GPUStack is a model serving platform that manages downloading, loading,
      and serving LLM models via an OpenAI-compatible API. The CPU profile
      uses llama.cpp for inference without GPU acceleration. It includes a
      model-sync sidecar that mirrors the model list to Open WebUI and an
      Ollama-compatible proxy for legacy tool integration.

      Use cases: serving local LLMs for chat, code completion, embeddings,
      multi-model A/B testing, distributed inference across worker nodes.

  llm-legacy:
    name: "LLM Inference (stable, GPUStack 0.7.1 + Vulkan)"
    category: "LLM Inference"
    maturity: production
    origin: US
    license: Apache-2.0
    github: "https://github.com/gpustack/gpustack"
    description: "GPUStack v0.7.1 + custom AMD Vulkan build — STABLE production default for AMD Strix Halo. M029-S04: promoted from rollback safety net to default while upstream v2.x stabilizes. Validated leak-free under stop/start cycles (M029-S01) — see ~/.gsd/reports/m029-s01-result-2026-05-07.md. Will be retired once `llm` (v2.1.x) has been in production ≥30 days post-2026.05-ga (tracked in M025-S01 split-out at 2026.10)."
    has_ui: true
    app_icon: "razzfazz-ai_llm_icon.png"
    containers:
      - name: gpustack
        image: "razzfazz-gpustack:vulkan"
        check_updates: false
      - name: model-sync
        image: "razzfazz-model-sync:latest"
        check_updates: false
      - name: ollama-proxy
        image: "eyalrot2/ollama-openai-proxy:latest"
        check_updates: true
    urls:
      - subdomain: llm
        label: "GPUStack Dashboard"
    databases:
      - gpustack_db
    ram_estimate_mb: 800
    ram_dynamic: true
    ram_notes: |
      Base GPUStack with Vulkan uses ~800 MB. Models are offloaded
      to GPU VRAM when possible, reducing CPU memory usage.
    dependencies:
      required: ["core"]
    mutual_exclusion: ["llm", "llm-cpu"]
    enable_impact: "Starts the frozen 0.7.1 + AMD Vulkan stack. Use only as a rollback from the standard `llm` profile."
    disable_impact: "Stops LLM inference. Chat and Dify lose model access."
    stack_impact: none
    risk_on_toggle: caution
    compose_file: "llm/compose.yml"
    compose_depends_on: ["postgres"]
    networking:
      caddy_routes:
        - subdomain: llm
          target: "gpustack:9090"
      internal_connections:
        - from: gpustack
          to: "postgres:5432"
          purpose: "GPUStack metadata database"
        - from: model-sync
          to: "gpustack:9090"
          purpose: "Poll GPUStack API for model list"
        - from: model-sync
          to: "postgres:5432"
          purpose: "Sync model list to Open WebUI database"
        - from: ollama-proxy
          to: "caddy:8989"
          purpose: "Translate Ollama API to GPUStack OpenAI API"
    storage:
      volumes:
        - name: gpustack-data
          purpose: "Model files, GPUStack state, inference cache"
    authentik:
      app_name: "LLM Management"
      provider: "Caddy Forward Auth Provider for LLM"
      user_group: "razzfazz.ai LLM Management Users"
    env_vars:
      - name: GPUSTACK_PORT
        default: "9090"
        secret: false
        description: "Internal API port for GPUStack"
      - name: GPUSTACK_API_KEY
        default: "gpustack_CHANGEME_AFTER_FIRST_START"
        secret: true
        description: "API key for GPUStack model management and inference"
      - name: GPUSTACK_MODE
        default: "standalone"
        secret: false
        description: "Deployment mode: standalone, master, or worker"
    long_description: |
      GPUStack with Vulkan/ROCm GPU acceleration for AMD Radeon GPUs.
      Offloads model layers to GPU VRAM for significantly faster inference
      compared to CPU-only mode. Built from a custom Dockerfile that includes
      Vulkan ICD and ROCm libraries. Otherwise identical to the CPU profile
      in features: model sync, Ollama proxy, and OpenAI-compatible API.

      Use cases: high-throughput local LLM inference on AMD GPUs, serving
      large models that benefit from VRAM offloading, real-time chat.

  llm:
    name: "LLM Inference (experimental, GPUStack 2.1.x)"
    category: "LLM Inference"
    maturity: experimental
    origin: US
    license: Apache-2.0
    github: "https://github.com/gpustack/gpustack"
    description: "GPUStack v2.1.x model server — EXPERIMENTAL. M029-S04: demoted from default to experimental while upstream stabilizes. Known issues: bus.py / cache.py memory leak under stop/start cycles (rc6.7 #48 / upstream PR #5255 still open) — partial backport via usercustomize.py monkey-patches. Custom backends (kyuz0 ROCm runner for AMD Strix Halo, ggml-org llama.cpp:server for CPU) registered automatically by llm/gpustack/init-backends.py. NVIDIA uses built-in vLLM. Pick `llm-legacy` for AMD or `llm-cpu` for CPU as the stable defaults; opt into `llm` for the latest features by passing --llm-experimental to razzfazz-init.sh / razzfazz-upgrade.sh, or via the Configuration Portal toggle."
    has_ui: true
    app_icon: "razzfazz-ai_llm_icon.png"
    containers:
      - name: gpustack
        image: "gpustack/gpustack:v2.1.2"
        check_updates: true
      - name: model-sync
        image: "razzfazz-model-sync:latest"
        check_updates: false
      - name: ollama-proxy
        image: "eyalrot2/ollama-openai-proxy:latest"
        check_updates: true
    urls:
      - subdomain: llm
        label: "GPUStack Dashboard"
    databases:
      - gpustack_db
    ram_estimate_mb: 800
    ram_dynamic: true
    ram_notes: |
      Base GPUStack v2.x server uses ~800 MB. Inference happens in
      separate runner containers (llama-server in kyuz0/amd-strix-halo-toolboxes
      for AMD, llama.cpp:server for CPU, gpustack/runner:cuda-vllm for NVIDIA);
      their memory is on top of the server estimate and is dominated by
      the loaded model size + KV cache.
    dependencies:
      required: ["core"]
    mutual_exclusion: ["llm-legacy", "llm-cpu"]
    enable_impact: "Starts upstream GPUStack v2.x + model-sync. Hardware overlay (HARDWARE) determines which devices the server sees. init-backends.py registers the custom inference backends."
    disable_impact: "Stops LLM inference. Chat and Dify lose model access."
    stack_impact: none
    risk_on_toggle: caution
    compose_file: "llm/compose.yml"
    compose_depends_on: ["postgres"]
    networking:
      caddy_routes:
        - subdomain: llm
          target: "gpustack:9090"
      internal_connections:
        - from: gpustack
          to: "postgres:5432"
          purpose: "GPUStack metadata database (gpustack_db)"
        - from: gpustack
          to: "docker-socket-proxy:2375"
          purpose: "Spawn per-model runner containers (llama-box-custom, llama-cpp-cpu-custom)"
        - from: model-sync
          to: "gpustack:9090"
          purpose: "Poll GPUStack API for model list, write OpenWebUI placeholder meta"
        - from: model-sync
          to: "postgres:5432"
          purpose: "Sync model list to Open WebUI database"
        - from: ollama-proxy
          to: "caddy:8989"
          purpose: "Translate Ollama API to GPUStack OpenAI API"
    storage:
      volumes:
        - name: gpustack-data
          purpose: "Model files, GPUStack state, inference cache"
    authentik:
      app_name: "LLM Management"
      provider: "Caddy Forward Auth Provider for LLM"
      user_group: "razzfazz.ai LLM Management Users"
    env_vars:
      - name: GPUSTACK_VERSION
        default: "v2.1.2"
        secret: false
        description: "Upstream gpustack/gpustack image tag for the `llm` profile"
      - name: HARDWARE
        default: "amd"
        secret: false
        description: "Hardware target (amd|nvidia|cpu) — selects llm/compose.devices.<HARDWARE>.yml"
      - name: COMPOSE_FILE
        default: "compose.yml:llm/compose.devices.amd.yml"
        secret: false
        description: "Auto-set from HARDWARE by razzfazz-init.sh / razzfazz-upgrade.sh"
      - name: GPUSTACK_PORT
        default: "9090"
        secret: false
        description: "Internal API port for GPUStack"
      - name: GPUSTACK_API_KEY
        default: "gpustack_CHANGEME_AFTER_FIRST_START"
        secret: true
        description: "API key for GPUStack model management and inference"
      - name: GPUSTACK_MODE
        default: "standalone"
        secret: false
        description: "Deployment mode: standalone, master, or worker"
      - name: GPUSTACK_BIND
        default: "0.0.0.0"
        secret: false
        description: "Required 0.0.0.0 in standalone for the embedded-worker self-healthcheck via host.docker.internal"
      - name: GPUSTACK_DATABASE_URL
        secret: true
        description: "PostgreSQL connection string for GPUStack"
    long_description: |
      Standard LLM inference path (M018+). Upstream GPUStack v2.x with custom
      backends registered via the v2 admin API (POST /v2/inference-backends):
        - llama-box-custom → kyuz0/amd-strix-halo-toolboxes:rocm-7.2.1 (AMD)
        - llama-cpp-cpu-custom → ghcr.io/ggml-org/llama.cpp:server (CPU)
      NVIDIA uses GPUStack's built-in vLLM backend (auto-pulls
      gpustack/runner:cuda-vllm-* on demand).

      Hardware-specific bits live in a separate device overlay file
      (llm/compose.devices.<HARDWARE>.yml) so a single service definition
      covers all variants. razzfazz-init.sh auto-detects HARDWARE; operators
      can override with --hardware.

      Use cases: serving local LLMs for chat, code completion, embeddings,
      multi-model A/B testing, distributed inference across worker nodes.

  mac-llm:
    name: "Mac LLM Gateway (LiteLLM)"
    category: "LLM Inference"
    maturity: experimental
    origin: US
    license: MIT
    github: "https://github.com/BerriAI/litellm"
    description: "Fronts one-or-more Macs running Ollama (Apple-Silicon / MLX) as a SECOND OpenAI-compatible endpoint — load-balanced + health-checked — via a LiteLLM proxy. Opt-in, OFF by default; GPUStack is UNTOUCHED. Declare Macs in modules/llm/mac-gateway/config.yaml (from config.example.yaml); a Config Portal panel (P2) will manage them. Internal-only in P1 (master-key auth, no Caddy route)."
    has_ui: false
    containers:
      - name: llm-mac-gateway
        image: "ghcr.io/berriai/litellm:main-v1.93.0-stable"
        check_updates: true
    ram_estimate_mb: 400
    ram_dynamic: false
    ram_notes: |
      LiteLLM proxy is a lightweight Python service (mem_limit 1g). All
      inference happens ON the Macs (outside the stack) — no model memory here.
    dependencies:
      required: ["core"]
    enable_impact: "Starts the llm-mac-gateway LiteLLM proxy. Requires MAC_GATEWAY_MASTER_KEY set and modules/llm/mac-gateway/config.yaml populated with your Macs. Add http://llm-mac-gateway:4000/v1 as a 2nd OpenAI endpoint in Open WebUI / Dify to surface the Mac models."
    disable_impact: "Stops the Mac gateway. Mac-hosted models disappear from the model list; the GPUStack path is unaffected."
    stack_impact: none
    risk_on_toggle: caution
    compose_file: "llm/mac-gateway/compose.yml"
    compose_depends_on: []
    networking:
      internal_connections:
        - from: openwebui
          to: "llm-mac-gateway:4000"
          purpose: "2nd OpenAI-compatible endpoint (Mac-hosted models), master-key auth"
        - from: llm-mac-gateway
          to: "<mac-ip>:11434"
          purpose: "Route inference to each Mac's Ollama OpenAI-compatible /v1 endpoint (host LAN, plaintext — firewall each Mac to this box's IP)"
    env_vars:
      - name: MAC_GATEWAY_MASTER_KEY
        secret: true
        description: "Master key components present to authenticate to the gateway. Required when mac-llm is enabled."
      - name: MAC_GATEWAY_PORT
        default: "4000"
        secret: false
        description: "Loopback host-side debug port (127.0.0.1); in-network consumers use llm-mac-gateway:4000"
      - name: LITELLM_VERSION
        default: "main-v1.93.0-stable"
        secret: false
        description: "Pinned LiteLLM image tag (ghcr.io/berriai/litellm:<tag>). Repin to a reviewed tag / digest at ship."
    long_description: |
      An opt-in LiteLLM proxy (llm-mac-gateway) that federates Mac-hosted
      Ollama/MLX models into the stack as a SECOND OpenAI-compatible endpoint,
      load-balanced and health-checked. GPUStack is left completely untouched —
      the gateway is a second endpoint alongside gpustack:9090/v1-openai, not a
      replacement (design decision, 2026-07-12).

      Each Mac is a host ip:port plus one-or-more {alias, ollama_tag} models,
      declared in the per-box, gitignored config.yaml (template:
      config.example.yaml). Two Macs sharing an alias for the same model
      auto-form one load-balance group.

      P1 (this release) is declarative: hand-edit config.yaml + wire Open WebUI.
      P2 adds a Config Portal "Mac LLM backends" panel (add/remove Macs, live
      health, Tier-1 model management over Ollama's HTTP API). Internal-only —
      no external route in P1; managed via the SSO-gated Config Portal.

  monitor:
    name: "Monitoring (Komodo)"
    category: "Monitoring"
    maturity: production
    origin: US
    license: GPL-3.0
    github: "https://github.com/moghtech/komodo"
    description: "Container monitoring and management UI — logs, restart controls, deployment tracking"
    has_ui: true
    app_icon: "razzfazz-ai_admin_icon.png"
    containers:
      - name: komodo-core
        image: "ghcr.io/moghtech/komodo-core"
        check_updates: true
      - name: komodo-periphery
        image: "ghcr.io/moghtech/komodo-periphery"
        check_updates: true
      - name: ferretdb
        image: "ghcr.io/ferretdb/ferretdb"
        check_updates: true
      - name: postgres-komodo
        image: "ghcr.io/ferretdb/postgres-documentdb"
        check_updates: true
    urls:
      - subdomain: admin
        label: "Komodo Dashboard"
    databases: []
    ram_estimate_mb: 600
    dependencies:
      required: []
    mutual_exclusion: []
    enable_impact: "Starts 4 containers with own PostgreSQL. Uses ~600 MB RAM."
    disable_impact: "Stops monitoring UI. No impact on other services."
    stack_impact: none
    risk_on_toggle: safe
    compose_file: "monitor/compose.yml"
    compose_depends_on: ["postgres-komodo", "ferretdb"]
    networking:
      caddy_routes:
        - subdomain: admin
          target: "komodo-core:8180"
      internal_connections:
        - from: komodo-core
          to: "ferretdb:27017"
          purpose: "MongoDB-compatible document store (via FerretDB)"
        - from: ferretdb
          to: "postgres-komodo:5432"
          purpose: "FerretDB backend storage"
        - from: komodo-periphery
          to: "/var/run/docker.sock"
          purpose: "Docker container management and log collection"
    storage:
      volumes:
        - name: postgres-komodo-data
          purpose: "Komodo monitoring database (separate PostgreSQL instance)"
    authentik:
      app_name: "Administration"
      provider: "Caddy Forward Auth Provider to Admin"
      user_group: "razzfazz.ai Docker Management Users"
    env_vars:
      - name: KOMODO_PORT
        default: "8180"
        secret: false
        description: "Internal port for Komodo Core web UI"
      - name: KOMODO_INIT_ADMIN_USERNAME
        default: "admin"
        secret: false
        description: "Initial admin username for Komodo"
      - name: KOMODO_INIT_ADMIN_PASSWORD
        default: "Run4Quality!"
        secret: true
        description: "Initial admin password for Komodo"
      - name: KOMODO_PASSKEY
        secret: true
        description: "Passkey for Komodo periphery agent authentication"
    long_description: |
      Komodo provides a web-based dashboard for monitoring and managing all
      Docker containers in the stack. It shows real-time logs, resource usage,
      restart controls, and deployment tracking. Uses its own PostgreSQL
      instance via FerretDB (MongoDB-compatible) to avoid sharing the main
      database.

      Use cases: container health monitoring, log inspection, restart/stop
      individual services, track deployment history and resource consumption.

  searxng:
    name: "Search (SearXNG)"
    category: "Search"
    maturity: production
    origin: EU
    license: AGPL-3.0
    github: "https://github.com/searxng/searxng"
    description: "Privacy-focused metasearch engine — aggregates results from 70+ search engines"
    has_ui: true
    # Internal-only: container has a built-in web UI, but the stack uses
    # SearXNG as a backend search engine for OpenWebUI (consumed via Docker
    # DNS at http://searxng:8080). NOT exposed to end users via Caddy +
    # Authentik. The validator (scripts/validate-module.sh) skips Caddy/
    # Authentik wiring probes (C7/C8) when this flag is set. F-A1 (S01.4.2).
    internal_only: true
    app_icon: "razzfazz-ai_search_icon.png"
    containers:
      - name: searxng
        image: "searxng/searxng:latest"
        check_updates: true
    urls: []
    databases: []
    ram_estimate_mb: 300
    dependencies:
      required: ["core"]
    mutual_exclusion: []
    enable_impact: "Starts SearXNG. Used by Chat and Dify for web search."
    disable_impact: "Web search in Chat and Dify stops working."
    stack_impact: none
    risk_on_toggle: safe
    compose_file: "search/searxng/compose.yml"
    compose_depends_on: []
    networking:
      caddy_routes: []
      internal_connections:
        - from: openwebui
          to: "searxng:8080"
          purpose: "Web search queries from Chat"
        - from: dify-api
          to: "searxng:8080"
          purpose: "Web search queries from Dify workflows"
    storage:
      volumes: []
    env_vars:
      - name: SEARXNG_PORT
        default: "8088"
        secret: false
        description: "Internal port for SearXNG search API"
      - name: SEARXNG_VERSION
        default: "latest"
        secret: false
        description: "SearXNG Docker image tag"
    long_description: |
      SearXNG is a privacy-respecting metasearch engine that aggregates results
      from 70+ search engines (Google, Bing, DuckDuckGo, etc.) without tracking.
      It runs as an internal service consumed by Open WebUI and Dify for web
      search augmentation. No external UI is exposed; it operates as a backend
      API for other services.

      Use cases: web search in AI chat conversations, grounding LLM responses
      with current information, research augmentation in Dify workflows.

  crawl4ai:
    name: "Crawl4AI"
    category: "Search"
    maturity: experimental
    origin: US
    license: Apache-2.0
    github: "https://github.com/unclecode/crawl4ai"
    description: "RAG-friendly web crawler — Markdown extraction, structured scraping, browser automation"
    has_ui: true
    app_icon: "razzfazz-ai_search_icon.png"
    containers:
      - name: crawl4ai
        image: "unclecode/crawl4ai"
        check_updates: true
    urls:
      - subdomain: crawl4ai
        label: "Crawl4AI Playground"
    databases: []
    ram_estimate_mb: 1024
    dependencies:
      required: ["core"]
      recommended: []
      optional: []
    mutual_exclusion: []
    enable_impact: "Pulls ~3 GB image (Chromium + Playwright bundled), starts in ~60s. Reserves 1g RAM + 1g shared memory for the headless browser."
    disable_impact: "Stops the crawler container; cache volume preserved for re-enable."
    stack_impact: none
    risk_on_toggle: caution
    compose_file: "search/crawl4ai/compose.yml"
    compose_depends_on: []
    networking:
      caddy_routes:
        - subdomain: crawl4ai
          target: "crawl4ai:11235"
      internal_connections:
        - from: dify-api
          to: "crawl4ai:11235"
          purpose: "RAG ingestion crawls from Dify knowledge-base workflows"
        - from: openwebui
          to: "crawl4ai:11235"
          purpose: "On-demand page distillation requested from chat"
    storage:
      volumes:
        - name: crawl4ai-cache
          purpose: "Browser cache + crawl history"
    authentik:
      app_name: "Crawl4AI"
      provider: "Caddy Forward Auth Provider for Crawl4AI"
      user_group: "razzfazz.ai Crawl4AI Users"
    env_vars:
      - name: CRAWL4AI_VERSION
        default: "0.8.9"
        secret: false
        description: "crawl4ai Docker image tag"
      - name: CRAWL4AI_PORT
        default: "8201"
        secret: false
        description: "Host-side loopback port"
      - name: CRAWL4AI_DOMAIN
        default: "crawl4ai.${MAIN_DOMAIN}"
        secret: false
        description: "Caddy subdomain for the playground / API"
      - name: CRAWL4AI_CLIENT_SECRET
        default: ""
        secret: true
        description: "Authentik forward-auth client secret"
    long_description: |
      Crawl4AI is an open-source web crawler purpose-built for RAG and
      AI-grounding workflows. It runs Chromium headless under Playwright,
      executes JavaScript, and emits clean Markdown / structured JSON suitable
      for direct ingestion into LightRAG, Cognee, Onyx, or Dify knowledge
      bases. Unlike SearXNG (which retrieves URLs), Crawl4AI fetches and
      distills the actual page content.

      Surfaces: REST API at /crawl, /scrape, /llm; OpenAPI at /docs; an
      operator playground at /playground; a monitoring dashboard at
      /dashboard. All paths gate through Authentik forward_auth except the
      Docker healthcheck (/monitor/health) and the OpenAPI spec.

      Use cases: ingesting curated URLs into a knowledge base on a schedule;
      ad-hoc operator queries to test extraction recipes; on-demand page
      distillation requested from chat ("read this URL and summarise"). Pairs
      with SearXNG (URL discovery) and Dify (workflow orchestration).

