  observability:
    name: "Observability"
    category: "Monitoring"
    maturity: experimental
    origin: US
    license: Apache-2.0
    github: "https://github.com/openlit/openlit"
    description: "Stack-wide LLM observability: cost, latency, tokens, prompt analysis."
    long_description: |
      OpenLIT captures every LLM call that flows through Open WebUI's pipe layer
      (Dify, GPUStack, hermes, moltis, opencode) and indexes them in ClickHouse
      for cost / latency / token / prompt-quality dashboards. 30-day retention
      with auto-prune.

      Surfaced via the global filter pipeline (chat/pipelines/openlit_filter.py).
      Direct backend → GPUStack calls (e.g. agent-internal autonomous turns)
      bypass the WebUI and are not captured by this profile alone — see M019
      docs for the per-backend SDK instrumentation follow-up.

      Memory-capped at 2.5 GB total (ClickHouse 2g + OpenLIT 512m).
    has_ui: true
    # #1962: does this module show ITS OWN login mask after the Authentik SSO?
    own_login:
      state: unmeasured
      reason: "not active in the 2026-09-11 rotation on 0.91 — the probe counts password fields and reports, it does not grade, until a rotation with this module on measures it (#1962)."
    app_icon: "razzfazz-ai_admin_icon.png"
    containers:
      - name: openlit
        image: "ghcr.io/openlit/openlit"
        check_updates: true
      - name: postgres-exporter
        image: "quay.io/prometheuscommunity/postgres-exporter"
        check_updates: true
      - name: valkey-exporter
        image: "oliver006/redis_exporter"
        check_updates: true
      - name: otel-collector
        image: "otel/opentelemetry-collector-contrib"
        check_updates: true
      - name: clickhouse
        image: "clickhouse/clickhouse-server"
        check_updates: true
    urls:
      - subdomain: observability
        label: "OpenLIT UI"
    databases: []
    ram_estimate_mb: 3072
    dependencies:
      required: ["core"]
      recommended: ["chat"]
      optional: []
    mutual_exclusion: []
    enable_impact: "Pulls ~600 MB images, starts ClickHouse + OpenLIT + otel-collector in ~90s. Reserves ~3 GB RAM."
    disable_impact: "Stops trace capture; historical data preserved in clickhouse-data volume."
    stack_impact: none
    risk_on_toggle: caution
    compose_file: "modules/observability/compose.yml"
    compose_depends_on: []
    networking:
      caddy_routes:
        - subdomain: observability
          target: "openlit:3000"
      internal_connections:
        - from: openlit
          to: "clickhouse:8123"
          purpose: "Dashboard reads spans from the trace store (HTTP)"
        - from: pipelines
          to: "otel-collector:4318"
          purpose: "OTLP HTTP receiver — global filter emits chat traces here (#193)"
        - from: otel-collector
          to: "clickhouse:9000"
          purpose: "ClickHouse exporter writes otel_traces/logs/metrics (native)"
    storage:
      volumes:
        - name: observability-data
          purpose: "OpenLIT UI session/state"
        - name: clickhouse-data
          purpose: "ClickHouse data files (span/trace store)"
        - name: clickhouse-backup
          purpose: "Native ClickHouse BACKUP TO Disk target — swept into nightly tar.gz"
    authentik:
      app_name: "Observability"
      provider: "Caddy Forward Auth Provider for Observability"
      user_group: "razzfazz.ai Observability Users"
    env_vars:
      - name: OBSERVABILITY_VERSION
        default: "1.22.0"
        secret: false
        description: "OpenLIT container image tag"
      - name: OBSERVABILITY_PORT
        default: "8200"
        secret: false
        description: "Loopback host port for OpenLIT UI (Caddy reverse-proxies from observability.<DOMAIN>)"
      - name: OBSERVABILITY_DOMAIN
        secret: false
        description: "Caddy subdomain (typically observability.<MAIN_DOMAIN>)"
      - name: OBSERVABILITY_CLIENT_SECRET
        secret: true
        description: "Authentik forward-auth client secret"
      - name: OBSERVABILITY_RETENTION_DAYS
        default: "30"
        secret: false
        description: "ClickHouse TTL for OpenLIT span tables (auto-prune older data)"
      - name: CLICKHOUSE_VERSION
        default: "25.8.25.37"
        secret: false
        description: "ClickHouse container image tag"
      - name: CLICKHOUSE_USER
        default: "default"
        secret: false
        description: "ClickHouse admin username"
      - name: CLICKHOUSE_PASSWORD
        secret: true
        description: "ClickHouse admin password (generated by razzfazz-init.sh)"
      - name: OTEL_COLLECTOR_VERSION
        default: "0.130.1"
        secret: false
        description: "otel/opentelemetry-collector-contrib image tag (the real OTLP collector — #193)"
      - name: OTEL_LOG_EXPORT_ENABLED
        default: "false"
        secret: false
        description: "#197: opt-in — ship ALL container logs to an external OTLP target (off by default)"
      - name: OTEL_COLLECTOR_LOGS_OVERLAY
        default: "otel-collector-logs-disabled.yaml"
        secret: false
        description: "Mechanical switch: which logs overlay the collector merges (disabled=no-op, export=#197)"
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        secret: false
        description: "Customer OTLP target host:port (gRPC) or URL. Required only when log export is enabled"
      - name: OTEL_EXPORTER_OTLP_PROTOCOL
        default: "grpc"
        secret: false
        description: "grpc | http/protobuf — external log-export exporter protocol"
      - name: OTEL_EXPORTER_OTLP_HEADERS
        secret: true
        description: "Auth header VALUE sent as `Authorization: <this>` to the OTLP target (secret; never logged)"
      - name: OTEL_EXPORTER_OTLP_INSECURE
        default: "false"
        secret: false
        description: "TLS to the OTLP target: false=verify system CA roots, true=plaintext (trusted network only)"

  # ==========================================================================
  # WAZUH — Security Monitoring / SIEM (#855) [EXPERIMENTAL]
  # ==========================================================================
  wazuh:
    name: "Wazuh"
    category: "Security"
    maturity: experimental
    origin: US
    # DECISION-6: the distribution is not one licence. The Wazuh server is
    # GPL-2.0; the indexer and dashboard are OpenSearch / OpenSearch-Dashboards
    # forks under Apache-2.0. GPL-2.0 is NOT on the add-module skill's Q32
    # allow-list (SKILL.md:175) — recorded as a deliberate deviation pending
    # legal sign-off, not a silent widening of that list.
    license: "GPL-2.0 AND Apache-2.0"
    github: "https://github.com/wazuh/wazuh"
    description: "Open-source SIEM/XDR — host intrusion detection, file-integrity monitoring, log correlation, CIS/NIST/PCI compliance mappings"
    has_ui: true
    # #1962: does this module show ITS OWN login mask after the Authentik SSO?
    own_login:
      state: unexpected
      reason: "0 password fields after SSO on 0.91, 2026-09-11 (lands on /app/wz-home) — native OIDC; a login mask here is a defect (#1962, #1940)."
    app_icon: "razzfazz-ai_wazuh_icon.png"
    containers:
      - name: wazuh-manager
        image: "wazuh/wazuh-manager:4.14.7"
        check_updates: true
      - name: wazuh-indexer
        image: "wazuh/wazuh-indexer:4.14.7"
        check_updates: true
      - name: wazuh-dashboard
        image: "wazuh/wazuh-dashboard:4.14.7"
        check_updates: true
      - name: wazuh-certs-generator
        # #1277: built here (certs-generator/Dockerfile), not pulled — upstream
        # downloads its cert tool at CONTAINER START, which an offline box cannot do.
        image: "razzfazz-wazuh-certs-generator:0.0.4"
        check_updates: false
      - name: wazuh-securityconfig-init
        image: "wazuh/wazuh-indexer:4.14.7"
        check_updates: false
      - name: wazuh-securityadmin
        image: "wazuh/wazuh-indexer:4.14.7"
        check_updates: false
      - name: wazuh-dashboard-config-init
        image: "wazuh/wazuh-dashboard:4.14.7"
        check_updates: false
    urls:
      - subdomain: wazuh
        label: "Wazuh"
    databases: []
    ram_estimate_mb: 5120
    ram_dynamic: false
    ram_notes: |
      wazuh-indexer (2GB) + wazuh-manager (2GB) + wazuh-dashboard (1GB). The
      four one-shots are capped at 256MB each and exit. Same footprint class as
      onyx/vespa — see DECISION-3 for the operator RAM-budget confirmation this
      module requires before enabling on a shared box. Task 25 Step 13 replaces
      this estimate with a measured value.
    ram_breakdown:
      - component: "Indexer (OpenSearch fork, 1g heap)"
        mb: 2048
      - component: "Manager (analysisd/wazuh-db + rule engine)"
        mb: 2048
      - component: "Dashboard (Node.js frontend)"
        mb: 1024
    dependencies:
      required: ["core"]
      recommended: []
      optional: []
    mutual_exclusion: []
    enable_impact: "Pulls 4 images, generates a TLS PKI and all module credentials on first start (needs one-time egress to packages.wazuh.com, DECISION-7), reserves ~5GB RAM, and requires vm.max_map_count >= 262144."
    disable_impact: "Stops all containers; volumes (indexed events, agent keys, PKI) preserved for re-enable. Enrolled agents on other boxes stop reporting and will buffer, then drop."
    stack_impact: none
    risk_on_toggle: caution
    compose_file: "modules/apps/wazuh/compose.yml"
    compose_depends_on: []
    networking:
      caddy_routes:
        - subdomain: wazuh
          target: "wazuh-dashboard:5601"
      internal_connections:
        - from: wazuh-manager
          to: "wazuh-indexer:9200"
          purpose: "Filebeat ships alerts into the event index (mTLS, module PKI)"
        - from: wazuh-dashboard
          to: "wazuh-indexer:9200"
          purpose: "Queries the event index (kibanaserver service account)"
        - from: wazuh-dashboard
          to: "wazuh-manager:55000"
          purpose: "Wazuh API (agent list, rules, config) as the wazuh-wui user"
    storage:
      volumes:
        - name: wazuh-manager-data
          purpose: "Wazuh manager state incl. the AGENT KEY STORE — archived (DECISION-9)"
        - name: wazuh-manager-config
          purpose: "Rendered ossec.conf + generated authd.pass — regenerated on every start, not archived"
        - name: wazuh-indexer-data
          purpose: "Indexed security events (OpenSearch data dir) — archived (DECISION-9: retained events are themselves the compliance artefact; budget the archive size)"
        - name: wazuh-indexer-security
          purpose: "Generated internal_users.yml/config.yml/roles_mapping.yml — regenerated on every start, not archived"
        - name: wazuh-dashboard-data
          purpose: "Dashboard saved objects/state — archived"
        - name: wazuh-dashboard-config
          purpose: "Rendered opensearch_dashboards.yml — regenerated on every start, not archived"
        - name: wazuh-certs-data
          purpose: "The module's entire PKI (root CA + per-node certs) — archived; losing it invalidates every enrolled agent (DECISION-9)"
    authentik:
      app_name: "Wazuh"
      provider: "Wazuh OIDC Provider"
      user_group: "razzfazz.ai Wazuh Users"
    env_vars:
      - name: WAZUH_VERSION
        default: "4.14.7"
        secret: false
        description: "Image tag shared by manager, indexer and dashboard — version-locked, bump all three together"
      - name: WAZUH_DASHBOARD_PORT
        default: "8203"
        secret: false
        # rev-B LOW 19: the old wording ("Caddy proxies wazuh.<domain> to it")
        # was wrong for this port. Caddy reaches wazuh-dashboard:5601 over the
        # docker network and never touches the host bind; 8203 is only the
        # loopback operator port for a local curl / SSH tunnel.
        description: "Loopback-only operator port for the dashboard (local curl / SSH tunnel). Caddy does NOT use it — it reaches wazuh-dashboard:5601 over the docker network"
      - name: WAZUH_DOMAIN
        default: "wazuh.${MAIN_DOMAIN}"
        secret: false
        description: "Public subdomain for the Wazuh console"
      - name: WAZUH_AUTH_MODE
        default: "native_oidc"
        secret: false
        description: "native_oidc (Authentik SSO inside the dashboard, recommended) or forward_auth (Caddy gate only, local account inside)"
      - name: WAZUH_MANAGER_HOST_BIND
        default: "127.0.0.1"
        secret: false
        description: "SECURITY: host interface for agent ports 1514/1515. Loopback by default; a fleet operator pins ONE LAN IP here and never 0.0.0.0"
      - name: WAZUH_SYSLOG_HOST_BIND
        default: "127.0.0.1"
        secret: false
        description: "SECURITY: host interface for the UNAUTHENTICATED 514/udp syslog listener. Loopback by default; never 0.0.0.0"
      - name: WAZUH_ALLOWED_IPS
        default: ""
        secret: false
        description: "Extra CIDRs allowed to reach the manager's 1514 agent event channel, comma-separated. #1537: NOT the 1515 enrolment port — wazuh-authd refuses <allowed-ips> inside <auth>, so 1515 is fenced by WAZUH_MANAGER_HOST_BIND and the authd password. Empty = loopback + docker bridge only. A default route or a non-CIDR value is rejected"
      - name: WAZUH_SYSLOG_ALLOWED_IPS
        default: ""
        secret: false
        description: "Extra CIDRs allowed to reach the UNAUTHENTICATED 514 syslog listener — separate from WAZUH_ALLOWED_IPS on purpose: anything in this range can inject forged events. Empty = loopback + docker bridge only"
      - name: WAZUH_MANAGER_EVENTS_PORT
        default: "1514"
        secret: false
        description: "Host port for the TLS agent event channel"
      - name: WAZUH_MANAGER_ENROLL_PORT
        default: "1515"
        secret: false
        description: "Host port for agent enrolment (authd) — requires WAZUH_AUTHD_PASSWORD"
      - name: WAZUH_MANAGER_SYSLOG_PORT
        default: "514"
        secret: false
        description: "Host port for the syslog listener. 514 is often already taken by rsyslog"
      - name: WAZUH_INDEXER_PASSWORD
        default: ""
        secret: true
        description: "Indexer `admin` account; bcrypt-hashed into internal_users.yml at container start"
      - name: WAZUH_DASHBOARD_PASSWORD
        default: ""
        secret: true
        description: "Indexer `kibanaserver` service account used by the dashboard"
      - name: WAZUH_API_PASSWORD
        default: ""
        secret: true
        description: "Manager API user `wazuh-wui`"
      - name: WAZUH_AUTHD_PASSWORD
        default: ""
        secret: true
        description: "Agent-enrolment shared secret. Without it, anything that reaches port 1515 can enrol as a trusted agent"
      - name: WAZUH_AGENT_AUTO_ENROLL
        default: "false"
        secret: false
        description: "SECURITY: ships OFF. When true, `rzfz post-install` (and every --refresh/upgrade) enrols THIS box's own wazuh-agent (journald + host FIM + the allow-listed container logs) so a fresh master/worker appears in Wazuh automatically. Auto-enrolment enlarges the SIEM enrolment surface, so the default flip is gated by the release security assessment. Needs WAZUH_AUTHD_PASSWORD and root"
      - name: WAZUH_AGENT_MANAGER_ADDRESS
        default: ""
        secret: false
        description: "Manager this box's agent enrols against. Empty = 127.0.0.1 when the box runs the wazuh profile itself; a worker with no local manager sets the fleet manager's LAN address"
      - name: WAZUH_AGENT_CONTAINERS
        default: ""
        secret: false
        description: "Comma-separated container NAMES whose stdout the agent ships (the stack's Docker-security surface — container logs, not the docker-listener socket). Empty = caddy,postgres,authentik-server"
      - name: WAZUH_AWS_S3_BUCKET
        default: ""
        secret: false
        description: "Cloud security: AWS S3 log bucket to ingest (CloudTrail etc.). Empty = cloud ingestion OFF. Enabling it rides the release security assessment"
      - name: WAZUH_AWS_S3_LOG_TYPE
        default: "cloudtrail"
        secret: false
        description: "AWS S3 bucket log type for the aws-s3 wodle (cloudtrail, config, vpcflow, custom, …)"
      - name: WAZUH_AWS_REGION
        default: ""
        secret: false
        description: "AWS region for the S3 log bucket (optional)"
      - name: WAZUH_AWS_PROFILE
        default: ""
        secret: false
        description: "AWS credential profile for the aws-s3 wodle. Empty = default credential chain / IAM instance role. Inline keys are deprecated (Wazuh 4.4) — the secret never enters the rendered config"
      - name: WAZUH_EMAIL_ALERT_LEVEL
        default: "12"
        secret: false
        description: "Alerts at or above this level are mailed to RAZZFAZZ_OPERATOR_EMAIL via the stack relay (#2002). 12 = someone should look now; <log_alert_level> stays 3"
      - name: WAZUH_CLIENT_SECRET
        default: ""
        secret: true
        description: "Authentik forward-auth ProxyProvider secret (app slug `wazuh`) — the layer that makes wazuh.<domain> answer at all"
      - name: WAZUH_OIDC_CLIENT_ID
        default: "wazuh"
        secret: false
        description: "OIDC client id registered on the Authentik OAuth2 provider; the discovery URL uses the application SLUG `wazuh-oidc`, not this value"
      - name: WAZUH_OIDC_CLIENT_SECRET
        default: ""
        secret: true
        description: "Authentik OIDC client secret for the dashboard's native SSO (app slug `wazuh-oidc`)"
    long_description: |
      Wazuh is an open-source security monitoring platform combining host
      intrusion detection (HIDS), file-integrity monitoring (FIM),
      security-configuration assessment (CIS benchmarks) and log correlation,
      with built-in regulatory-compliance mappings (PCI DSS, GDPR, NIST
      800-53). It runs three services — wazuh-manager (rule engine + agent
      enrolment), wazuh-indexer (an OpenSearch fork storing all events) and
      wazuh-dashboard (the web console) — plus four one-shot init containers
      that generate the module's PKI and its credentials, and a per-box
      wazuh-agent host component that watches journald, an allow-listed set of
      container logs, and file integrity on key directories. A manager-side
      syslog listener lets agentless devices feed events in without an agent.

      Same footprint class as Onyx/Vespa — heavyweight, EXPERIMENTAL, opt-in.
      Not recommended alongside other heavy modules without a real RAM budget
      review (DECISION-3 in the implementation plan). Note the trust boundary:
      whoever can read the Wazuh dashboard can read the stdout of every
      allow-listed container (DECISION-11).
