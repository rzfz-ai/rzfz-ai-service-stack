        description: "Tesseract OCR language codes (plus-separated)"
      - name: PAPERLESS_CLIENT_SECRET
        secret: true
        description: "Authentik forward-auth client secret"
    long_description: |
      Paperless-ngx is a document management system that scans, OCRs, archives,
      and indexes paper documents into a searchable web archive. It integrates
      with Gotenberg for Office-to-PDF conversion and Apache Tika for advanced
      text extraction. Authentik SSO provides access control via the
      X-Authentik-Username header.

      Use cases: paperless office, invoice archival, receipt management,
      full-text search across scanned documents, automated filing by tags.

  vaultwarden:
    name: "Vaultwarden"
    category: "Security"
    maturity: experimental
    origin: EU
    license: AGPL-3.0
    github: "https://github.com/dani-garcia/vaultwarden"
    description: "Self-hosted Bitwarden-compatible password manager with Authentik OIDC SSO"
    long_description: |
      Vaultwarden is a lightweight, Rust-based reimplementation of the Bitwarden
      server API. It is fully compatible with official Bitwarden browser
      extensions, desktop apps, and mobile clients. Authentik OIDC SSO provides
      single sign-on so users log in with their stack credentials. The server
      uses only ~100 MB RAM and stores vaults in a local SQLite database.

      Use cases: team password management, secure credential sharing, browser
      auto-fill via Bitwarden extension, API key storage for developers.
    has_ui: true
    app_icon: "razzfazz-ai_vault_icon.png"
    containers:
      - name: vaultwarden
        image: "vaultwarden/server:latest"
        check_updates: true
    urls:
      - subdomain: vault
        label: "Vaultwarden"
    databases: []
    ram_estimate_mb: 100
    dependencies:
      required: ["core"]
    mutual_exclusion: []
    enable_impact: "Starts Vaultwarden. Lightweight (~100 MB RAM)."
    disable_impact: "Password manager unavailable."
    stack_impact: none
    risk_on_toggle: caution

  infisical:
    name: "Infisical"
    category: "Security"
    maturity: experimental
    origin: US
    license: MIT
    github: "https://github.com/Infisical/infisical"
    description: "Self-hosted secrets management for developers and AI coding agents"
    long_description: |
      Infisical is a developer-focused secrets management platform that stores
      API keys, database credentials, and configuration secrets with project
      and environment scoping (dev/staging/prod). It provides a web dashboard,
      CLI, and REST API for secret retrieval. AI coding agents like OpenHands
      can pull secrets at runtime via the API. Authentik SSO provides access
      control.

      Use cases: centralized secret storage for development teams, runtime
      secret injection for AI agents, environment-scoped configuration.
    has_ui: true
    app_icon: "razzfazz-ai_secrets_icon.png"
    containers:
      - name: infisical
        image: "infisical/infisical:latest-postgres"
        check_updates: true
    urls:
      - subdomain: infisical
        label: "Infisical"
    databases: []
    ram_estimate_mb: 500
    dependencies:
      required: ["core"]
    mutual_exclusion: []
    enable_impact: "Starts Infisical secrets management."
    disable_impact: "Secrets management platform unavailable."
    stack_impact: none
    risk_on_toggle: caution

  onyx:
    name: "Onyx (Enterprise Search)"
    category: "Enterprise Search"
    maturity: experimental
    origin: US
    license: MIT
    github: "https://github.com/onyx-dot-app/onyx"
    description: "AI enterprise search — connects to 40+ data sources, semantic search with LLM answers"
    has_ui: true
    app_icon: "razzfazz-ai_search_icon.png"
    containers:
      - name: onyx-api
        image: "onyxdotapp/onyx-backend:latest"
        check_updates: true
      - name: onyx-background
        image: "onyxdotapp/onyx-backend:latest"
        check_updates: false
      - name: onyx-web
        image: "onyxdotapp/onyx-web-server:latest"
        check_updates: true
      - name: onyx-model-server
        image: "onyxdotapp/onyx-model-server:latest"
        check_updates: true
      - name: onyx-model-indexer
        image: "onyxdotapp/onyx-model-server:latest"
        check_updates: false
      - name: onyx-vespa
        image: "vespaengine/vespa:8.609.39"
        check_updates: true
    urls:
      - subdomain: onyx
        label: "Onyx Search"
    databases: []
    ram_estimate_mb: 5200
    ram_dynamic: false
    ram_notes: |
      Onyx runs 6 containers including a Vespa search engine which alone
      needs ~3 GB. This is one of the heaviest modules in the stack.
      Not recommended on boxes with less than 32 GB total RAM.
    ram_breakdown:
      - component: "Vespa search engine"
        mb: 3000
      - component: "API + background workers"
        mb: 1200
      - component: "Model server + indexer"
        mb: 1000
    dependencies:
      required: ["core"]
      recommended: ["llm"]
    mutual_exclusion: []
    enable_impact: "Starts 6 containers (~5.2 GB RAM). Heavy module."
    disable_impact: "Enterprise search unavailable."
    stack_impact: none
    risk_on_toggle: caution
    compose_file: "apps/onyx/compose.yml"
    compose_depends_on: ["postgres", "valkey", "onyx-vespa", "onyx-model-server", "onyx-model-indexer"]
    networking:
      caddy_routes:
        - subdomain: onyx
          target: "onyx-web:3000"
        - subdomain: onyx
          path: "/api/*"
          target: "onyx-api:8080"
      internal_connections:
        - from: onyx-api
          to: "postgres:5432"
          purpose: "Application database (onyx_db) and file store"
        - from: onyx-api
          to: "valkey:6379"
          purpose: "Task queue and cache (Redis DB 7)"
        - from: onyx-api
          to: "onyx-vespa:19071"
          purpose: "Vector and keyword search index"
        - from: onyx-api
          to: "onyx-model-server:9000"
          purpose: "Embedding model inference"
        - from: onyx-background
          to: "gitea:3000"
          purpose: "GitHub-compatible connector for repo indexing"
        - from: onyx-web
          to: "onyx-api:8080"
          purpose: "Next.js frontend to API backend"
    storage:
      volumes:
        - name: onyx-vespa-data
          purpose: "Vespa search index data"
        - name: onyx-model-cache
          purpose: "Cached embedding models for inference"
        - name: onyx-indexer-model-cache
          purpose: "Cached embedding models for document indexing"
    authentik:
      app_name: "Search"
      provider: "Caddy Forward Auth Provider for Onyx"
      user_group: null
    env_vars:
      - name: ONYX_DOMAIN
        default: "onyx.${MAIN_DOMAIN}"
        secret: false
        description: "Public subdomain for the Onyx search UI"
      - name: ONYX_SECRET
        secret: true
        description: "User auth secret for Onyx internal authentication"
      - name: ONYX_DB
        default: "onyx_db"
        secret: false
        description: "PostgreSQL database name for Onyx"
      - name: ONYX_CLIENT_SECRET
        secret: true
        description: "Authentik forward-auth client secret"
    long_description: |
      Onyx is an AI-powered enterprise search platform that connects to 40+
      data sources (Gitea repos, Paperless-ngx documents, web pages) and
      provides semantic search with LLM-generated answers. It runs its own
      Vespa search engine, embedding model servers, and a Next.js frontend.
      One of the heaviest modules in the stack (~5 GB RAM).

      Use cases: unified search across code and documents, AI-powered Q&A
      over internal knowledge, connector-based indexing of team resources.

