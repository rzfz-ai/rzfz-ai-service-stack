    description: "Speech-to-text and text-to-speech via Speaches (Whisper STT + Kokoro/Piper TTS)"
    has_ui: false
    containers:
      - name: speaches
        image: "ghcr.io/speaches-ai/speaches:latest-cpu"
        check_updates: true
    urls: []
    databases: []
    ram_estimate_mb: 500
    dependencies:
      required: ["core"]
    mutual_exclusion: []
    enable_impact: "Starts STT + TTS services. Downloads Whisper model (~500 MB) on first start."
    disable_impact: "Voice features in Chat stop working."
    stack_impact: none
    risk_on_toggle: safe
    compose_file: "stts/compose.yml"
    compose_depends_on: []
    networking:
      caddy_routes: []
      internal_connections:
        - from: openwebui
          to: "speaches:8000"
