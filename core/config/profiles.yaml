  cognee:
    name: "Cognee (GraphRAG)"
    category: "Knowledge"
    maturity: production
    origin: US
    license: Apache-2.0
    github: "https://github.com/topoteretes/cognee"
    description: "GraphRAG knowledge engine with AI memory — builds structured knowledge graphs"
    long_description: |
      Cognee builds structured knowledge graphs from unstructured data using
      an embedded graph database (ladybug, cognee's successor to Kuzu) — no
      separate graph container to run or back up. It performs entity extraction,
      relationship mapping, and contextual reasoning to create a persistent
      memory layer for AI agents. The knowledge graph enables multi-hop queries
      that connect information across documents and conversations.

      Use cases: AI agent memory and context retention, knowledge graph
      construction from documents, contextual reasoning over company data.
    has_ui: true
    # #1962: does this module show ITS OWN login mask after the Authentik SSO?
    own_login:
      state: expected
      reason: "cognee's frontend has a local login (/local-login); measured 1 password field after SSO on 0.91, 2026-09-11 (#1822, #1962)."
    app_icon: "razzfazz-ai_cognee_icon.png"
    containers:
      # rc2 (Cognee 1.0.1) dropped the FalkorDB sidecar and switched to an
      # embedded Kuzu graph — do not re-add a falkordb entry here or the
      # "enable profile" apply-dialog will call `docker compose up
      # cognee falkordb` and crash with "no such service: falkordb".
      - name: cognee
        image: "razzfazz-cognee:latest"
        check_updates: false
      # #538: these three were missing, so enabling cognee from the portal
      # started the API only — no UI, no MCP endpoint — and reported success.
      # Seen on a customer box 2026-08-20.
      - name: cognee-frontend
        image: "razzfazz-stack-cognee-frontend:latest"
        check_updates: false
      - name: cognee-mcp
        image: "cognee/cognee-mcp:1.5.3.dev1"
        check_updates: false
      - name: cognee-authshim-image-builder
        image: "razzfazz-mcp-cognee-authshim:latest"
        check_updates: false
    urls:
      - subdomain: cognee
        label: "Cognee"
    databases:
      - cognee_db
    ram_estimate_mb: 500
    dependencies:
      required: ["core"]
      recommended: ["llm-manager"]
    mutual_exclusion: []
    enable_impact: "Starts Cognee (one container; the graph database is embedded)."
    disable_impact: "GraphRAG knowledge engine unavailable."
    stack_impact: none
    risk_on_toggle: safe

  tika:
