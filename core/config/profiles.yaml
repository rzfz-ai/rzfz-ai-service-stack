      for encrypted team messaging, rooms, and direct messages. Authentik OIDC
      provides single sign-on. Matrix federation is disabled by default.
      The SYNAPSE_SERVER_NAME is permanent and determines Matrix user IDs
      (@user:domain).

      Use cases: internal team chat, encrypted messaging, bot integration
      via Moltis agent, bridging to Telegram/Discord/Slack.

  paperless-ngx:
