  openuem:
    name: "OpenUEM"
    category: "Security"
    maturity: experimental
    origin: EU
    license: Apache-2.0
    github: "https://github.com/open-uem"
    description: "Unified endpoint management — inventory, software deployment and remote assistance for the fleet"
    has_ui: true
    # #1962: does this module show ITS OWN login mask after the Authentik SSO?
    own_login:
      state: expected
      reason: "OpenUEM's console shows its own login on /; measured 1 password field after SSO on 0.91, 2026-09-11 — the ui_smoke FAIL of that rotation was this, not a broken module (#1962)."
    app_icon: "razzfazz-ai_admin_icon.png"
    containers:
      - name: openuem-console
        image: "openuem/openuem-console"
        check_updates: true
      - name: openuem-worker-agents
        image: "openuem/openuem-worker"
        check_updates: true
      - name: openuem-worker-cert-manager
        image: "openuem/openuem-worker"
        check_updates: false
      - name: openuem-worker-notification
        image: "openuem/openuem-worker"
        check_updates: false
      - name: openuem-certs
        image: "openuem/openuem-cert-manager"
        check_updates: true
      - name: openuem-ocsp-responder
        image: "openuem/openuem-ocsp-responder"
        check_updates: true
      - name: openuem-nats
        image: "nats"
        check_updates: true
    urls:
      - subdomain: openuem
        label: "OpenUEM Console"
    databases:
      - openuem_db
    ram_estimate_mb: 3300
    ram_dynamic: false
    ram_notes: |
      Seven containers, but every long-running one is a static Go binary and
      all durable state lives in the shared Postgres. 3300 MB is the sum of the
      caps, not an expectation: typical steady state is ~1.0-1.5 GB. The disk
      budget matters more than the RAM one — JetStream is capped at 5 GB by the
      generated broker config.
    ram_breakdown:
      - component: "Console (Echo/HTMX)"
        mb: 1024
      - component: "NATS + JetStream broker"
        mb: 1024
      - component: "Three agent workers"
        mb: 1536
      - component: "OCSP responder"
        mb: 256
    dependencies:
      required: ["core"]
      recommended: []
      optional: []
    mutual_exclusion: []
    enable_impact: "Starts 6 long-running containers plus a one-shot PKI bootstrap (~3.3 GB cap, ~1.5 GB typical). Creates a private CA on first start."
    disable_impact: "Endpoint management unavailable; agents queue and retry. PKI, broker config and JetStream data are preserved in volumes for re-enable."
    stack_impact: none
    risk_on_toggle: caution
    compose_file: "modules/apps/openuem/compose.yml"
    compose_depends_on: ["postgres", "postgres-db-reconcile"]
    networking:
      caddy_routes:
        - subdomain: openuem
          target: "openuem-console:1323"
      internal_connections:
        - from: openuem-certs
          to: "postgres:5432"
          purpose: "Registers every issued certificate in openuem_db"
        - from: openuem-console
          to: "postgres:5432"
          purpose: "Application database (openuem_db)"
        - from: openuem-console
          to: "openuem-nats:4433"
          purpose: "Publishes agent commands over the broker (mTLS)"
        - from: openuem-worker-agents
          to: "openuem-nats:4433"
          purpose: "Consumes agent reports (mTLS)"
        - from: openuem-worker-cert-manager
          to: "openuem-nats:4433"
          purpose: "Issues per-agent certificates on admission (mTLS)"
        - from: openuem-worker-notification
          to: "smtp-relay:587"
          purpose: "Operator notification email"
        - from: openuem-nats
          to: "openuem-ocsp-responder:8202"
          purpose: "OCSP peer check on every client connect"
    storage:
      volumes:
        - name: openuem-pki
          purpose: "Private CA, component certificates, agent enrolment keypair, admin .pfx — backed up"
        - name: openuem-nats-conf
          purpose: "Generated broker config incl. the DN authorization table — backed up"
        - name: openuem-jetstream
          purpose: "JetStream stream store (in-flight agent reports) — backed up"
        - name: openuem-certs-nats
          backup: excluded   # #1172: derived/cache, regenerated — deliberately not archived
          purpose: "Broker certificate + key (derived from openuem-pki, not backed up)"
        - name: openuem-certs-ocsp
          backup: excluded   # #1172: derived/cache, regenerated — deliberately not archived
          purpose: "OCSP responder certificate + key (derived, not backed up)"
        - name: openuem-certs-console
          backup: excluded   # #1172: derived/cache, regenerated — deliberately not archived
          purpose: "Console + SFTP certificates (derived, not backed up)"
        - name: openuem-certs-worker-agents
          backup: excluded   # #1172: derived/cache, regenerated — deliberately not archived
          purpose: "Agent-worker client certificate (derived, not backed up)"
        - name: openuem-certs-worker-cert-manager
          backup: excluded   # #1172: derived/cache, regenerated — deliberately not archived
          purpose: "Cert-manager-worker client certificate AND the CA private key (derived, not backed up)"
        - name: openuem-certs-worker-notification
          backup: excluded   # #1172: derived/cache, regenerated — deliberately not archived
          purpose: "Notification-worker client certificate (derived, not backed up)"
    authentik:
      app_name: "OpenUEM"
      provider: "Caddy Forward Auth Provider for OpenUEM"
      user_group: "razzfazz.ai OpenUEM Users"
    env_vars:
      - name: OPENUEM_VERSION
        default: "0.12.0"
        secret: false
        description: "Shared image pin for the console, workers, cert-manager and OCSP responder — they are version-locked, bump all four together"
      - name: OPENUEM_DOMAIN
        default: "openuem.${MAIN_DOMAIN}"
        secret: false
        description: "Public subdomain for the OpenUEM console (Authentik forward-auth gated)"
      - name: OPENUEM_DB
        default: "openuem_db"
        secret: false
        description: "PostgreSQL database name in the shared cluster"
      - name: OPENUEM_DB_USER
        default: "openuem_user"
        secret: false
        description: "Dedicated PostgreSQL role owning openuem_db"
      - name: OPENUEM_DB_PASSWORD
        secret: true
        description: "Password for openuem_user; generated at install, URL-safe because it lands in a postgres:// connection string"
      - name: OPENUEM_CONSOLE_JWT_KEY
        secret: true
        description: "Signs the console's registration and session JWTs; generated at install"
      - name: OPENUEM_CLIENT_SECRET
        secret: true
        description: "Authentik forward-auth client secret; generated at install"
      - name: OPENUEM_ORGNAME
        default: "razzfazz.ai"
        secret: false
        description: "PKI identity — baked into every certificate subject and the broker's DN authorization table at first start; changing it later requires wiping the PKI and re-enrolling every agent"
      - name: OPENUEM_ORGPROVINCE
        default: "Wien"
        secret: false
        description: "PKI identity (see OPENUEM_ORGNAME — immutable after first start)"
      - name: OPENUEM_ORGLOCALITY
        default: "Wien"
        secret: false
        description: "PKI identity (see OPENUEM_ORGNAME — immutable after first start)"
      - name: OPENUEM_ORGADDRESS
        default: ""
        secret: false
        description: "PKI identity; empty matches upstream's tested shape (immutable after first start)"
      - name: OPENUEM_ORGCOUNTRY
        default: "AT"
        secret: false
        description: "PKI identity, 2-letter country code (immutable after first start)"
      - name: OPENUEM_NATS_HOST
        default: "openuem-nats.${MAIN_DOMAIN}"
        secret: false
        description: "Broker hostname the endpoint agents dial; also a SAN on the broker certificate and a docker network alias"
      - name: OPENUEM_NATS_PORT
        default: "4433"
        secret: false
        description: "Broker port; host and container side are identical because the port is part of the agents' configured broker address"
      - name: OPENUEM_NATS_HOST_BIND
        default: "127.0.0.1"
        secret: false
        description: "WARNING — the module's LAN-facing knob. Loopback by default; pin a SPECIFIC LAN IP (never 0.0.0.0) to serve agents on other machines. The port itself is mTLS-authenticated by the broker against OpenUEM's own CA"
      - name: OPENUEM_OCSP_HOST
        default: "openuem-ocsp.${MAIN_DOMAIN}"
        secret: false
        description: "Revocation-responder hostname embedded in every certificate this module issues; also a docker network alias"
      - name: OPENUEM_OCSP_PORT
        default: "8202"
        secret: false
        description: "Revocation-responder port; part of a URL baked into certificates, so host and container side are identical"
      - name: OPENUEM_OCSP_HOST_BIND
        default: "127.0.0.1"
        secret: false
        description: "WARNING — loopback by default. OCSP is unauthenticated by design (RFC 6960), a read-only revocation oracle; open only together with the NATS port and only to a specific LAN IP, never 0.0.0.0"
      - name: OPENUEM_RESET_OPENUEM_USER
        default: ""
        secret: false
        description: "Break-glass: set to 'true' for one start to regenerate the built-in openuem console account's password (printed to the container log), then clear it"
      - name: OPENUEM_SMTP_HOST
        default: "smtp-relay"
        secret: false
        description: "Mail server post-install seeds into OpenUEM's own settings row (OpenUEM keeps SMTP in openuem_db, not in the environment). Defaults to the stack relay every other module uses; empty = do not seed, the operator enters their own in the console"
      - name: OPENUEM_SMTP_PORT
        default: "587"
        secret: false
        description: "Port of that mail server; 587 is the only port the stack relay opens"
    long_description: |
      OpenUEM is an open-source Unified Endpoint Management / RMM platform
      written in Go. Agents installed on the fleet's Windows, Linux and macOS
      machines report hardware and software inventory, receive software
      deployments, and can be assisted remotely; the server side runs here as
      seven containers — a web console, three workers, a NATS JetStream broker,
      an OCSP responder and a one-shot PKI bootstrap.

      Security model: the module runs its own certificate authority. Agents
      authenticate to the broker with mutual TLS against that CA, with per-
      identity subject ACLs and OCSP revocation checks, so the one LAN-reachable
      port has no anonymous path onto it. The console is additionally gated by
      Authentik forward-auth.

      Note: the console contacts https://releases.openuem.eu every six hours to
      check for and download new agent installers. That is the module's only
      outbound connection and it cannot be switched off upstream; everything
      else works offline. On a fully offline box it logs
      "[ERROR]: could not get latest agent releases" and retries every two
      minutes — expected, documented behaviour, not a fault.

      Use cases: hardware/software inventory across the fleet, patch and package
      deployment, remote assistance, and endpoint compliance evidence.

