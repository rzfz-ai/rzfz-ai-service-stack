  docling:
    name: "Docling"
    category: "Documents"
    maturity: production
    origin: US
    license: MIT
    github: "https://github.com/docling-project/docling"
    description: "Document conversion API with Gradio UI — supports PDF, DOCX, images via VLM"
    long_description: |
      Docling converts PDF, DOCX, PPTX, images, and HTML into structured
      Markdown or JSON with advanced layout analysis that preserves tables,
      headings, and reading order. It exposes both a REST API and a Gradio web
      UI for interactive use. Optionally, the GPUStack granite-docling VLM model
      can be deployed for vision-language understanding of complex document
      layouts.

      Use cases: PDF-to-Markdown conversion for RAG ingestion, structured
      extraction from scanned documents, batch document processing pipelines.
    has_ui: true
    # #1962: does this module show ITS OWN login mask after the Authentik SSO?
    own_login:
      state: unexpected
      reason: "0 password fields after SSO on 0.91, 2026-09-11 (lands on /) — a login mask here is a defect (#1962)."
    app_icon: "razzfazz-ai_docling_icon.png"
    containers:
      - name: docling
        image: "ghcr.io/docling-project/docling-serve-cpu:latest"
        check_updates: true
      # #538: the RQ worker never started on a portal-enabled docling, so
      # conversions queued on valkey and nothing drained them. check_updates
      # is false because it shares the upstream repo tracked above.
      # deploy.replicas service: no container_name, so Docker names the
      # containers <project>-docling-rq-worker-N. `replicated: true` tells
      # get_container_status to resolve it by the compose-service label instead
      # of an exact name that never exists (#538 follow-up).
      - name: docling-rq-worker
        image: "ghcr.io/docling-project/docling-serve-cpu:v1.27.0"
        check_updates: false
        replicated: true
    urls:
      - subdomain: "docling"
        label: "Docling Serve UI"
    databases: []
    ram_estimate_mb: 400
    dependencies:
      required: ["core"]
      optional: ["llm-manager"]
    mutual_exclusion: []
    enable_impact: "Starts Docling serve. Downloads models on first use."
    disable_impact: "Document conversion API unavailable."
    stack_impact: none
    risk_on_toggle: safe

