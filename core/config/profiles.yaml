    long_description: |
      Gotenberg is a Docker-based API for converting HTML, Markdown, Office
      documents (DOCX, XLSX, PPTX), and more to PDF. It uses Chromium and
      LibreOffice under the hood. In this stack it serves as a backend for
      Paperless-ngx document conversion and can be used by Dify workflows
      for document processing.

      Use cases: PDF generation from templates, Office-to-PDF conversion
      for document archival, HTML rendering for reports.

  # ==========================================================================
  # STABLE PROFILES
  # ==========================================================================
  gitea:
    name: "Git (Gitea)"
    category: "Git"
    maturity: production
    origin: CN
    license: MIT
    github: "https://github.com/go-gitea/gitea"
    description: "Self-hosted Git service with web UI, issue tracking, and CI/CD"
    has_ui: true
    app_icon: "razzfazz-ai_git_icon.png"
    containers:
      - name: gitea
        image: "gitea/gitea:latest"
        check_updates: true
    urls:
      - subdomain: git
        label: "Gitea"
    databases:
      - gitea_db
    ram_estimate_mb: 300
    dependencies:
      required: ["core"]
    mutual_exclusion: []
    enable_impact: "Starts Gitea, creates database. SSH on port 2222."
    disable_impact: "Git hosting and web UI unavailable."
    stack_impact: none
    risk_on_toggle: caution
    compose_file: "gitea/compose.yml"
    compose_depends_on: ["postgres", "valkey"]
    networking:
      caddy_routes:
        - subdomain: git
          target: "gitea:3000"
      internal_connections:
        - from: gitea
          to: "postgres:5432"
          purpose: "Application database (gitea_db)"
        - from: gitea
          to: "valkey:6379"
          purpose: "Session, cache, and task queue (Redis DB 2/3/4)"
        - from: gitea
          to: "smtp-relay:587"
          purpose: "Email notifications via internal SMTP relay"
    storage:
      volumes:
        - name: gitea-data
          purpose: "Git repositories, LFS objects, avatars, configuration"
    authentik:
      app_name: "Git Repository"
      provider: "Caddy Forward Auth Provider for Gitea"
      user_group: "razzfazz.ai Git Users"
    env_vars:
      - name: GITEA_DOMAIN
        default: "git.${MAIN_DOMAIN}"
        secret: false
        description: "Public subdomain for Gitea web UI and Git URLs"
      - name: GITEA_SSH_PORT
        default: "2222"
        secret: false
        description: "External SSH port for Git clone/push operations"
      - name: GITEA_SECRET_KEY
        secret: true
        description: "Secret key for Gitea session encryption"
      - name: GITEA_ADMIN_PASSWORD
        default: "Run4Quality!"
        secret: true
        description: "Initial admin account password"
    long_description: |
      Gitea is a lightweight, self-hosted Git service with a web interface for
      repository management, issue tracking, pull requests, and CI/CD via
      Gitea Actions. It uses the shared PostgreSQL database and Valkey for
      caching and session storage. SSH access is available on port 2222 for
      Git clone/push operations.

      Use cases: private code repositories, team collaboration, code review,
      CI/CD pipelines, integration with OpenHands and coding-tools agents.

  # ==========================================================================
  # EXPERIMENTAL PROFILES
  # ==========================================================================
  lightrag:
    name: "LightRAG"
    category: "Knowledge"
    maturity: experimental
    origin: CN
    license: MIT
    github: "https://github.com/HKUDS/LightRAG"
    description: "Graph-based RAG knowledge base for structured document retrieval"
    long_description: |
      LightRAG implements dual-level retrieval by combining entity-level and
      relationship-level knowledge graphs for more accurate document retrieval
      than flat vector search alone. It integrates with GPUStack for embedding
      generation and LLM-powered graph construction. Documents are decomposed
      into entities and relationships, enabling structured queries that traverse
      the knowledge graph.

      Use cases: knowledge base Q&A over large document collections, structured
      retrieval for AI agents, research literature exploration.
    has_ui: true
    app_icon: "razzfazz-ai_rag_icon.png"
    containers:
      - name: lightrag
        image: "ghcr.io/hkuds/lightrag:latest"
        check_updates: true
    urls:
      - subdomain: rag
        label: "LightRAG"
    databases: []
    ram_estimate_mb: 400
    dependencies:
      required: ["core"]
      recommended: ["llm"]
    mutual_exclusion: []
    enable_impact: "Starts LightRAG. Requires LLM for embeddings."
    disable_impact: "Knowledge base unavailable."
    stack_impact: none
    risk_on_toggle: safe

  cognee:
    name: "Cognee (GraphRAG)"
    category: "Knowledge"
    maturity: experimental
    origin: US
    license: Apache-2.0
    github: "https://github.com/topoteretes/cognee"
    description: "GraphRAG knowledge engine with AI memory — builds structured knowledge graphs"
    long_description: |
      Cognee builds structured knowledge graphs from unstructured data using
      FalkorDB as its graph database backend. It performs entity extraction,
      relationship mapping, and contextual reasoning to create a persistent
      memory layer for AI agents. The knowledge graph enables multi-hop queries
      that connect information across documents and conversations.

      Use cases: AI agent memory and context retention, knowledge graph
      construction from documents, contextual reasoning over company data.
    has_ui: true
    app_icon: "razzfazz-ai_cognee_icon.png"
    containers:
      # rc2 (Cognee 1.0.1) dropped the FalkorDB sidecar and switched to an
      # embedded Kuzu graph — do not re-add a falkordb entry here or the
      # "enable profile" apply-dialog will call `docker compose up
      # cognee falkordb` and crash with "no such service: falkordb".
      - name: cognee
        image: "razzfazz-cognee:latest"
        check_updates: false
    urls:
      - subdomain: cognee
        label: "Cognee"
    databases: []
    ram_estimate_mb: 500
    dependencies:
      required: ["core"]
      recommended: ["llm"]
    mutual_exclusion: []
    enable_impact: "Starts Cognee + FalkorDB graph database."
    disable_impact: "GraphRAG knowledge engine unavailable."
    stack_impact: none
    risk_on_toggle: safe

  tika:
    name: "Apache Tika"
    category: "Documents"
    maturity: experimental
    origin: US
    license: Apache-2.0
    github: "https://github.com/apache/tika"
    description: "Document text and metadata extraction REST API"
    long_description: |
      Apache Tika detects and extracts text, metadata, and language from over
      1000 file formats (PDF, Office, email, images, archives, and more) via a
      simple REST API. In this stack it serves as a backend for Paperless-ngx,
      providing advanced text extraction beyond what the built-in OCR engine
      handles. The full image includes all parser dependencies.

      Use cases: document text extraction for Paperless-ngx, metadata harvesting
      from heterogeneous file collections, language detection.
    has_ui: false
    containers:
      - name: tika
        image: "apache/tika:latest-full"
        check_updates: true
    urls: []
    databases: []
    ram_estimate_mb: 300
    dependencies:
      required: ["core"]
    mutual_exclusion: []
    enable_impact: "Starts Tika. Used by Paperless-ngx for text extraction."
    disable_impact: "Paperless-ngx loses advanced text extraction."
    stack_impact: none
    risk_on_toggle: safe

  docling:
    name: "Docling"
    category: "Documents"
    maturity: experimental
    origin: US
    license: MIT
    github: "https://github.com/docling-project/docling"
    description: "Document conversion API with Gradio UI — supports PDF, DOCX, images via VLM"
    long_description: |
      Docling converts PDF, DOCX, PPTX, images, and HTML into structured
      Markdown or JSON with advanced layout analysis that preserves tables,
      headings, and reading order. It exposes both a REST API and a Gradio web
      UI for interactive use. Optionally, the GPUStack granite-docling VLM model
      can be deployed for vision-language understanding of complex document
      layouts.

      Use cases: PDF-to-Markdown conversion for RAG ingestion, structured
      extraction from scanned documents, batch document processing pipelines.
    has_ui: true
    app_icon: "razzfazz-ai_docling_icon.png"
    containers:
      - name: docling
        image: "ghcr.io/docling-project/docling-serve-cpu:latest"
        check_updates: true
    urls: []
    databases: []
    ram_estimate_mb: 400
    dependencies:
      required: ["core"]
      optional: ["llm"]
    mutual_exclusion: []
    enable_impact: "Starts Docling serve. Downloads models on first use."
    disable_impact: "Document conversion API unavailable."
    stack_impact: none
    risk_on_toggle: safe

  presidio:
    name: "Presidio (PII Detection)"
    category: "Documents"
    maturity: experimental
    origin: US
    license: MIT
    github: "https://github.com/microsoft/presidio"
    description: "PII detection (Analyzer), anonymization, and image redaction REST APIs"
    long_description: |
      Microsoft Presidio provides three REST APIs: the Analyzer detects 30+
      PII entity types (names, emails, credit cards, SSNs, etc.) in text, the
      Anonymizer replaces or masks detected entities, and the Image Redactor
      blacks out PII regions in images. All processing runs locally with no
      data leaving the server.

      Use cases: anonymizing documents before sharing, PII scanning in AI
      pipelines, GDPR compliance checks, redacting sensitive data in images.
    has_ui: false
    containers:
      - name: presidio-analyzer
        image: "mcr.microsoft.com/presidio-analyzer:latest"
        check_updates: true
      - name: presidio-anonymizer
        image: "mcr.microsoft.com/presidio-anonymizer:latest"
        check_updates: true
      - name: presidio-image-redactor
        image: "mcr.microsoft.com/presidio-image-redactor:latest"
        check_updates: true
    urls: []
    databases: []
    ram_estimate_mb: 400
    dependencies:
      required: ["core"]
    mutual_exclusion: []
    enable_impact: "Starts 3 Presidio containers for PII detection."
    disable_impact: "PII detection and redaction APIs unavailable."
    stack_impact: none
    risk_on_toggle: safe

  stirling-pdf:
    name: "Stirling-PDF"
    category: "Documents"
    maturity: experimental
    origin: GB
    license: MIT
    github: "https://github.com/Stirling-Tools/Stirling-PDF"
    description: "Full-featured PDF manipulation web UI with 50+ operations"
    long_description: |
      Stirling-PDF provides a self-hosted web UI for over 50 PDF operations
      including merge, split, rotate, OCR, compress, convert (images, Office),
      add watermarks, fill forms, sign, and redact. All processing happens
      server-side with no data leaving the instance. The interface supports
      multi-file batch operations and dark mode.

      Use cases: merging invoices, splitting large PDFs, OCR-ing scanned
      documents, compressing files for email, watermarking confidential docs.
    has_ui: true
    app_icon: "razzfazz-ai_pdf_icon.png"
    containers:
      - name: stirling-pdf
        image: "stirlingtools/stirling-pdf:latest"
        check_updates: true
