  agents:
    name: "MCP & Agent Manager"
    category: "Agents"
    maturity: experimental
    origin: AT
    license: Proprietary
    github: null
    # #36/#61: renamed from "Personal Agent Manager". This is the single
    # user-facing combined app — per-user agents AND per-user MCP integrations
    # surface from ONE dashboard (agents.<domain>/dashboard), ONE Authentik
    # app ("MCP & Agent Manager", slug my-agents), ONE group
    # ("razzfazz.ai AI Agents Users"), ONE start-portal tile. Enabling this is
    # the agent half; enable the companion `mcp` profile for the MCP-integration
    # half (they are presented as one combined surface — see the `mcp` profile).
    description: "Per-user agents (Hermes, Moltis, OpenHands, Coding Tools) + personal MCP integrations — one combined dashboard"
    long_description: |
      The Personal Agent Manager is the orchestrator for per-user agent instances.
      When enabled, authenticated users can launch their own isolated agent
      containers (Hermes, Moltis, OpenHands, Coding Tools) with quota-based
      resource governance. Each instance gets its own subdomain under
      agents.<domain>, dynamic Caddy routing, idle detection with automatic
      shutdown, and stale instance cleanup. Administrators configure available
      agent types, global limits, and quota tiers via the Config UI.

      Use cases: multi-user AI agent platform, per-user isolated coding
      environments, personal assistant provisioning with resource governance.
    has_ui: true
    # #1962: does this module show ITS OWN login mask after the Authentik SSO?
    own_login:
      state: unexpected
      reason: "0 password fields after SSO on 0.91, 2026-09-11 (lands on /) — forward-auth only, a login mask here is a defect (#1962)."
    app_icon: null
    containers:
      - name: agent-manager
        image: "razzfazz-agent-manager:latest"
        check_updates: false
      # #538: the seven one-shot image builders. They exit after building, and
      # get_profile_health() already ignores exited one-shots — but listing them
      # keeps each custom image REFERENCED, which is what stops the nightly
      # `docker image prune -a` (#539) from deleting images an offline box
      # cannot rebuild. Without them a provisioned agent could never start.
      - name: hermes-agent-image-builder
        image: "razzfazz-stack-hermes-agent:${HERMES_AGENT_VERSION:-v2026.7.1}"
        check_updates: false
      - name: moltis-image-builder
        image: "razzfazz-stack-moltis:${MOLTIS_VERSION:-20260719.01}"
        check_updates: false
      - name: paperclip-image-builder
        image: "razzfazz-stack-paperclip:latest"
        check_updates: false
      - name: coding-tools-image-builder
        image: "razzfazz-coding-tools:latest"
        check_updates: false
      - name: coding-agent-codex-image-builder
        image: "razzfazz-coding-agent-codex:latest"
        check_updates: false
      - name: coding-agent-opencode-image-builder
        image: "razzfazz-coding-agent-opencode:latest"
        check_updates: false
      - name: coding-agent-user-defined-image-builder
        image: "razzfazz-coding-agent-user-defined:latest"
        check_updates: false
    urls:
      - subdomain: agents
        label: "Agent Manager"
    databases:
      - agent_manager_db
    ram_estimate_mb: 512
    ram_dynamic: true
    ram_notes: |
      Base overhead is ~200 MB for the manager itself. Each per-user agent
      instance adds 256–2048 MB depending on agent type (lightweight vs heavy).
      Total memory scales with active instance count.
    dependencies:
      required: ["core"]
      recommended: ["llm-manager"]
      # `openhands` is the only remaining compose profile of these — hermes,
      # moltis, and coding-tools were removed in M020 S07 and are now
      # provisioned per-user via agent-manager itself (see catalog.py).
      optional: ["openhands"]
    mutual_exclusion: []
    enable_impact: "Builds agent-manager image (~200 MB), creates database, starts orchestrator. Docker socket access required."
    disable_impact: "All per-user agent instances are stopped. Instance data preserved in volumes."
    stack_impact: none
    risk_on_toggle: caution
    compose_file: "modules/agents/compose.yml"
    compose_depends_on: ["postgres"]
    networking:
      caddy_routes:
        - subdomain: agents
          target: "agent-manager:5000"
      internal_connections:
        - from: agent-manager
          to: "postgres:5432"
          purpose: "Instance registry and quota database (agent_manager_db)"
        - from: agent-manager
          to: "caddy:2019"
          purpose: "Dynamic route registration for per-user agent subdomains"
        - from: agent-manager
          to: "/var/run/docker.sock"
          purpose: "Container lifecycle management for per-user instances"
    storage:
      volumes: []
    authentik:
      # #36/#61: the single combined user-facing app.
      app_name: "MCP & Agent Manager"
      provider: "Caddy Forward Auth Provider for Agent Manager"
      user_group: "razzfazz.ai AI Agents Users"
    env_vars:
      - name: AGENT_MANAGER_PORT
        default: "5110"
        secret: false
        description: "Host port for Agent Manager (mapped to internal 5000)"
      - name: AGENT_MAX_INSTANCES
        default: "20"
        secret: false
        description: "Maximum concurrent agent instances across all users"
      - name: AGENT_IDLE_TIMEOUT_LIGHTWEIGHT
        default: "1800"
        secret: false
        description: "Idle timeout in seconds for lightweight agents (Hermes, Moltis)"
      - name: AGENT_IDLE_TIMEOUT_HEAVY
        default: "7200"
        secret: false
        description: "Idle timeout in seconds for heavy agents (OpenHands)"
      - name: AGENT_CLEANUP_AFTER_DAYS
        default: "30"
        secret: false
        description: "Delete stale instance records after this many days"
      - name: AGENTS_CLIENT_SECRET
        secret: true
        description: "Authentik forward-auth client secret for Agent Manager"

  mcp:
    name: "MCP Integrations (part of MCP & Agent Manager)"
    category: "Agents"
    maturity: experimental
    origin: AT
    license: Proprietary
    github: null
    # #36/#61: this is the MCP half of the combined "MCP & Agent Manager".
    # It is NOT a separate user-facing app — enabling it adds per-user MCP
    # integrations to the SAME combined dashboard (agents.<domain>/dashboard),
    # gated by the SAME group ("razzfazz.ai AI Agents Users"). There is no
    # separate tile: the MCP dashboard is reached via the "MCP Integrations"
    # link on the combined dashboard. Enable together with `agents`.
    description: "MCP half of MCP & Agent Manager — connect your own Moco/SEQITracker, Pipedrive, GitHub, Google tools to your agents (no separate app/tile)"
    long_description: |
      The Personal MCP Manager lets each authenticated user connect their own
      external tools (Moco/SEQITracker, Pipedrive, GitHub, Google, …) to their
      AI agents. The user supplies their own credentials (personal access token
      or OAuth); the manager stores them ENCRYPTED AT REST (AES-256-GCM) and
      provisions a per-user MCP-proxy sidecar that holds only THAT user's
      credentials and exposes an SSO-gated HTTP MCP endpoint, wired into the
      user's own Hermes / Moltis / OpenCode instances.

      Use cases: per-user CRM/time-tracking access for agents, personal OAuth
      integrations without sharing credentials, multi-user tool federation.

      SECURITY: this module stores every user's external credentials. Access is
      strictly only-own (identity from Authentik). Talks to docker via
      docker-socket-proxy with the same constrained grants as the Agent Manager.
    has_ui: true
    # #1962: does this module show ITS OWN login mask after the Authentik SSO?
    own_login:
      state: unmeasured
      reason: "not active in the 2026-09-11 rotation on 0.91 — the probe counts password fields and reports, it does not grade, until a rotation with this module on measures it (#1962)."
    app_icon: null
    containers:
      - name: mcp-manager
        image: "razzfazz-mcp-manager:latest"
        check_updates: false
      # #538: one-shot image builder. Listing it keeps its image referenced,
      # which is what stops the nightly `docker image prune -a` (#539) from
      # deleting a custom-built image an offline box cannot rebuild.
      - name: mcp-test-echo-image-builder
        image: "razzfazz-mcp-test-echo:latest"
        check_updates: false
    urls:
      - subdomain: mcp
        label: "MCP Manager"
    databases:
      - mcp_manager_db
    ram_estimate_mb: 512
    ram_dynamic: true
    ram_notes: |
      Base overhead is ~150 MB for the manager. Each per-user MCP proxy adds
      ~64–256 MB. Total memory scales with active proxy count.
    dependencies:
      # #36/#61: `agents` is now REQUIRED — the MCP dashboard's only user-facing
      # entry point is the "MCP Integrations" link on the combined dashboard that
      # ships with the `agents` module. Without `agents` there is no tile/app to
      # reach it (the standalone MCP tile was retired).
      required: ["core", "agents"]
      recommended: []
      optional: []
    mutual_exclusion: []
    enable_impact: "Builds mcp-manager + test-echo images, creates database, starts orchestrator. Adds the MCP Integrations section to the combined MCP & Agent Manager dashboard. Docker-socket-proxy access required."
    disable_impact: "All per-user MCP proxies are stopped. Encrypted credentials preserved in the database."
    stack_impact: none
    risk_on_toggle: caution
    compose_file: "modules/mcp-manager/compose.yml"
    compose_depends_on: ["postgres"]
    networking:
      caddy_routes:
        - subdomain: mcp
          target: "mcp-manager:5000"
      internal_connections:
        - from: mcp-manager
          to: "postgres:5432"
          purpose: "Instance registry + encrypted credential vault (mcp_manager_db)"
        - from: mcp-manager
          to: "caddy:2019"
          purpose: "Dynamic route registration for per-user MCP-proxy subdomains"
        - from: mcp-manager
          to: "docker-socket-proxy:2375"
          purpose: "Container lifecycle for per-user MCP proxies (constrained grants)"
    storage:
      volumes: []
    authentik:
      # #36/#61: backend-only forward-auth (slug `mcp`, hidden/tile-less app).
      # The user-facing app is "MCP & Agent Manager" (slug my-agents).
      app_name: "MCP Manager (backend)"
      provider: "Caddy Forward Auth Provider for MCP"
      user_group: "razzfazz.ai AI Agents Users"
    env_vars:
      - name: MCP_MANAGER_PORT
        default: "5120"
        secret: false
        description: "Host port for MCP Manager (mapped to internal 5000)"
      - name: MCP_MAX_INSTANCES
        default: "50"
        secret: false
        description: "Maximum concurrent per-user MCP proxies box-wide"
      - name: MCP_MANAGER_SECRET_KEY
        secret: true
        description: "AES-256-GCM master key (base64 32 bytes) for the credential vault"
      - name: MCP_MANAGER_DB_PASSWORD
        secret: true
        description: "PostgreSQL password for the mcp_manager_db service user"
      - name: MCP_CLIENT_SECRET
        secret: true
        description: "Authentik forward-auth client secret for MCP Manager"
      - name: OAUTH_GITHUB_CLIENT_SECRET
        secret: true
        description: "GitHub OAuth client secret (server-side; empty until operator registers an app)"
      - name: OAUTH_GOOGLE_CLIENT_SECRET
        secret: true
        description: "Google OAuth client secret (server-side; empty until operator registers an app)"

