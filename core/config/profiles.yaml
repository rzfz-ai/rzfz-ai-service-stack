    category: "Documents"
    maturity: experimental
    origin: US
    license: Apache-2.0
    github: "https://github.com/apache/tika"
    description: "Document text and metadata extraction REST API"
    long_description: |
      Apache Tika detects and extracts text, metadata, and language from over
