version: 1
integrations:
- id: github
  display_name: GitHub
  description: GitHub repos, issues, PRs via your own OAuth authorization.
  cred_model: oauth:github
  tenancy: per-user
  unavailable_reason: no proxy image for this integration ships with this release; it returns once one
    is built in the repository
  image: razzfazz-mcp-proxy:latest
  transport: streamable-http
  container_port: 8080
  mcp_path: /mcp
  consumers:
  - hermes
  - opencode
  scopes:
  - repo
  - read:user
  env_map:
    MCP_TARGET_KIND: github
    GITHUB_TOKEN: '{{oauth_access_token}}'
- id: google
  display_name: Google Workspace
  description: Your own Google Drive, Calendar and Gmail — read and write, as you.
  cred_model: oauth:google
  tenancy: per-user
  image: razzfazz-mcp-proxy:google-013c166da92a
  transport: streamable-http
  container_port: 8080
  mcp_path: /mcp
  consumers:
  - hermes
  - moltis
  scopes:
  - https://www.googleapis.com/auth/calendar.readonly
  - https://www.googleapis.com/auth/calendar.events
  - https://www.googleapis.com/auth/drive
  - https://www.googleapis.com/auth/gmail.modify
  env_map:
    MCP_TARGET_KIND: google
    GOOGLE_ACCESS_TOKEN: '{{oauth_access_token}}'
    MCP_AUDIT_PRINCIPAL: '{{user_id}}'
    GOOGLE_MCP_MODE: '{{policy:GOOGLE_MCP_MODE}}'
    GOOGLE_MCP_ALLOW_SEND: '{{policy:GOOGLE_MCP_ALLOW_SEND}}'
    GOOGLE_MCP_SEND_DELETE_AGENTS: '{{policy:GOOGLE_MCP_SEND_DELETE_AGENTS}}'
    MCP_DOMAIN: '{{policy:MCP_DOMAIN}}'
- id: gitea
  display_name: Gitea (knowledge repos)
  description: Read Markdown in your Gitea repos and propose changes as branches and pull requests — as
    you.
  cred_model: oauth:gitea
  tenancy: per-user
  runtime: gateway
  engine_profile: gitea
  consumers:
  - all
  scopes:
  - read:repository
  - write:repository
  - read:user
  - read:organization
- id: atlassian-mcp
  display_name: Jira & Confluence (Atlassian official)
  description: Work on Jira tickets and read and search Confluence through Atlassian's own MCP server
    — as you. Just connect; no app to register.
  cred_model: oauth:atlassian-mcp
  tenancy: per-user
  runtime: gateway
  consumers:
  - all
  connect_label: Connect Jira & Confluence
  remote_mcp:
    url: https://mcp.atlassian.com/v2/mcp
    allowed_hosts:
    - mcp.atlassian.com
    - auth.atlassian.com
  scopes:
  - offline_access
  - read:me
  - read:account
  - read:jira:agent-interface
  - write:jira:agent-interface
  - search:jira:agent-interface
  - read:confluence:agent-interface
  - write:confluence:agent-interface
  - search:confluence:agent-interface
  - search:rovo:agent-interface
- id: atlassian
  display_name: Jira & Confluence (self-hosted, advanced)
  description: 'Advanced: the self-hosted mcp-atlassian server with an app your administrator registered
    at Atlassian. Also serves Dify service accounts.'
  cred_model: oauth:atlassian
  tenancy: per-user
  runtime: gateway
  engine_profile: mcp-atlassian
  consumers:
  - all
  scopes:
  - read:jira-work
  - write:jira-work
  - read:jira-user
  - read:confluence-content.all
  - write:confluence-content
  - search:confluence
  - offline_access
- id: m365
  display_name: Microsoft 365
  description: Your own mail, calendar, OneDrive and SharePoint files — read, write and send, as you.
  cred_model: oauth:m365
  tenancy: per-user
  runtime: gateway
  engine_profile: mcp-m365
  consumers:
  - all
  scopes:
  - offline_access
  - User.Read
  - Mail.Read
  - Calendars.Read
  - Files.Read.All
  - Sites.Read.All
- id: cognee-personal
  display_name: Cognee — Personal Memory (private)
  description: 'Your OWN private GraphRAG long-term memory — remember / recall / cognify. Truly isolated
    per user: only you can read or write it. Requires the Cognee backend to run with access control enabled
    (enforced — provisioning is refused otherwise, never faked).'
  cred_model: none
  tenancy: per-user
  isolation_backend: cognee
  requires_backend_access_control: true
  cognee_autoprovision: personal
  image: razzfazz-mcp-cognee-authshim:latest
  transport: streamable-http
  container_port: 8000
  mcp_path: /mcp
  consumers:
  - hermes
  - moltis
  - opencode
  - codex
  - claude
  mem_limit: 512m
  rewrite_upstream_host: true
  reach_backend: cognee
  env_map:
    TRANSPORT_MODE: http
    API_URL: http://cognee:8000
    API_TOKEN: '{{cognee_user_api_key}}'
    LLM_API_KEY: '{{cognee_user_api_key}}'
    COGNEE_DEFAULT_DATASET: '{{user_slug}}'
    MCP_ALLOWED_HOSTS: localhost:8001
- id: cognee-company
  display_name: Cognee — Company Brain (shared)
  description: Shared, curated organisation memory. READABLE by entitled users; WRITE is reserved for
    admins/power users (curated). Query the company knowledge base from your agents alongside your private
    memory.
  cred_model: none
  tenancy: shared
  multi_tenancy_attested: true
  isolation_backend: cognee
  cognee_autoprovision: company
  min_write_tier: power
  image: razzfazz-mcp-cognee-authshim:latest
  transport: streamable-http
  container_port: 8000
  mcp_path: /mcp
  consumers:
  - hermes
  - moltis
  - opencode
  - codex
  - claude
  mem_limit: 512m
  rewrite_upstream_host: true
  reach_backend: cognee
  env_map:
    TRANSPORT_MODE: http
    API_URL: http://cognee:8000
    API_TOKEN: '{{cognee_user_api_key}}'
    LLM_API_KEY: '{{cognee_user_api_key}}'
    COGNEE_DEFAULT_DATASET: '{{cognee_company_dataset}}'
    RZFZ_COGNEE_DATASET_SCOPE: '{{cognee_company_dataset}}'
    MCP_ALLOWED_HOSTS: localhost:8001
