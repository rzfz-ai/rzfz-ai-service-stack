# ==============================================================================
# SPEECH MODULE (STTS)
# ==============================================================================
# Profile: stts
# Speech-to-Text AND Text-to-Speech via Speaches (Whisper STT + Kokoro/Piper
# TTS). #68: the separate edge-tts (GPL-3.0) container was removed — Speaches
# covers both STT and TTS (the stack's default TTS already points at
# http://speaches:8000/v1, see cli/post-install.sh).
# ==============================================================================
services:
  speaches:
    image: ghcr.io/speaches-ai/speaches:${SPEACHES_VERSION:-0.8.3-cpu}
    profiles: ["stts"]
    container_name: speaches
    restart: unless-stopped
    # #36 security-review — join egress-controlled coding-agents net for sandboxed coding agents
    # #2087 — and the nets Hermes (agent-assistants) and Moltis (agent-network)
    # are created on, so their voice reaches Speaches and nothing else.
    # #2661: Moltis is now created on agent-assistants too; agent-network no
    # longer carries a voice agent (only paperclip). Kept for one
    # cycle so not-yet-recreated Moltis containers keep voice; drop it after.
    networks:
      - default
      - coding-agents
      - agent-assistants
      - agent-network
    ports:
      - "127.0.0.1:${SPEACHES_PORT:-5003}:8000"
    volumes:
      - speaches-data:/home/ubuntu/.cache/huggingface/hub

networks:
  # #36 security-review — shared egress-controlled net (declared in core/compose.yml).
  coding-agents:
    name: coding-agents
    driver: bridge
  agent-assistants:
    name: agent-assistants
    driver: bridge
  agent-network:
    name: agent-network
    driver: bridge
