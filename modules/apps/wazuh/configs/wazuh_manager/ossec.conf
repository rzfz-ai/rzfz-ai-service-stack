<!--
  modules/apps/wazuh/configs/wazuh_manager/ossec.conf
  Copied by wazuh-securityconfig-init (Task 5) into the wazuh-manager-config
  volume at etc/ossec.conf, which the manager's entrypoint installs into
  /var/ossec/etc/ossec.conf. Derived from wazuh/wazuh-docker v4.14.7
  single-node/config/wazuh_cluster/wazuh_manager.conf, trimmed to what this
  stack actually uses. Task 9 adds <auth>, <allowed-ips> (in <remote> only —
  see the <auth> block) and the syslog
  listener. Reference:
  https://documentation.wazuh.com/current/user-manual/reference/ossec-conf/
-->
<ossec_config>
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <logall_json>no</logall_json>
    <email_notification>no</email_notification>
    <agents_disconnection_time>10m</agents_disconnection_time>
    <agents_disconnection_alert_time>0</agents_disconnection_alert_time>
  </global>

  <alerts>
    <log_alert_level>3</log_alert_level>
  </alerts>

  <logging>
    <log_format>plain</log_format>
  </logging>

  <!-- Agent event channel. TLS with the per-agent key issued at enrolment. -->
  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
    <queue_size>131072</queue_size>
    <!--
      WZ-4: the host bind is a reachability control, not an authenticator.
      Narrow the sources that may even open a session. Default is loopback;
      a fleet operator widens it to explicit CIDRs together with
      WAZUH_MANAGER_HOST_BIND (DECISION-4). Docker's bridge subnet is
      included so in-stack agents work with the default loopback bind.
    -->
    <allowed-ips>127.0.0.1/32</allowed-ips>
    <allowed-ips>172.16.0.0/12</allowed-ips>
  </remote>

  <!--
    Agent enrolment (authd), port 1515.

    WZ-4: authd's DEFAULT is <use_password>no</use_password>, which means any
    host that can reach 1515 can enrol itself as a trusted agent and start
    injecting events under an identity of its choosing. For a SIEM that
    defeats the log-integrity property the whole module exists to provide.

    The password is generated per box (WAZUH_AUTHD_PASSWORD, cli/init.sh) and
    written to /var/ossec/etc/authd.pass by wazuh-securityconfig-init; the
    agent side takes it as a required argument of
    scripts/install-wazuh-agent.sh.

    <force><enabled>no</enabled> is deliberate: with force enabled a
    re-enrolment silently REPLACES an existing agent's key, so a rogue host
    that guessed a name could take over a legitimate agent's identity.
  -->
  <auth>
    <disabled>no</disabled>
    <port>1515</port>
    <use_source_ip>no</use_source_ip>
    <purge>yes</purge>
    <use_password>yes</use_password>
    <!--
      #1537: NO empty <ssl_agent_ca>. authd reads the element as a PATH and an
      empty one aborts it before it ever listens:

        wazuh-authd: ERROR: Unable to read CA certificate file ""
        wazuh-authd: ERROR: SSL error. Exiting.

      and because wazuh-control aborts the startup sequence on a failing
      daemon, every other daemon stays down with it. The element belongs here
      only when enrolment is validated against an agent CA (cert-based
      enrolment); this module enrols with a password (use_password above) and
      the manager's own sslmanager.cert/key, so it is omitted entirely.
    -->
    <ssl_verify_host>no</ssl_verify_host>
    <ssl_manager_cert>/var/ossec/etc/sslmanager.cert</ssl_manager_cert>
    <ssl_manager_key>/var/ossec/etc/sslmanager.key</ssl_manager_key>
    <ssl_auto_negotiate>no</ssl_auto_negotiate>
    <force>
      <enabled>no</enabled>
    </force>
    <!--
      NO allowed-ips element here. Wazuh's auth block does not accept it:
      authd refuses the whole file with

        wazuh-authd: ERROR: (1230): Invalid element in the configuration: 'allowed-ips'.
        wazuh-authd: CRITICAL: (1202): Configuration error at 'etc/ossec.conf'.

      and because that abort happens at startup, NO ossec daemon comes up —
      analysisd, remoted, syscheckd, wazuh-db, all of them stay down, the
      manager healthcheck (wazuh-control status | grep wazuh-analysisd) never
      passes, and wazuh-dashboard (depends_on: wazuh-manager service_healthy)
      is never started. Measured on 0.91, 2026-09-05: enabling the module left
      a manager that could not start at all, and the portal's apply blocked on
      the health gate until it was killed.

      What fences enrolment instead — unchanged, and both already required:
        * WAZUH_MANAGER_HOST_BIND keeps port 1515 off the LAN unless the
          operator widens it deliberately (DECISION-4), and
        * use_password yes, with the generated authd.pass.
      The IP fence stays where wazuh honours it: the two remote blocks (agent
      events and syslog), which is where WAZUH_ALLOWED_IPS and
      WAZUH_SYSLOG_ALLOWED_IPS are rendered.
    -->
  </auth>

  <!--
    Syslog ingestion for agentless sources, port 514/TCP.

    PROTOCOL IS TCP, NOT UDP (rev-B, review HIGH 8). This listener exists for
    the #253 seam, and the otel-collector's syslog exporter
    (modules/observability/configs/otel-collector-logs-syslog.yaml:56) speaks
    `network: tcp` — hardcoded. With a UDP listener here the documented seam
    delivered exactly zero events, silently: the exporter opened a TCP
    connection nothing was listening on. Wazuh supports tcp for a syslog
    <remote> (`protocol` accepts udp or tcp), so the listener moves rather than
    the exporter. TCP is also the better of the two for this: a connection
    handshake makes blind source spoofing meaningfully harder than a single
    forged UDP datagram.

    HONEST STATEMENT (WZ-4): plain syslog is UNAUTHENTICATED whichever
    transport it runs over. There is no protocol-level authenticator to add
    here — the only controls available are the network fence below plus the
    loopback-default host bind (WAZUH_SYSLOG_HOST_BIND in
    modules/apps/wazuh/compose.yml). Anything crossing a LAN should use the
    agent path (1514/1515) instead, which is TLS with a per-agent key.

    TLS: this listener speaks PLAIN syslog, not RFC5425. The otel exporter
    defaults to `insecure: false` (TLS on), so the seam ALSO needs
    OTEL_SYSLOG_TLS_INSECURE=true. See docs/enterprise/how-to/wazuh.md for the
    complete opt-in variable set — OTEL_SYSLOG_HOST/PORT alone does nothing,
    because the syslog exporter only exists in the opt-in overlay.
  -->
  <remote>
    <connection>syslog</connection>
    <port>514</port>
    <protocol>tcp</protocol>
    <allowed-ips>127.0.0.1/32</allowed-ips>
    <allowed-ips>172.16.0.0/12</allowed-ips>
  </remote>

  <rootcheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <rootkit_files>etc/rootcheck/rootkit_files.txt</rootkit_files>
    <rootkit_trojans>etc/rootcheck/rootkit_trojans.txt</rootkit_trojans>
    <skip_nfs>yes</skip_nfs>
  </rootcheck>

  <sca>
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
    <skip_nfs>yes</skip_nfs>
  </sca>

  <wodle name="syscollector">
    <disabled>no</disabled>
    <interval>1h</interval>
    <scan_on_start>yes</scan_on_start>
    <hardware>yes</hardware>
    <os>yes</os>
    <network>yes</network>
    <packages>yes</packages>
    <ports all="no">yes</ports>
    <processes>yes</processes>
  </wodle>

  <!--
    AIR-GAP POSTURE (Global Constraints): Wazuh's vulnerability detector pulls
    a CTI feed from cti.wazuh.com. Disabled by default so the module's
    "no internet at start time" claim is ENFORCED, not asserted (WZ-19).
    Enabling it also requires adding wazuh-manager to EGRESS_ALLOWLIST — which
    Task 9b does — and, on a corporate-proxy box, the intercept CA.
  -->
  <vulnerability-detection>
    <enabled>no</enabled>
    <index-status>yes</index-status>
    <feed-update-interval>60m</feed-update-interval>
  </vulnerability-detection>

  <indexer>
    <enabled>yes</enabled>
    <hosts>
      <!--
        #1259: `wazuh.indexer`, not `wazuh-indexer`. The indexer certificate
        carries exactly one SAN and the cert tool refuses a dotless one, so the
        dotted network alias is the only name this TLS connection can verify.
        Must stay equal to nodes.indexer[0].ip in wazuh_certs_config.yml.
      -->
      <host>https://wazuh.indexer:9200</host>
    </hosts>
    <ssl>
      <certificate_authorities>
        <ca>/etc/ssl/wazuh-certs/root-ca-manager.pem</ca>
      </certificate_authorities>
      <certificate>/etc/ssl/wazuh-certs/wazuh-manager.pem</certificate>
      <key>/etc/ssl/wazuh-certs/wazuh-manager-key.pem</key>
    </ssl>
  </indexer>

  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>
    <alert_new_files>yes</alert_new_files>
    <directories>/etc,/usr/bin,/usr/sbin</directories>
    <directories>/bin,/sbin,/boot</directories>
    <ignore>/etc/mtab</ignore>
    <ignore>/etc/random-seed</ignore>
    <ignore>/etc/adjtime</ignore>
    <ignore type="sregex">.log$|.swp$</ignore>
    <skip_nfs>yes</skip_nfs>
    <skip_dev>yes</skip_dev>
    <skip_proc>yes</skip_proc>
    <skip_sys>yes</skip_sys>
    <process_priority>10</process_priority>
  </syscheck>

  <!--
    DECISION-11 / WZ-13: active-response is manager -> agent REMOTE COMMAND
    EXECUTION as root. It is off in this stack. Re-enabling it is an explicit
    operator act, and scripts/install-wazuh-agent.sh disables the agent side
    independently so both ends have to be flipped.
  -->
  <active-response>
    <disabled>yes</disabled>
  </active-response>

  <ruleset>
    <decoder_dir>ruleset/decoders</decoder_dir>
    <rule_dir>ruleset/rules</rule_dir>
    <rule_exclude>0215-policy_rules.xml</rule_exclude>
    <list>etc/lists/audit-keys</list>
    <list>etc/lists/amazon/aws-eventnames</list>
    <list>etc/lists/security-eventchannel</list>
    <decoder_dir>etc/decoders</decoder_dir>
    <rule_dir>etc/rules</rule_dir>
  </ruleset>
</ossec_config>
