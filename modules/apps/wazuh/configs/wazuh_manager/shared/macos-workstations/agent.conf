<!-- Centralised config for the Wazuh group macos-workstations (#2526, #3304).
     os="Darwin" keeps it off any non-macOS agent placed in this group by
     mistake. Diffs only under /etc; active response stays off. -->
<agent_config os="Darwin">
  <syscheck>
    <directories realtime="yes" report_changes="no">/Users/*/.ssh,/var/root/.ssh</directories>
    <directories realtime="yes" report_changes="yes">/etc/ssh,/etc/sudoers.d</directories>
  </syscheck>
  <sca>
    <enabled>yes</enabled>
  </sca>
</agent_config>
