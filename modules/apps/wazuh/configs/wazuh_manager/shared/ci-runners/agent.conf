<!-- Centralised config for the Wazuh group ci-runners (#2526, #3304): CI build
     hosts. The manager serves it to every agent in the group; it is merged over
     the agent's own ossec.conf (which scripts/install-wazuh-agent.sh manages).
     File contents (report_changes) only under /etc; active response stays off. -->
<agent_config>
  <syscheck>
    <directories realtime="yes" report_changes="no">/root/.ssh,/home/*/.ssh</directories>
    <directories realtime="yes" report_changes="yes">/etc/ssh,/etc/sudoers.d,/etc/sudoers</directories>
    <!-- CI runners: their jobs write to these paths all day, and without the
         ignores FIM floods the index. One full sweep a day. -->
    <ignore type="sregex">/_work/|/actions-runner/|/tmp/</ignore>
    <frequency>86400</frequency>
  </syscheck>
  <sca>
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
  </sca>
  <wodle name="syscollector">
    <disabled>no</disabled>
    <interval>1h</interval>
    <packages>yes</packages>
    <ports all="no">yes</ports>
  </wodle>
</agent_config>
