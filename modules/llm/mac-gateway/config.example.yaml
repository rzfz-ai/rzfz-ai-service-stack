# ==============================================================================
# Mac LLM gateway config (LiteLLM). TEMPLATE — copy to config.yaml on first
# `mac-llm` enable, then declare your Macs. The Config Portal panel (P2) edits
# config.yaml for you; in P1 you hand-edit it. This file is the canonical shape
# emitted by gen_config.build_config() — keep the two in sync.
#
# Each Mac × model is ONE model_list entry. Giving the SAME model_name to the
# same model on two Macs forms ONE load-balance group (LiteLLM routes across the
# healthy members). `model:` is the Ollama tag with an `openai/` prefix so
# LiteLLM speaks Ollama's OpenAI-compatible /v1 endpoint. `api_key` is a
# throwaway — Ollama ignores it, but LiteLLM requires a non-empty value.
# ==============================================================================
model_list: []
  # - model_name: mac-qwen3-coder          # alias shown in Open WebUI
  #   litellm_params:
  #     model: openai/qwen3-coder           # the Ollama tag, openai/ prefix
  #     api_base: http://192.0.2.194:11434/v1
  #     api_key: "ollama"                   # Ollama ignores it; LiteLLM needs a value
  # - model_name: mac-qwen3-coder          # SAME alias on a 2nd Mac = LB group
  #   litellm_params:
  #     model: openai/qwen3-coder
  #     api_base: http://192.0.2.230:11434/v1
  #     api_key: "ollama"

router_settings:
  routing_strategy: least-busy

litellm_settings:
  num_retries: 2
  request_timeout: 600

general_settings:
  # Components authenticate to the gateway with this master key (a stack
  # secret). Resolved from the container env at startup — never inlined.
  master_key: os.environ/MAC_GATEWAY_MASTER_KEY
  background_health_checks: true
  health_check_interval: 60
