# ==============================================================================
# LLM MODEL REGISTRY (Zot) — profile: llm-registry  [always-on since the 2026.09 cutover, #1443]
# ------------------------------------------------------------------------------
# Content-addressed OCI registry (Zot, Apache-2.0) that stores model artifacts
# (GGUF / safetensors / mmproj) as OCI blobs. The LLM Manager (#254) records a
# model's artifacts by digest; each fleet node pulls the blobs it needs BY
# DIGEST from here into its models volume (worker-agent puller, P2-D2) — offline
# safe, deduplicated across models sharing a layer.
#
# Operator decision 2026-08-11: Zot over MinIO — OCI content-addressing dedups
# layers, single small static binary, air-gap friendly (seed the volume once,
# no WAN needed to serve). See
# .gsd/reports/2026.09-254-phase2-task-breakdown-2026-08-11.md.
#
# SECURITY: loopback-only host bind for operator/seed access; in-network nodes
# reach it as llm-registry:5000. The SSO/ingress route (registry.<domain>) is
# added with the manager ingress (Slice 6 / G1). New compose service → the
# release security review must confirm the pin/bind posture before any GA
# (pre-tag-check trips on this).
#
# WHO MAY WRITE (#3302, assessment H-03; was the NODE-6 gap of #1037).
# config.json gives anonymous clients READ only (`anonymousPolicy: ["read"]`):
# every node pulls by digest, the catalogue and the web UI need no login. Write
# and delete need the `llm-manager` htpasswd identity. Its password,
# LLM_REGISTRY_WRITE_PASSWORD (.env, generated by init/upgrade), is handed ONLY
# to the push path: llm-registry-auth below (derives the htpasswd from it at
# every registry start), llm-manager (evict / manual GC) and the master's
# llm-worker-agent (model push). No other service's environment carries it
# (tests/unit/llm-registry/test_3302_anonymous_read_only.py). Remote workers
# keep going through the hub edge (core/Caddy/Caddyfile, forward_auth ->
# /api/hub-auth), which hands Zot the same identity after a valid fleet check.
# Host-side `docker push` to the loopback port logs in first
# (scripts/lib.sh::rzfz_registry_login, password on stdin).
# Full authentication of hub and customer delivery: #2658.
# ==============================================================================
services:
  # #3302: writes /etc/zot/auth/htpasswd (the `llm-manager` writer) from
  # LLM_REGISTRY_WRITE_PASSWORD before every registry start. The stack's own
  # Caddy image does the bcrypt (`caddy hash-password`; Zot's image is
  # distroless and has no shell). No network, nothing kept but the hash.
  llm-registry-auth:
    image: razzfazz-stack-caddy
    pull_policy: never
    profiles: ["llm-registry"]
    container_name: llm-registry-auth
    restart: "no"
    labels:
      razzfazz.init: "true"
    network_mode: none
    entrypoint: ["/bin/sh", "/write-htpasswd.sh"]
    # #3337: the write credential arrives as a FILE, not in the environment:
    # compose copies an environment-sourced secret into the container at
    # /run/secrets/<name> (compose v2 injectSecrets → CopyToContainer), so it
    # is in neither `docker inspect`'s Config.Env nor its mounts, and the
    # script deletes the file once the hash is written, so the exited
    # container's layer does not keep it either.
    secrets:
      - source: llm_registry_write_password
        target: llm_registry_write_password
        mode: 0400
    volumes:
      - ./write-htpasswd.sh:/write-htpasswd.sh:ro
      - llm-registry-auth:/auth
    security_opt:
      - no-new-privileges:true

  llm-registry:
    image: ghcr.io/project-zot/zot-linux-amd64:${ZOT_VERSION:-v2.1.21}
    profiles: ["llm-registry"]
    container_name: llm-registry
    restart: unless-stopped
    networks:
      - default
    ports:
      # Loopback-only: operator seeding + smoke. In-network nodes use the
      # Docker DNS name llm-registry:5000.
      - "127.0.0.1:${LLM_REGISTRY_PORT:-8093}:5000"
    volumes:
      - ./config.json:/etc/zot/config.json:ro
      - llm-registry-data:/var/lib/registry
      # #3302: the htpasswd llm-registry-auth writes (config.json http.auth)
      - llm-registry-auth:/etc/zot/auth:ro
    depends_on:
      llm-registry-auth:
        condition: service_completed_successfully
    # #1001: 512m OOM-killed Zot mid-upload on multi-GB model blobs (page cache
    # from large-file I/O + dedupe blew past the cgroup limit; the kernel killed
    # it partway, resetting the push and leaving an EMPTY manifest — the fleet's
    # own served models (qwen3.6 34 GB, qwen3-embedding 4.4 GB) never cached,
    # only the 609 MB reranker did). A model registry mirrors many-GB weights;
    # 4g gives Zot room to receive them. Ceiling only (no big reservation) so
    # small master boxes are unaffected until they actually mirror a large model.
    mem_limit: 4g
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # #254: Zot ships as a DISTROLESS image (only the `zot` binary — no
      # /bin/sh, no wget/curl), so an in-container exec healthcheck is
      # impossible; the previous `/bin/sh -c wget …` form could never exec and
      # produced a permanent false "unhealthy". Disable the exec probe (the
      # container shows a plain "Up"). Readiness is observed out-of-band: the
      # manager's registry client hits /v2/ and the worker-agent puller surfaces
      # pull failures. Nothing depends_on this service being compose-healthy.
      disable: true

volumes:
  llm-registry-data:
  llm-registry-auth:

secrets:
  # #3337: read from the stack .env by compose itself (the project environment);
  # only llm-registry-auth mounts it.
  llm_registry_write_password:
    environment: LLM_REGISTRY_WRITE_PASSWORD
