# razzfazz-llm-manager-ui — static SPA server. Caddy fronts it at
# llm-manager.<domain>/ (behind Authentik SSO) and routes /api,/v1,/metrics,
# /docs to the manager, so this server only serves the built SPA + assets.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # long-cache fingerprinted assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    # SPA history fallback — every non-asset path serves index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
