# Where the Mac worker's OWN Ollama listens (loopback only; the master reaches
# it through the agent's outbound relay). THE one definition: the installer,
# the launchd plist it renders, ollama-switch.sh, ollama-port-migrate.sh and
# the agent (app/ollama_port.py) all read it from the running bundle.
#
# Not Ollama's default port: a Mac that becomes a worker usually runs an Ollama
# of its own already (Ollama.app, a brew service) on 11434, often with other
# clients on it. The worker's Ollama sits next to it and never touches it.
RZFZ_OLLAMA_PORT=11435
# Mac workers installed before the port moved run their Ollama on this port;
# their .env.node has no RZFZ_OLLAMA_PORT, and every reader falls back to it
# until bin/ollama-port-migrate.sh (or a re-install) moves them.
RZFZ_OLLAMA_LEGACY_PORT=11434
