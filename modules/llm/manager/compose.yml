# ==============================================================================
# LLM ORCHESTRATOR (manager) — profile: llm-manager  [always-on since the 2026.09 cutover, #1443]
# ------------------------------------------------------------------------------
# The sovereign, Kubernetes-free control plane over a heterogeneous LLM fleet
# (#254). Phase 1 (this module) ships the gateway + token-chargeback MVP:
#
#   * llm-manager        — FastAPI manager: auth · enforcement · streaming
#                               proxy · token metering · keys/cost-centers ·
#                               /metrics · LiteLLM config generation.
#   * llm-manager-router — LiteLLM as a PURE ROUTER (LB/failover only; no
#                               end-customer keys, no spend — the manager owns
#                               that). Its config.yaml is GENERATED by the
#                               manager (R1); internal-only, master-key auth.
#
# Reuses in-stack infra: PostgreSQL (llm_manager_db), Valkey (DB index 9),
# Authentik/Caddy (SSO ingress — wired later). Does NOT stand up parallel
# infra. GPUStack is untouched; this is the strategic *exit* from gpustack,
# sequenced against the 2026.09 2.2.x eval — never built blind alongside it.
#
# SECURITY: the manager binds loopback-only for direct operator/smoke access;
# the intended external entry point is Caddy + Authentik (deferred to a later
# slice). The router is internal-only (no host port, no Caddy route). New
# compose service → the release security review must confirm the pins/bind
# posture before any GA (pre-tag-check trips on this).
# ==============================================================================
services:
  llm-manager:
    build:
      context: .
      dockerfile: Dockerfile
    image: razzfazz-llm-manager:latest
    profiles: ["llm-manager"]
    container_name: llm-manager
    restart: unless-stopped
    networks:
      # #612 — the assistant fence net (agent-assistants): fenced per-user
      # agents (hermes) reach ONLY this OpenAI ingress (rzfz-sk auth,
      # metering per owner). Deliberately just the manager — NOT the router,
      # NOT registry/DBs; the router stays reachable solely via the manager
      # with the internal key.
      # #1424 — the CODING-agent net. Provisioned opencode/gsd-pi instances sit
      # on `coding-agents` only, and provisioner.py points them at
      # http://llm-manager:8080/v1 — correct address, no route: the manager was
      # not on that net, so the name did not resolve and every local-model call
      # failed with no error anywhere. All four GPUStack services join
      # `coding-agents` (modules/llm/compose.yml), which is why the pre-Manager
      # wiring worked; on the switch the URL moved and the membership did not.
      # Same fence shape as agent-assistants: the MANAGER's metered /v1 only —
      # not the router, not registry/DBs.
      # #1443 (cutover C3): `llm` is the canonical in-network name of the LLM
      # Manager — every consumer wires to http://llm:8080/v1 (#979; the port
      # stays 8080, the container has one listener). The alias rides on every
      # network the manager joins, so the name resolves from the stack, the
      # assistants and the sandboxed coding agents alike.
      default:
        aliases:
          - llm
      agent-assistants:
        aliases:
          - llm
      coding-agents:
        aliases:
          - llm
    ports:
      # Loopback-only host bind for direct smoke/G1 testing. Production
      # traffic enters via Caddy (SSO) — in-network consumers use the Docker
      # DNS name llm-manager:8080 — which keeps working; the canonical address
      # in-network is the `llm` alias above (#1443/#1445/#979 E1).
      - "127.0.0.1:${LLM_MANAGER_PORT:-8091}:8080"
    environment:
      LLM_MANAGER_DATABASE_URL: "postgresql+psycopg2://${LLM_MANAGER_DB_USER:-llm_manager_user}:${LLM_MANAGER_DB_PASSWORD:-}@postgres:5432/${LLM_MANAGER_DB:-llm_manager_db}"
      LLM_MANAGER_VALKEY_URL: "redis://:${VALKEY_PASSWORD}@valkey:6379/${LLM_MANAGER_VALKEY_DB:-9}"
      LLM_MANAGER_LITELLM_BASE_URL: "http://llm-manager-router:4000"
      # #2264: the manager's own offline branches (hf_allowed(), the #307 S1
      # auto-mirror gate) read this and defaulted to "online" because the
      # allow-list did not forward it — journey B on 2026.09-rc10 measured 128
      # packets from llm-manager to huggingface.co under an egress cut, and the
      # mirror commands it dispatched were refused by the (now informed) agent.
      RAZZFAZZ_NETWORK_MODE: "${RAZZFAZZ_NETWORK_MODE:-online}"
      LITELLM_INTERNAL_KEY: "${LITELLM_INTERNAL_KEY:-}"
      # Bearer a fleet node presents to register via POST /api/workers (#254
      # P2-B1). Empty → registration disabled (fail-closed).
      LLM_MANAGER_NODE_KEY: "${LLM_MANAGER_NODE_KEY:-}"
      # Manager's own reachable URL, handed to a joining worker (#262 enroll).
      # Defaults to the manager's public SSO host; a worker on the LAN can also
      # be pointed at a direct address by overriding LLM_MANAGER_ADVERTISE_URL.
      # #1444: the advertise URL (what joining nodes and the console's install line
      # use) is the canonical name; already-joined nodes keep the old one, which
      # the same Caddy block still serves.
      LLM_MANAGER_ADVERTISE_URL: "${LLM_MANAGER_ADVERTISE_URL:-https://${LLM_DOMAIN:-llm.${MAIN_DOMAIN}}}"
      # #1633: how long a CLAIMED command may stay unfinished before the
      # manager stops believing in it and fails it (seconds; default 6 h).
      # The sharp instrument against a stalled transfer is the node's own read
      # timeout — this is the backstop for a node that died mid-command and
      # forgot it ever ran. Generous on purpose: with no progress reporting it
      # cannot tell a slow 30 GB pull from a wedged one.
      LLM_MANAGER_STALE_CLAIM_SECONDS: "${LLM_MANAGER_STALE_CLAIM_SECONDS:-}"
      # #1955: how long the proxy holds a request whose connect to the router
      # was refused, instead of 502-ing. Empty → the code default (20 s), which
      # covers the ~11 s a reload shuts the port for. 0 = no hold.
      LLM_MANAGER_ROUTER_RECONNECT_SECONDS: "${LLM_MANAGER_ROUTER_RECONNECT_SECONDS:-}"
      # #2019: how long a blue-green apply-params overlap may stay unresolved
      # before it is abandoned and the OLD engine simply keeps serving — the
      # params then did not apply, which is visible and retryable. Empty → the
      # code default (900 s). 0 = never abandon.
      LLM_MANAGER_OVERLAP_ABANDON_S: "${LLM_MANAGER_OVERLAP_ABANDON_S:-}"
      # Optional HMAC key signing the monthly entitlement rollup (#254 P2-E2).
      # Empty → rollup returned unsigned.
      LLM_MANAGER_ROLLUP_KEY: "${LLM_MANAGER_ROLLUP_KEY:-}"
      # Local subscription entitlement (#265). "report" (default) = compute +
      # expose, never block (community/dev posture). "enforce" = 402 the hot
      # path on an inactive/expired/absent subscription. LOCAL only — no
      # request-time broker call. SUBSCRIPTION_NUMBER empty → the single local
      # subscriptions row is used.
      LLM_MANAGER_ENTITLEMENT_MODE: "${LLM_MANAGER_ENTITLEMENT_MODE:-report}"
      LLM_MANAGER_SUBSCRIPTION_NUMBER: "${LLM_MANAGER_SUBSCRIPTION_NUMBER:-}"
      # Node credential policy for registration + command channel (#207/#285).
      # "allow" (default): shared node key OR a per-worker key. "enforce": the
      # bare shared key is refused everywhere, so a node must present its
      # per-worker key — and enrollment withholds node_key, so each node holds
      # ONLY its own key (true cross-worker isolation). Flip to enforce once all
      # nodes are (re-)enrolled with LLM_WORKER_COMMAND_KEY.
      LLM_MANAGER_COMMAND_KEY_MODE: "${LLM_MANAGER_COMMAND_KEY_MODE:-allow}"
      # #851: three-tier RBAC (#842/#843) group lists, now operator-overridable.
      # Safe as a plain "${X:-}" forward (empty when unset in .env) ONLY
      # because app/config.py treats an empty string the same as unset and
      # falls back to its own default — an empty admin/user tier tuple would
      # otherwise make that tier permanently unreachable (resolve_role()).
      LLM_MANAGER_ADMIN_GROUPS: "${LLM_MANAGER_ADMIN_GROUPS:-}"
      LLM_MANAGER_ADMIN_TIER_GROUPS: "${LLM_MANAGER_ADMIN_TIER_GROUPS:-}"
      LLM_MANAGER_USER_TIER_GROUPS: "${LLM_MANAGER_USER_TIER_GROUPS:-}"
      # #559 fleet-hub /v2 machine auth: Caddy forward_auths the hub edge's
      # docker API to /api/hub-auth, which checks HTTP Basic against this pair.
      # Password empty -> 401 always (fail-closed until `rzfz hub-credentials`).
      LLM_HUB_REGISTRY_USER: "${LLM_HUB_REGISTRY_USER:-fleet}"
      LLM_HUB_REGISTRY_PASSWORD: "${LLM_HUB_REGISTRY_PASSWORD:-}"
      # #1408: the registry coordinate this master renders into /install-worker
      # (api/install_worker.py REGISTRY_ENV). It is the hub edge as a JOINING
      # box reaches it (#559: Caddy forward_auths the hub's /v2 to /api/hub-auth),
      # so it defaults to the hub domain; the template turns it into
      # LLM_REGISTRY_URL=https://<it> and LLM_WORKER_RUNNER_REGISTRY=<it> on the
      # node. Nothing set it before, so every rendered script carried an empty
      # registry and a thin node fell back to llm-registry:5000 — a compose-
      # network name no remote box resolves. Override only for a split edge.
      LLM_MANAGER_WORKER_REGISTRY: "${LLM_MANAGER_WORKER_REGISTRY:-${LLM_HUB_DOMAIN:-hub.${MAIN_DOMAIN}}}"
      # #319/#227 Fraction of a worker's VRAM carveout that admission control may
      # commit (api/inventory.py). Read by the code but never forwarded here, so
      # the headroom was not tunable at all.
      #
      # NOT "${...:-}" like the worker-agent knobs below it: compose sets the
      # variable to the EMPTY STRING, and `os.environ.get(K, "0.9")` returns ""
      # for a variable that exists-but-is-empty — so `float("")` would raise at
      # IMPORT and the manager would not start. Carrying the real default here
      # keeps that impossible; the code is also empty-tolerant now, but a config
      # file should not rely on that.
      LLM_MANAGER_VRAM_HEADROOM: "${LLM_MANAGER_VRAM_HEADROOM:-0.9}"
      LLM_MANAGER_VRAM_RESERVED_EXTERNAL_GB: ${LLM_MANAGER_VRAM_RESERVED_EXTERNAL_GB:-0}
      # Worker admission (#419 P0). auto (default): a node that finishes
      # enrollment is immediately schedulable — what every box does today.
      # manual: a newly seen worker lands in `pending` and an admin approves it
      # (Fleet → Approve) before it can take traffic. Enrolling proves possession
      # of a short-lived token, not that anyone meant to give that box
      # production work, so set manual where an enrollment token leaking would
      # matter. Default-off on purpose: flipping admission under a running fleet
      # is a flag day. External backends (Mac Ollama gateway) are exempt — an
      # admin adds those deliberately.
      LLM_MANAGER_WORKER_APPROVAL_MODE: "${LLM_MANAGER_WORKER_APPROVAL_MODE:-auto}"
      # #263 SCH2 / #1422: the reconciler's mode. `observe` (default) only
      # reports, `enforce` reschedules a lost worker's deployments elsewhere
      # (#917 hardenings apply). Was never forwarded, so the opt-in the code
      # documents could not be made from .env at all.
      ORCH_RECONCILE: "${ORCH_RECONCILE:-observe}"
      LLM_MANAGER_KEY_PREFIX: "${LLM_MANAGER_KEY_PREFIX:-rzfz-sk-}"
      # Billing-meter CAP behaviour: available (default, fail-open best-effort)
      # | strict (fail-closed 503 when the usage store is unreachable).
      LLM_MANAGER_METERING_MODE: "${LLM_MANAGER_METERING_MODE:-available}"
      # #19 "option C": box-wide in-flight completion cap shared by every
      # consumer (OWUI, Dify, agents, Cognee, …) — REJECTS with 429 once the
      # cap is hit rather than queueing. 0 disables the gate (unbounded). Not
      # "${...:-}" — see the LLM_MANAGER_VRAM_HEADROOM note above: the code
      # reads this with int(), and an empty string would raise at import.
      LLM_MANAGER_MAX_CONCURRENT_REQUESTS: "${LLM_MANAGER_MAX_CONCURRENT_REQUESTS:-24}"
      # #928: idle-between-frames deadline for ONE request relayed to a REMOTE
      # worker over the WS inference relay. A wedged engine on a still-healthy
      # socket used to pin its relay slot (and one of the cap slots above)
      # forever — nothing in the WS-drop or client-disconnect recovery paths
      # notices it. Seconds; 0 disables the bound (pre-#928, unbounded). Not
      # "${...:-}" for the reason given above LLM_MANAGER_VRAM_HEADROOM.
      LLM_MANAGER_RELAY_IDLE_TIMEOUT_S: "${LLM_MANAGER_RELAY_IDLE_TIMEOUT_S:-300}"
      LLM_MANAGER_ROUTER_CONFIG_PATH: "/config/router-config.yaml"
      # #1256: mount target of the stack's model manifest (see the volumes
      # section) — the single declaration of each model's vision projector.
      # Not "${...:-}": the path is an image/compose contract, not an operator
      # knob, and an empty forward would read a file that isn't there.
      LLM_MANAGER_MODEL_MANIFEST: "/srv/standard-models.yaml"
      # #419: the CA whose fingerprint is minted into the join command. Defaults
      # to Caddy's INTERNAL root, which exists when TLS_MODE=internal — exactly
      # the case where pinning matters, because a node has no public trust
      # anchor to fall back on. On a Let's Encrypt box the file is absent, the
      # fingerprint is None, and the join command simply carries no pin; the
      # node then verifies against the public PKI as usual.
      LLM_MANAGER_CA_PEM: "${LLM_MANAGER_CA_PEM:-/caddy-data/caddy/pki/authorities/local/root.crt}"
      # Observability (OpenLIT + ClickHouse via otel-collector). Empty (default)
      # → OFF: the generated router config carries NO otel callback, nothing is
      # emitted. Set to the collector (http://otel-collector:4318) when the
      # `observability` profile is enabled → the router exports a span/request.
      LLM_MANAGER_OTEL_ENDPOINT: "${LLM_MANAGER_OTEL_ENDPOINT:-}"
      # #1518 (E5): LLM_MANAGER_ENABLE_VLLM was forwarded here. #1182 used it to
      # HIDE the vLLM path; the operator decision of 2026-09-05 removed the path
      # itself, so there is nothing left to gate. GGUF/llama.cpp is the fleet's
      # one model architecture — on NVIDIA too, where the GPU's compute
      # capability picks between the two CUDA runners (#1516/#1517).
      TZ: "${TZ:-UTC}"
    volumes:
      # Manager writes the generated LiteLLM config here; the router reads it.
      - llm-manager-router-config:/config
      # #419: the master must read its OWN CA to mint a --ca-pin into the join
      # command. Read-only. Without this the pin is INERT — read_ca_fingerprint()
      # finds no file, returns None, the join command carries no --ca-pin, and
      # every node takes the "master not verified" path while looking like a
      # normal enrolment. Confirmed inert on 0.91 before this mount existed.
      - caddy_data:/caddy-data:ro
      # #1059: the install-script TEMPLATE the manager renders per request at
      # GET /install-worker. Read-only, and deliberately the same file Caddy
      # serves statically at /install-worker.sh — one artifact, two routes, so
      # the online and the air-gap path can never drift apart.
      - ../../../scripts/install-worker.sh.tmpl:/srv/install-worker.sh.tmpl:ro
      # #1256: the stack's model manifest — the SINGLE place a model's vision
      # projector (mmproj) filename is declared. Read-only, and deliberately
      # the same file the host-side readers use (cli/lib-llm-manager-deploy.sh,
      # core/llm/expected_models.py, core/llm/sync.py), exactly like the
      # install-worker template above: one artifact, several readers, so the
      # console deploy and the CLI deploy can never disagree about which file
      # to pull. A hand-typed second copy in app/catalog.py is what left a
      # clean LLM-Manager box serving the vision default text-only.
      - ../../../core/llm/standard-models.yaml:/srv/standard-models.yaml:ro
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
    depends_on:
      - llm-manager-router

  llm-manager-router:
    # LiteLLM (MIT OSS) used strictly as a router. Pin shared with the mac
    # gateway via LITELLM_VERSION. SHIP GATE: repin to a reviewed tag/digest.
    image: ghcr.io/berriai/litellm:${LITELLM_VERSION:-main-v1.83.7-stable}
    profiles: ["llm-manager"]
    container_name: llm-manager-router
    restart: unless-stopped
    networks:
      - default
    # No host port + no Caddy route: internal-only. Reached in-network as
    # llm-manager-router:4000 with the LITELLM_INTERNAL_KEY (known only
    # to the manager).
    environment:
      LITELLM_INTERNAL_KEY: "${LITELLM_INTERNAL_KEY:-}"
      # Router redis (latency-routing/cooldown state) auths against the shared
      # valkey, which runs with requirepass — the router-config references this
      # as `redis_password: os.environ/VALKEY_PASSWORD`.
      VALKEY_PASSWORD: "${VALKEY_PASSWORD:-}"
      # OTel export target for the `otel` callback the manager writes into the
      # router config when observability is ON. Empty → the callback is absent,
      # so these are unused. Single switch: LLM_MANAGER_OTEL_ENDPOINT (=
      # http://otel-collector:4318 when the `observability` profile is enabled).
      OTEL_EXPORTER_OTLP_ENDPOINT: "${LLM_MANAGER_OTEL_ENDPOINT:-}"
      OTEL_EXPORTER_OTLP_PROTOCOL: "${LLM_MANAGER_OTEL_PROTOCOL:-http/protobuf}"
      OTEL_SERVICE_NAME: "llm-manager-router"
    # LiteLLM reads its --config ONLY at process start; the manager REWRITES that
    # file whenever the fleet changes (deploy / undeploy / (re)registration). With
    # a bare `litellm --config`, a running router therefore never picks up a
    # newly-deployed model — it shows "running" on the node yet 400s "Invalid
    # model name" at /v1 (#308). No docker socket on the manager + no DB for the
    # router, so we wrap the entrypoint: run LiteLLM, and restart it in-place when
    # (and ONLY when) the config's CONTENT hash changes — steady-state rewrites of
    # identical bytes cause no churn. Also self-heals if LiteLLM dies.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        CFG=/config/router-config.yaml
        # #1955: the manager writes this file when it needs LiteLLM restarted
        # even though the config bytes did not change — a blue-green engine
        # switch on a RELAY-routed worker renders the same endpoint
        # (`/relay/<worker-id>/v1`) before and after, so a content-hash watcher
        # cannot see it. Without the restart the router keeps its in-memory
        # state across the switch, and a cooldown on a single-replica model then
        # answers 429 for as long as the load lasts while every status reads
        # ready (measured on 0.91, 2026-09-11).
        STAMP=/config/router-reload-stamp
        # Plain constants, NOT environment knobs. An earlier draft made these two
        # compose-interpolated defaults so a test could drive the watcher fast
        # on a free port — and tests/unit/consistency/test_llm_env_documented.py
        # refused that, correctly (and then refused the example syntax in this
        # very comment, because it scans the file text, comments included):
        # a key an llm compose file references has to be
        # documented in .env.example, and documenting two test-only dials as
        # operator knobs would be a lie. The test substitutes these literals
        # instead, and asserts each substitution matched exactly once.
        PORT=4000
        INTERVAL=5
        [ -f "$$CFG" ] || printf 'model_list: []\n' > "$$CFG"
        h() { cat "$$CFG" "$$STAMP" 2>/dev/null | md5sum | cut -d' ' -f1; }
        # PENDING is sampled at the moment LiteLLM is launched, i.e. as close as
        # we can get to the bytes it actually reads. It becomes LAST only once
        # the new process is serving. The old code sampled LAST *before* a kill
        # that is followed by a graceful drain — measured at 81 s on 0.91 — so
        # any rewrite arriving during the drain was recorded as already applied,
        # and the very next loop pass saw a difference again and restarted a
        # process that was still importing. That second restart is what turned a
        # ~6 s cold start into an 11.1 s outage (#1955, forensics 2026-09-12).
        start() { PENDING=$$(h); litellm --config "$$CFG" --port "$$PORT" & LPID=$$!; }
        # Serving means accepting a connection, not "the pid exists". python is
        # the one interpreter this image is guaranteed to have (its healthcheck
        # uses it too); /dev/tcp would need bash, and this entrypoint is sh.
        serving() { python -c "import socket,sys; s=socket.socket(); s.settimeout(1); sys.exit(0 if s.connect_ex(('127.0.0.1',int(sys.argv[1])))==0 else 1)" "$$PORT" 2>/dev/null; }
        # Bounded: a config LiteLLM refuses must not wedge the watcher forever,
        # it must fall through and let the next change try again.
        await_serving() {
          i=0
          while [ $$i -lt 180 ]; do
            kill -0 "$$LPID" 2>/dev/null || return 1
            serving && return 0
            i=$$((i+1)); sleep 1
          done
          return 1
        }
        trap 'kill "$$LPID" 2>/dev/null; exit 0' TERM INT
        start
        await_serving || echo "[router-reload] WARNING: LiteLLM did not start serving on port $$PORT"
        LAST=$$PENDING
        while sleep "$$INTERVAL"; do
          if ! kill -0 "$$LPID" 2>/dev/null; then
            echo "[router-reload] LiteLLM exited on its own -> restarting"
            start; await_serving; LAST=$$PENDING; continue
          fi
          NOW=$$(h)
          [ "$$NOW" = "$$LAST" ] && continue
          echo "[router-reload] router-config.yaml or the reload stamp changed -> restarting LiteLLM"
          T0=$$(date +%s)
          kill "$$LPID" 2>/dev/null; wait "$$LPID" 2>/dev/null
          T1=$$(date +%s)
          start
          await_serving || echo "[router-reload] WARNING: the restarted LiteLLM is not serving on port $$PORT"
          T2=$$(date +%s)
          # LAST only now, and from PENDING: whatever arrived during the drain is
          # already in the process that just started, so it must not trigger a
          # second restart.
          LAST=$$PENDING
          echo "[router-reload] drain $$((T1-T0))s, outage $$((T2-T1))s (requests are refused during the outage; the manager holds and retries — #1955)"
        done
    volumes:
      - llm-manager-router-config:/config
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u,sys; sys.exit(0 if u.build_opener(u.ProxyHandler({})).open('http://localhost:4000/health/liveliness',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s

volumes:
  llm-manager-router-config:

networks:
  # #612 — identical name-keyed declaration merges with core/compose.yml.
  agent-assistants:
    name: agent-assistants
    driver: bridge
  # #1424 — same merge shape; declared in core/compose.yml and re-declared
  # identically in modules/llm/compose.yml for the GPUStack services.
  coding-agents:
    name: coding-agents
    driver: bridge
