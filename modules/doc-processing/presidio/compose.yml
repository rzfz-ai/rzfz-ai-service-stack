# ==============================================================================
# PII DETECTION & REDACTION MODULE (Presidio)
# ==============================================================================
# Profile: presidio
# Three stateless, internal-only containers:
#   - presidio-analyzer:       Text PII entity detection  (port 3000 → host 5100)
#   - presidio-anonymizer:     Text PII anonymization     (port 3000 → host 5300)
#   - presidio-image-redactor: Image PII redaction        (port 3000 → host 5200)
#
# Typical workflow:
#   1. POST presidio-analyzer:3000/analyze   → list of entity spans
#   2. POST presidio-anonymizer:3000/anonymize → redacted text (using spans from step 1)
#   (Optional) POST presidio-anonymizer:3000/deanonymize → restore via AES decrypt
#
# No Caddy, no Authentik. Access via Docker DNS service names.
# All three are MIT-licensed (microsoft/presidio on GitHub).
# ==============================================================================
services:
  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:2.2.362
    profiles: ["presidio"]
    container_name: presidio-analyzer
    restart: unless-stopped
    # #36 security-review — join egress-controlled coding-agents net for sandboxed coding agents
    networks:
      - default
      - coding-agents
    # autoheal opt-in (2026-05-25): on prod 8.246 the analyzer's gunicorn worker
    # hung at startup — /health probes >15s, container went `unhealthy`, but
    # `restart: unless-stopped` won't restart a wedged (non-exited) process. Took
    # a manual `docker restart`. autoheal (core/compose.yml) does that within ~30s
    # of the 3rd failed probe. Safe here: stateless gunicorn, fast restart, no
    # model-load storm (unlike gpustack, where autoheal cascade-kills — never add).
    labels:
      autoheal: "true"
    ports:
      - "127.0.0.1:${PRESIDIO_ANALYZER_PORT:-5100}:3000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.build_opener(u.ProxyHandler({})).open('http://localhost:3000/health')"]
      interval: 30s
      # #1260 rev-C: same budget shape as the redactor, same reason.
      # The analyzer loads its spaCy NER models at WORKER BOOT (not on
      # first request — gunicorn constructs the engine in create_app),
      # measured on 0.91 at ~5 s warm. It carries `autoheal: "true"`
      # (#1285), so an unhealthy window is also a window in which
      # autoheal restarts it — and, right after a Portal stop, brings a
      # DISABLED module back up. That is an argument for a start period
      # that covers the warm-up, NOT for one that outlives the module's
      # own health budget: `unhealthy` must stay reachable inside
      # health_timeout_for(400 MB) = 300 s, so 120 + 3*15 + 2*30 = 225 s.
      timeout: 15s
      retries: 3
      start_period: 120s
      start_interval: 5s

  presidio-anonymizer:
    image: mcr.microsoft.com/presidio-anonymizer:2.2.362
    profiles: ["presidio"]
    container_name: presidio-anonymizer
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PRESIDIO_ANONYMIZER_PORT:-5300}:3000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.build_opener(u.ProxyHandler({})).open('http://localhost:3000/health')"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s

  presidio-image-redactor:
    image: mcr.microsoft.com/presidio-image-redactor:0.0.58
    profiles: ["presidio"]
    container_name: presidio-image-redactor
    restart: unless-stopped
    # #36 security-review — join egress-controlled coding-agents net for sandboxed coding agents
    networks:
      - default
      - coding-agents
    ports:
      - "127.0.0.1:${PRESIDIO_IMAGE_REDACTOR_PORT:-5200}:3000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.build_opener(u.ProxyHandler({})).open('http://localhost:3000/health')"]
      interval: 30s
      # #1260 rev-C, MEASURED on 0.91 (Phase-3 round 4, clean install):
      # container started 16:44:40, worker booted 16:44:41, FIRST health probe
      # exited 0 at 16:44:45 — a warm start is ~5 s, and `docker logs` shows NO
      # `WORKER TIMEOUT`, so the gunicorn-arbiter kill-loop hypothesis is out.
      # The 300 s of rev-A were therefore not derived from anything; they were
      # the round-2 symptom (`unhealthy` under a loaded box) turned into a
      # number. Worse, they broke the rotation's fast verdict: with
      # start_period 300 s the earliest `unhealthy` is
      # 300 + 3*60 + 2*30 = 540 s, while the module's health budget is
      # health_timeout_for(400 MB) = 300 s — every defect (hung worker, boot
      # loop, OOM) then reads exactly like "still warming up".
      # The budget below keeps `unhealthy` reachable INSIDE that window:
      # 120 + 3*15 + 2*30 = 225 s < 300 s. `start_interval` (Docker >= 25,
      # compose spec) probes every 5 s during the start period, so a container
      # that IS ready flips to healthy in seconds instead of waiting out the
      # window — that is the lever that buys warm-up room without paying for it
      # in detection time. Pinned against the rotation budget by
      # tests/unit/day1-tooling/test_1233_rotation_revb.py.
      timeout: 15s
      retries: 3
      start_period: 120s
      start_interval: 5s

# #36 security-review — shared egress-controlled net (declared in core/compose.yml).
networks:
  coding-agents:
    name: coding-agents
    driver: bridge
