# Shared tmux config for razzfazz.ai coding-agent split (#36).
#
# The key feature here is SESSION PERSISTENCE across a container restart:
#   * tmux-resurrect  — saves/restores tmux sessions, windows, panes, and
#                       (with the options below) the running program in each
#                       pane, to ~/.local/share/tmux/resurrect (persistent vol).
#   * tmux-continuum  — auto-saves every 1 min and auto-restores on tmux server
#                       start, so the entrypoint's `tmux start-server` after a
#                       `docker restart` brings every tab back automatically.
#
# Plugins are vendored into the image at /opt/tmux-plugins (no network at
# runtime). TPM is not required because we load the two plugin run scripts
# directly at the bottom.

set -g default-terminal "tmux-256color"
set -g history-limit 20000
set -g mouse on
set -g status-style "bg=#151515,fg=#999999"
set -g base-index 1
setw -g pane-base-index 1

# ── clipboard: OSC 52 so a mouse-drag copy reaches the OS clipboard (#36 / PR #84) ──
# `mouse on` means a trackpad/mouse drag is captured by TMUX (enters copy-mode
# and selects), NOT by xterm.js — so xterm's own DOM text-selection never fires
# and there is nothing for a browser copy to grab. `set-clipboard on` makes tmux
# emit an OSC 52 clipboard escape whenever text is copied (including the default
# mouse drag-end copy-selection in mouse mode). The web terminal's xterm.js
# ClipboardAddon receives that OSC 52 and writes it to navigator.clipboard, so
# "select with the mouse → it's on the clipboard" works WITHOUT disabling
# mouse-scroll. We also set Ms (the terminfo clipboard capability) so tmux knows
# the outer terminal supports OSC 52 even under tmux-256color.
set -g set-clipboard on
set -ga terminal-overrides ',*:Ms=\E]52;%p1%s;%p2%s\7'
# Mouse drag-end: copy the selection (stays in copy-mode-friendly), which with
# set-clipboard=on emits OSC 52. `copy-selection -x` copies + exits copy-mode so
# the pane returns to the shell immediately after a drag (no lingering select).
bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# Persist across the server lifetime; don't destroy a session when its last
# client detaches (the web UI attaches/detaches constantly).
set -g destroy-unattached off

# ── resurrect: also capture the running program so an agent (opencode/gsd/
# codex) is relaunched in its pane after a restore, not just the shell. ──
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'opencode gsd codex claude aider gemini bash'
set -g @resurrect-dir "$HOME/.local/share/tmux/resurrect"

# ── continuum: auto-save + auto-restore on server start. ──
set -g @continuum-restore 'on'
set -g @continuum-save-interval '1'

run-shell /opt/tmux-plugins/tmux-resurrect/resurrect.tmux
run-shell /opt/tmux-plugins/tmux-continuum/continuum.tmux
