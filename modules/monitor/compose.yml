# ==============================================================================
# MONITORING MODULE (Komodo)
# ==============================================================================
# Profile: monitor
# Infrastructure monitoring and alerting.
# ==============================================================================
services:
  postgres-komodo:
    image: ghcr.io/ferretdb/postgres-documentdb:${KOMODO_DB_VERSION:-17-0.107.0-ferretdb-2.7.0}
    profiles: ["monitor"]
    container_name: postgres-komodo
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-docker}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
      - POSTGRES_DB=postgres
      # F-018: Removed POSTGRES_HOST_AUTH_METHOD=trust — password auth is enforced
      # via POSTGRES_PASSWORD (default scram-sha-256 when password is set)
    volumes:
      - postgres-komodo-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docker} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      # #182: DO NOT stop komodo's postgres during the volume archive. Like the
      # core postgres, postgres-komodo-data is now EXCLUDED from the tar by the
      # default BACKUP_EXCLUDE_REGEXP and captured LOGICALLY instead — the
      # archive-pre hook runs `pg_dumpall` on postgres-komodo →
      # databases/postgres_komodo.sql. offen therefore never tars the live
      # komodo pgdata, so it can't hit the pg_wal-recycle race that failed the
      # nightly backup (#157) and there's no need to stop it (no monitoring
      # blip). HARD INVARIANT: only safe while postgres-komodo-data stays out of
      # the tar — if it's re-included, restore this label to `true`. See the
      # #182 note in core/compose.yml postgres + config/.env.example.
      - "docker-volume-backup.stop-during-backup=false"

  ferretdb:
    image: ghcr.io/ferretdb/ferretdb:${FERRETDB_VERSION:-2.7.0}
    profiles: ["monitor"]
    container_name: ferretdb
    restart: unless-stopped
    environment:
      - FERRETDB_POSTGRESQL_URL=postgres://${POSTGRES_USER:-docker}:${POSTGRES_PASSWORD:-}@postgres-komodo:5432/postgres?sslmode=disable
    depends_on:
      postgres-komodo:
        condition: service_healthy

  komodo-core:
    image: ghcr.io/moghtech/komodo-core:${KOMODO_VERSION:-2.2.0}
    profiles: ["monitor"]
    container_name: komodo-core
    restart: unless-stopped
    env_file:
      - ../../.env
    ports:
      - "127.0.0.1:${KOMODO_PORT:-8180}:8180"
    depends_on:
      - ferretdb

  komodo-periphery:
    image: ghcr.io/moghtech/komodo-periphery:${KOMODO_VERSION:-2.2.0}
    profiles: ["monitor"]
    container_name: komodo-periphery
    restart: unless-stopped
    env_file:
      - ../../.env
    ports:
      # F-007: Bind to localhost only — Periphery should not be reachable from external network
      - "127.0.0.1:${KOMODO_PERIPHERY_PORT:-8120}:8120"
    volumes:
      # SECURITY: ro — Komodo periphery reads container state for monitoring display.
      # If Komodo needs to manage containers (start/stop/restart), this must be changed to rw.
      - /var/run/docker.sock:/var/run/docker.sock:ro