# ==============================================================================
# DIFY MODULE (LLM Application Platform)
# ==============================================================================
# Profile: dify
# Dependencies: postgres, valkey, caddy (from core)
# Config: .env (global), .env.dify (module specific)
# ==============================================================================
services:

  # ==========================================
  # Dify Init: Permissions setup
  # ==========================================
  dify-init-permissions:
    image: busybox:1.37
    container_name: dify-init-permissions
    profiles: ["dify"]
    command:
      - sh
      - -c
      - |
        FLAG_FILE="/app/storage/.init_permissions"
        if [ -f "$${FLAG_FILE}" ]; then
          echo "Permissions already initialized. Exiting."
          exit 0
        fi
        echo "Initializing permissions for /app/storage"
        chown -R 1001:1001 /app/storage && touch "$${FLAG_FILE}"
        echo "Permissions initialized. Exiting."
    volumes:
      - dify-app-data:/app/storage
    restart: "no"
    labels:
      razzfazz.init: "true"

  # ==========================================
  # Dify plugin daemon: storage ownership
  # ==========================================
  # The 0.6.12 daemon image runs as its `dify` user. A volume created by an older
  # image (or by a root-run daemon) holds root-owned files that user cannot write,
  # so plugin installs fail. This one-shot runs in the DAEMON'S OWN image (the user
  # name resolves to whatever uid that image gave it) and re-owns only that volume.
  # Idempotent: it does nothing once no file is owned by someone else.
  dify-plugin-daemon-init-permissions:
    image: langgenius/dify-plugin-daemon:${DIFY_PLUGIN_VERSION:-0.6.12-local}
    pull_policy: if_not_present
    profiles: ["dify"]
    container_name: dify-plugin-daemon-init-permissions
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # #2445: the daemon starts plugins with only HOME, INSTALL_METHOD, LANG, LC_ALL, PATH
        # and TZ, so the image's TIKTOKEN_CACHE_DIR never reaches them and tiktoken falls back
        # to /tmp/data-gym-cache, then downloads (offline: waits, and no document is ever
        # indexed). The baked files carry tiktoken's cache keys: copy them where it looks.
        if [ -d /app/.tiktoken ]; then
          mkdir -p /tmp/data-gym-cache
          cp -n /app/.tiktoken/* /tmp/data-gym-cache/
          chown -R dify:dify /tmp/data-gym-cache
        fi
        if [ -z "$$(find /app/storage -not -user dify -print -quit)" ]; then
          echo "Plugin daemon storage already owned by dify. Exiting."
          exit 0
        fi
        echo "Re-owning the plugin daemon storage volume to dify"
        chown -R dify:dify /app/storage
    volumes:
      - dify-plugin-daemon:/app/storage
      - dify-tiktoken-cache:/tmp/data-gym-cache
    restart: "no"
    labels:
      razzfazz.init: "true"

  # ==========================================
  # Dify API: Main Backend Service
  # ==========================================
  dify-api:
    # #1981: upstream dify-api + the `unstructured` extras (.msg attachments:
    # pdf / image / xlsx / pptx / docx parsers, CPU-only torch). Built once
    # here; dify-worker, dify-worker-dataset and dify-worker-beat run the SAME
    # image and must not build a second copy.
    image: razzfazz-dify-api:${DIFY_VERSION:-1.18.0}
    build:
      # Shared context with dify-web (modules/dify/): image provenance hashes
      # every tracked file under it, so an edit here (compose.yml included)
      # marks BOTH razzfazz-dify-api and dify-web stale. An online build also
      # reaches download.pytorch.org (CPU torch wheels) besides PyPI, plus
      # github.com and huggingface.co for the two baked models (#2073); a
      # proxied or allow-listed box must let them through.
      context: .
      dockerfile: Dockerfile.api
      args:
        - DIFY_VERSION=${DIFY_VERSION:-1.18.0}
    pull_policy: never  # #184 WS2a: built at install; never build/pull at runtime
    profiles: ["dify"]
    container_name: dify-api
    restart: always
    # #1981/#2073: the document parsers run here too (a workflow's Document
    # Extractor). Measured on a test box: one .msg extraction 1.91 GiB at a
    # 2g limit, two concurrent 2.41 GiB at 3g. 4g keeps full image parsing
    # (layout model) with headroom; dify-worker runs the same parsers.
    mem_limit: 4g
    # Surgical patches for known upstream bugs (see dify/patches/entrypoint-wrapper.sh).
    # The wrapper exec's the upstream /entrypoint.sh once patches are applied.
    entrypoint: ["/bin/bash", "/dify-patches/entrypoint-wrapper.sh"]
    environment:
      # #2472 review: env_file hands every Dify container the whole stack .env,
      # MCP_INTERNAL_TOKEN included (the key to mcp-manager's /internal/*,
      # which the SSRF proxy also refuses). No Dify code uses it: emptied.
      - MCP_INTERNAL_TOKEN=
      # Verweis auf Core Services via Hostname
      - DB_HOST=postgres
      - REDIS_HOST=valkey
      - PGVECTOR_HOST=postgres
      # SSRF via Caddy Forward Proxy
      - SSRF_PROXY_HTTP_URL=http://caddy:8195
      - SSRF_PROXY_HTTPS_URL=http://caddy:8195
      # rc6.7 #30: Dify uses LOG_TZ to timestamp all server-side log
      # output AND the Console "Run history" UI. The upstream default
      # in .env.dify is `LOG_TZ=UTC`, which makes the UI show times an
      # hour or two off the operator's wall clock. Override here from
      # the global TZ in .env so Dify follows the box's timezone.
      # Set in `environment:` (not .env.dify) because env_file does no
      # variable interpolation — `LOG_TZ=${TZ}` would land verbatim.
      - LOG_TZ=${TZ:-UTC}
      # Mode
      - MODE=api
      # URLs (Dynamic interpolation from .env)
      - CONSOLE_URL=https://${DIFY_DOMAIN:-dify.${MAIN_DOMAIN:-razzfazz-box}}
      - API_URL=https://${DIFY_DOMAIN:-dify.${MAIN_DOMAIN:-razzfazz-box}}
      - APP_URL=https://${DIFY_DOMAIN:-dify.${MAIN_DOMAIN:-razzfazz-box}}
      - WEB_API_URL=https://${DIFY_DOMAIN:-dify.${MAIN_DOMAIN:-razzfazz-box}}
      - FILES_URL=https://${DIFY_DOMAIN:-dify.${MAIN_DOMAIN:-razzfazz-box}}
      # Reference MAIN_DOMAIN directly (single-level interpolation), NOT the
      # nested ${DIFY_DOMAIN:-dify.${MAIN_DOMAIN}} — DIFY_DOMAIN is stored in .env
      # as the literal "dify.${MAIN_DOMAIN}", and Compose does not recursively
      # resolve a nested var inside an env VALUE on every version / recreate path.
      # A dify-api container recreated where that recursion didn't happen baked the
      # literal "https://dify.${MAIN_DOMAIN}" into TRIGGER_URL and leaked it into
      # the webhook-trigger URLs shown in the UI (prod, 2026-08-02). dify.<domain>
      # is the fixed convention, so referencing MAIN_DOMAIN directly always resolves.
      - TRIGGER_URL=https://dify.${MAIN_DOMAIN:-razzfazz-box}
      # CORS & Security (F-020: restrict CORS to own domain instead of wildcard)
      - WEB_API_CORS_ALLOW_ORIGINS=https://${DIFY_DOMAIN:-dify.${MAIN_DOMAIN:-razzfazz-box}}
      - CONSOLE_CORS_ALLOW_ORIGINS=https://${DIFY_DOMAIN:-dify.${MAIN_DOMAIN:-razzfazz-box}}
      - COOKIE_DOMAIN=${MAIN_DOMAIN:-razzfazz-box}
      # Internal Service Discovery
      # rc6.7 #27: dify-api/worker MUST hit marketplace.dify.ai directly through
      # the SSRF forward proxy (caddy:8195). The earlier `caddy:8196` reverse-
      # proxy override broke plugin downloads — caddy:8196 resolves to a 172.16.x
      # IP, which the SSRF :8195 ACL denies (RFC1918 block) → 403 → empty body
      # treated as a "package" → "not a valid difypkg".
      - MARKETPLACE_API_URL=${MARKETPLACE_API_URL:-https://marketplace.dify.ai}
      - INTERNAL_FILES_URL=http://dify-api:5001
      # Secrets
      - SECRET_KEY=${WEBUI_SECRET_KEY:-}
      # 1.18.0 added an optional PASSWORD_PEPPER that wraps the stored PBKDF2 digest.
      # The stack writes account hashes itself (cli/lib-set-password.sh,
      # post-install.sh: plain PBKDF2-SHA256), so a pepper would make every one of
      # those writes unusable at login. Empty, whatever .env.dify says.
      - PASSWORD_PEPPER=
      - DB_PASSWORD=${DIFY_DB_PASSWORD:-}
      - REDIS_PASSWORD=${VALKEY_PASSWORD:-}
      # One source: the broker URL carries the stack password straight from .env, so a
      # stale copy in .env.dify cannot win (environment: beats env_file).
      - CELERY_BROKER_URL=redis://:${VALKEY_PASSWORD:-}@valkey:6379/1
      # #3292 (H-01): the pgvector VECTOR_STORE lives in DIFY_DB and connects as
      # Dify's own role (dify_user), never as the cluster superuser. User and
      # password come as a PAIR from the same role (ga.1 lesson: the docker user
      # with the dify_user password failed every dataset write). The re-own at
      # upgrade (#2524) hands the existing embedding tables to dify_user.
      - PGVECTOR_USER=${DIFY_DB_USER:-}
      - PGVECTOR_PASSWORD=${DIFY_DB_PASSWORD:-}
      # 2026.05-ga.3: dify-api validates plugin-daemon callbacks on /inner
      # endpoints against INNER_API_KEY_FOR_PLUGIN; without this it falls
      # back to the upstream default "inner-api-key" which doesn't match
      # plugin-daemon's PLUGIN_DIFY_INNER_API_KEY → callbacks 401. Same
      # secret on both sides. (This was already broken on 1.14.0; 1.14.1
      # just surfaced the env var in upstream .env.example.)
      - INNER_API_KEY_FOR_PLUGIN=${PLUGIN_DIFY_INNER_API_KEY:-}
      # #2598: stack .env keys this service reads (Dify's own settings (Google login); everything else comes from .env.dify),
      # by name only: compose takes the value from the stack .env and leaves
      # the variable unset when the key is absent, as env_file did.
      - GOOGLE_CLIENT_ID
      - GOOGLE_CLIENT_SECRET
      - TZ
    depends_on:
      dify-init-permissions:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
      caddy:
        condition: service_started
    volumes:
      - dify-app-data:/app/storage
      - ./patches:/dify-patches:ro
    networks:
      - default
      - ssrf_proxy_network
      # #36 security-review — join egress-controlled coding-agents net (sandboxed coding agents reach dify-api by name).
      - coding-agents
    # #2598: only Dify's own .env.dify; the stack keys Dify reads are named
    # in `environment:` below.
    env_file:
      - ../../.env.dify

  # ==========================================
  # Dify Worker: Background Tasks
  # ==========================================
  # MODE=worker alone would listen on ALL 22 Celery queues; #2510 splits them:
  # this worker runs the 17 non-ingestion queues named in CELERY_QUEUES below,
  # including:
  #   - workflow_based_app_execution (Dify 1.13+, required for streaming & HITL resume)
  #   - api_token (Dify 1.13+, required if ENABLE_API_TOKEN_LAST_USED_UPDATE_TASK=true)
  # and dify-worker-dataset runs the 5 dataset/knowledge-pipeline queues.
  dify-worker:
    image: razzfazz-dify-api:${DIFY_VERSION:-1.18.0}   # #1981: the image dify-api builds
    pull_policy: never  # #184 WS2a
    profiles: ["dify"]
    container_name: dify-worker
    restart: always
    mem_limit: 4g  # #1981/#2073: same parsers as dify-api (see there)
    entrypoint: ["/bin/bash", "/dify-patches/entrypoint-wrapper.sh"]
    environment:
      # #2472 review: env_file hands every Dify container the whole stack .env,
      # MCP_INTERNAL_TOKEN included (the key to mcp-manager's /internal/*,
      # which the SSRF proxy also refuses). No Dify code uses it: emptied.
      - MCP_INTERNAL_TOKEN=
      - DB_HOST=postgres
      - REDIS_HOST=valkey
      - PGVECTOR_HOST=postgres
      - SSRF_PROXY_HTTP_URL=http://caddy:8195
      - SSRF_PROXY_HTTPS_URL=http://caddy:8195
      # rc6.7 #30: see dify-api block — keep worker's log timezone
      # aligned with the box's TZ (and the api/beat services).
      - LOG_TZ=${TZ:-UTC}
      - MODE=worker
      # #2510 (prod incident 2026-09-26): a single Celery worker ran ALL
      # queues, so a long dataset re-embed (dataset/pipeline tasks, minutes
      # to hours) starved webhook dispatch, streaming and async workflow
      # execution behind it. Split into this "workflow" worker (everything
      # except dataset/pipeline ingestion — see dify-worker-dataset below)
      # and a dedicated dataset worker. Queue names are Dify 1.17.1's
      # SELF-HOSTED default set from api/docker/entrypoint.sh (COMMUNITY
      # branch), confirmed against a 21-queue list DevBox measured on prod
      # with CELERY_QUEUES unset (git.razzfazz.ai #2510 comment 36899):
      #   api_token,dataset,dataset_summary,priority_dataset,
      #   priority_pipeline,pipeline,mail,ops_trace,app_deletion,app_rbac,
      #   plugin,workflow_storage,conversation,workflow,schedule_poller,
      #   schedule_executor,triggered_workflow_dispatcher,
      #   trigger_refresh_publisher,trigger_refresh_executor,retention,
      #   workflow_based_app_execution
      # dataset, dataset_summary, priority_dataset, pipeline and
      # priority_pipeline move to dify-worker-dataset (#2510 amendment:
      # pipeline/priority_pipeline are embedding-heavy knowledge-pipeline
      # ingestion, same as dataset — on prod's hot-fix they already ran on
      # a one-off dify-worker-2). The remaining 17 queues stay here.
      # 1.18.0 added a 22nd queue, knowledge_fs_lifecycle, to the self-hosted
      # default set (api/docker/entrypoint.sh, diffed 1.17.1 -> 1.18.0). It
      # carries the Agent Knowledge Base lifecycle tasks, which Beat only
      # dispatches when that opt-in service is on; it is named here so no
      # queue of the upstream default set is left without a consumer.
      - CELERY_QUEUES=api_token,mail,ops_trace,app_deletion,app_rbac,plugin,workflow_storage,conversation,workflow,schedule_poller,schedule_executor,triggered_workflow_dispatcher,trigger_refresh_publisher,trigger_refresh_executor,retention,workflow_based_app_execution,knowledge_fs_lifecycle
      # #2510: ≥ 4 slots so webhooks/streaming/async workflows keep moving
      # even while the dataset worker is busy re-embedding.
      - CELERY_WORKER_AMOUNT=${DIFY_WORKER_AMOUNT:-4}
      - CONSOLE_URL=https://${DIFY_DOMAIN:-dify.${MAIN_DOMAIN:-razzfazz-box}}
      - API_URL=https://${DIFY_DOMAIN:-dify.${MAIN_DOMAIN:-razzfazz-box}}
      - APP_URL=https://${DIFY_DOMAIN:-dify.${MAIN_DOMAIN:-razzfazz-box}}
      - WEB_API_URL=https://${DIFY_DOMAIN:-dify.${MAIN_DOMAIN:-razzfazz-box}}
      - FILES_URL=https://${DIFY_DOMAIN:-dify.${MAIN_DOMAIN:-razzfazz-box}}
      # F-020: restrict CORS to own domain instead of wildcard
      - WEB_API_CORS_ALLOW_ORIGINS=https://${DIFY_DOMAIN:-dify.${MAIN_DOMAIN:-razzfazz-box}}
      - CONSOLE_CORS_ALLOW_ORIGINS=https://${DIFY_DOMAIN:-dify.${MAIN_DOMAIN:-razzfazz-box}}
      - COOKIE_DOMAIN=${MAIN_DOMAIN:-razzfazz-box}
      - MARKETPLACE_API_URL=${MARKETPLACE_API_URL:-https://marketplace.dify.ai}
      - INTERNAL_FILES_URL=http://dify-api:5001
      - SECRET_KEY=${WEBUI_SECRET_KEY:-}
      # 1.18.0 added an optional PASSWORD_PEPPER that wraps the stored PBKDF2 digest.
      # The stack writes account hashes itself (cli/lib-set-password.sh,
      # post-install.sh: plain PBKDF2-SHA256), so a pepper would make every one of
      # those writes unusable at login. Empty, whatever .env.dify says.
      - PASSWORD_PEPPER=
      - DB_PASSWORD=${DIFY_DB_PASSWORD:-}
      - REDIS_PASSWORD=${VALKEY_PASSWORD:-}
      # One source: the broker URL carries the stack password straight from .env, so a
      # stale copy in .env.dify cannot win (environment: beats env_file).
      - CELERY_BROKER_URL=redis://:${VALKEY_PASSWORD:-}@valkey:6379/1
      # #3292 (H-01): the pgvector VECTOR_STORE lives in DIFY_DB and connects as
      # Dify's own role (dify_user), never as the cluster superuser. User and
      # password come as a PAIR from the same role (ga.1 lesson: the docker user
      # with the dify_user password failed every dataset write). The re-own at
      # upgrade (#2524) hands the existing embedding tables to dify_user.
      - PGVECTOR_USER=${DIFY_DB_USER:-}
      - PGVECTOR_PASSWORD=${DIFY_DB_PASSWORD:-}
      # 2026.05-ga.3: see dify-api comment above — plugin-daemon → API
      # auth secret. Worker reads it for the same /inner endpoints.
      - INNER_API_KEY_FOR_PLUGIN=${PLUGIN_DIFY_INNER_API_KEY:-}
      # #2598: stack .env keys this service reads (Dify's own settings (Google login); everything else comes from .env.dify),
      # by name only: compose takes the value from the stack .env and leaves
      # the variable unset when the key is absent, as env_file did.
      - GOOGLE_CLIENT_ID
      - GOOGLE_CLIENT_SECRET
      - TZ
    depends_on:
      dify-init-permissions:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
    volumes:
      - dify-app-data:/app/storage
      - ./patches:/dify-patches:ro
    networks:
      - default
      - ssrf_proxy_network
    # #2598: only Dify's own .env.dify; the stack keys Dify reads are named
    # in `environment:` below.
    env_file:
      - ../../.env.dify

  # ==========================================
  # Dify Dataset Worker: Indexing / Re-embed Celery Queues
  # ==========================================
  # #2510 (prod incident 2026-09-26): a long re-embed on the dataset/
  # pipeline queues was blocking webhook dispatch, streaming and async
  # workflow execution on the single shared worker above. This service
  # only runs the dataset/knowledge-pipeline ingestion queues, so a long
  # re-embed can no longer starve dify-worker's webhook/streaming/workflow
  # slots. Same image, env, volumes, depends_on and networks as dify-worker
  # (this file has no YAML anchors to share the block through — see
  # dify-api/dify-worker/dify-worker-beat, which already duplicate this
  # same env block rather than anchor it).
  dify-worker-dataset:
    # #1981: the image dify-api builds. This worker indexes uploaded documents,
    # so it is the one that splits a knowledge-base .msg and its attachments.
    image: razzfazz-dify-api:${DIFY_VERSION:-1.18.0}
    pull_policy: never  # #184 WS2a
    profiles: ["dify"]
    container_name: dify-worker-dataset
    restart: always
    # #2510 amendment (DevBox, prod measurement): both workers ran with a
    # 2 GiB limit and used 0.5–0.7 GiB after a 3.4h re-embed; 3g leaves
    # headroom for the concurrency bump below.
    mem_limit: 3g
    entrypoint: ["/bin/bash", "/dify-patches/entrypoint-wrapper.sh"]
    environment:
      # #2472 review: env_file hands every Dify container the whole stack .env,
      # MCP_INTERNAL_TOKEN included (the key to mcp-manager's /internal/*,
      # which the SSRF proxy also refuses). No Dify code uses it: emptied.
      - MCP_INTERNAL_TOKEN=
      - DB_HOST=postgres
      - REDIS_HOST=valkey
      - PGVECTOR_HOST=postgres
      - SSRF_PROXY_HTTP_URL=http://caddy:8195
      - SSRF_PROXY_HTTPS_URL=http://caddy:8195
      # rc6.7 #30: see dify-api block — keep worker's log timezone
      # aligned with the box's TZ (and the api/beat/worker services).
      - LOG_TZ=${TZ:-UTC}
      - MODE=worker
      # #2510: dataset/knowledge-pipeline ingestion queues only — see the
      # dify-worker comment above for the full 22-queue source and split.
      - CELERY_QUEUES=dataset,priority_dataset,dataset_summary,pipeline,priority_pipeline
      # #2510 (issue comment 36807): the indexing worker itself needs
      # concurrency >= 2-4 so several documents embed in parallel — extra
      # embedding replicas only pay off once this worker isn't serialized.
      - CELERY_WORKER_AMOUNT=${DIFY_DATASET_WORKER_AMOUNT:-2}
      - CONSOLE_URL=https://${DIFY_DOMAIN:-dify.${MAIN_DOMAIN:-razzfazz-box}}
      - API_URL=https://${DIFY_DOMAIN:-dify.${MAIN_DOMAIN:-razzfazz-box}}
      - APP_URL=https://${DIFY_DOMAIN:-dify.${MAIN_DOMAIN:-razzfazz-box}}
      - WEB_API_URL=https://${DIFY_DOMAIN:-dify.${MAIN_DOMAIN:-razzfazz-box}}
      - FILES_URL=https://${DIFY_DOMAIN:-dify.${MAIN_DOMAIN:-razzfazz-box}}
      # F-020: restrict CORS to own domain instead of wildcard
      - WEB_API_CORS_ALLOW_ORIGINS=https://${DIFY_DOMAIN:-dify.${MAIN_DOMAIN:-razzfazz-box}}
      - CONSOLE_CORS_ALLOW_ORIGINS=https://${DIFY_DOMAIN:-dify.${MAIN_DOMAIN:-razzfazz-box}}
      - COOKIE_DOMAIN=${MAIN_DOMAIN:-razzfazz-box}
      - MARKETPLACE_API_URL=${MARKETPLACE_API_URL:-https://marketplace.dify.ai}
      - INTERNAL_FILES_URL=http://dify-api:5001
      - SECRET_KEY=${WEBUI_SECRET_KEY:-}
      # 1.18.0 added an optional PASSWORD_PEPPER that wraps the stored PBKDF2 digest.
      # The stack writes account hashes itself (cli/lib-set-password.sh,
      # post-install.sh: plain PBKDF2-SHA256), so a pepper would make every one of
      # those writes unusable at login. Empty, whatever .env.dify says.
      - PASSWORD_PEPPER=
      - DB_PASSWORD=${DIFY_DB_PASSWORD:-}
      - REDIS_PASSWORD=${VALKEY_PASSWORD:-}
      # One source: the broker URL carries the stack password straight from .env, so a
      # stale copy in .env.dify cannot win (environment: beats env_file).
      - CELERY_BROKER_URL=redis://:${VALKEY_PASSWORD:-}@valkey:6379/1
      # #3292 (H-01): the pgvector VECTOR_STORE lives in DIFY_DB and connects as
      # Dify's own role (dify_user), never as the cluster superuser. User and
      # password come as a PAIR from the same role (ga.1 lesson: the docker user
      # with the dify_user password failed every dataset write). The re-own at
      # upgrade (#2524) hands the existing embedding tables to dify_user.
      - PGVECTOR_USER=${DIFY_DB_USER:-}
      - PGVECTOR_PASSWORD=${DIFY_DB_PASSWORD:-}
      # 2026.05-ga.3: see dify-api comment above — plugin-daemon → API
      # auth secret. Worker reads it for the same /inner endpoints.
      - INNER_API_KEY_FOR_PLUGIN=${PLUGIN_DIFY_INNER_API_KEY:-}
      # #2598: stack .env keys this service reads (Dify's own settings (Google login); everything else comes from .env.dify),
      # by name only: compose takes the value from the stack .env and leaves
      # the variable unset when the key is absent, as env_file did.
      - GOOGLE_CLIENT_ID
      - GOOGLE_CLIENT_SECRET
      - TZ
    depends_on:
      dify-init-permissions:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
    volumes:
      - dify-app-data:/app/storage
      - ./patches:/dify-patches:ro
    networks:
      - default
      - ssrf_proxy_network
    # #2598: only Dify's own .env.dify; the stack keys Dify reads are named
    # in `environment:` below.
    env_file:
      - ../../.env.dify

  # ==========================================
  # Dify Worker Beat: Task Scheduler
  # ==========================================
  dify-worker-beat:
    image: razzfazz-dify-api:${DIFY_VERSION:-1.18.0}   # #1981: the image dify-api builds
    pull_policy: never  # #184 WS2a
    restart: always
    profiles: ["dify"]
    container_name: dify-worker-beat
    entrypoint: ["/bin/bash", "/dify-patches/entrypoint-wrapper.sh"]
    environment:
      # #2472 review: env_file hands every Dify container the whole stack .env,
      # MCP_INTERNAL_TOKEN included (the key to mcp-manager's /internal/*,
      # which the SSRF proxy also refuses). No Dify code uses it: emptied.
      - MCP_INTERNAL_TOKEN=
      - DB_HOST=postgres
      - REDIS_HOST=valkey
      - PGVECTOR_HOST=postgres
      - SSRF_PROXY_HTTP_URL=http://caddy:8195
      - SSRF_PROXY_HTTPS_URL=http://caddy:8195
      # rc6.7 #30: see dify-api block.
      - LOG_TZ=${TZ:-UTC}
      - MODE=beat
      - CONSOLE_URL=https://${DIFY_DOMAIN:-dify.${MAIN_DOMAIN:-razzfazz-box}}
      - API_URL=https://${DIFY_DOMAIN:-dify.${MAIN_DOMAIN:-razzfazz-box}}
      - APP_URL=https://${DIFY_DOMAIN:-dify.${MAIN_DOMAIN:-razzfazz-box}}
      - WEB_API_URL=https://${DIFY_DOMAIN:-dify.${MAIN_DOMAIN:-razzfazz-box}}
      - FILES_URL=https://${DIFY_DOMAIN:-dify.${MAIN_DOMAIN:-razzfazz-box}}
      - SECRET_KEY=${WEBUI_SECRET_KEY:-}
      # 1.18.0 added an optional PASSWORD_PEPPER that wraps the stored PBKDF2 digest.
      # The stack writes account hashes itself (cli/lib-set-password.sh,
      # post-install.sh: plain PBKDF2-SHA256), so a pepper would make every one of
      # those writes unusable at login. Empty, whatever .env.dify says.
      - PASSWORD_PEPPER=
      - DB_PASSWORD=${DIFY_DB_PASSWORD:-}
      - REDIS_PASSWORD=${VALKEY_PASSWORD:-}
      # One source: the broker URL carries the stack password straight from .env, so a
      # stale copy in .env.dify cannot win (environment: beats env_file).
      - CELERY_BROKER_URL=redis://:${VALKEY_PASSWORD:-}@valkey:6379/1
      # #3292 (H-01): the pgvector VECTOR_STORE lives in DIFY_DB and connects as
      # Dify's own role (dify_user), never as the cluster superuser. User and
      # password come as a PAIR from the same role (ga.1 lesson: the docker user
      # with the dify_user password failed every dataset write). The re-own at
      # upgrade (#2524) hands the existing embedding tables to dify_user.
      - PGVECTOR_USER=${DIFY_DB_USER:-}
      - PGVECTOR_PASSWORD=${DIFY_DB_PASSWORD:-}
      # 2026.05-ga.3: see dify-api comment — beat scheduler reads the
      # same key for any /inner endpoint it dispatches to.
      - INNER_API_KEY_FOR_PLUGIN=${PLUGIN_DIFY_INNER_API_KEY:-}
      # #2598: stack .env keys this service reads (Dify's own settings (Google login); everything else comes from .env.dify),
      # by name only: compose takes the value from the stack .env and leaves
      # the variable unset when the key is absent, as env_file did.
      - GOOGLE_CLIENT_ID
      - GOOGLE_CLIENT_SECRET
      - TZ
    depends_on:
      dify-init-permissions:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
    volumes:
      - ./patches:/dify-patches:ro
    networks:
      - default
      - ssrf_proxy_network
    # #2598: only Dify's own .env.dify; the stack keys Dify reads are named
    # in `environment:` below.
    env_file:
      - ../../.env.dify

  # ==========================================
  # Dify Web: Frontend
  # ==========================================
  dify-web:
    build:
      # #68 de-vendor: the Dify web source is NO LONGER vendored. The build
      # context is now just this module dir (Dockerfile + patches/); the
      # Dockerfile clones the Dify monorepo at DIFY_VERSION and builds the
      # frontend. Only the Dockerfile + patches/ + DIFY-LICENSE ship.
      context: .
      dockerfile: Dockerfile
      # #2174: the build carries NO box configuration. The console/app API
      # URLs are RUNTIME environment below (CONSOLE_API_URL / APP_API_URL,
      # upstream's own mechanism, also what the Portal's re-domain recreates);
      # the six domain-bearing build args of the first custom web build
      # (2026-01-02) made the image, and its provenance digest, a property of
      # the box that built it — a generic offline stick could not carry a
      # dify-web that was right anywhere else, and no air-gapped box can
      # rebuild it (the source is cloned at build). An image built here is the
      # same image on every box.
      args:
        - DIFY_VERSION=${DIFY_VERSION:-1.18.0}
        # a literal, box-invariant: kept (measured only as "not the domain")
        - NEXT_PUBLIC_COOKIE_DOMAIN=1
    pull_policy: never  # #184 WS2a: built at install; never build/pull at runtime
    profiles: ["dify"]
    container_name: dify-web
    restart: always
    environment:
      # #2472 review: env_file hands every Dify container the whole stack .env,
      # MCP_INTERNAL_TOKEN included (the key to mcp-manager's /internal/*,
      # which the SSRF proxy also refuses). No Dify code uses it: emptied.
      - MCP_INTERNAL_TOKEN=
      # #3292 (H-01): .env.dify carries Dify's database credentials; this container
      # uses no database, so they are emptied here (environment: beats env_file).
      - DB_USERNAME=
      - DB_PASSWORD=
      - PGVECTOR_USER=
      - PGVECTOR_PASSWORD=
      - HOSTNAME=0.0.0.0
      # Dify 1.15 (#26): NEW required topology key. The web (Next.js) server
      # does its server-side Console fetches against SERVER_CONSOLE_API_URL.
      # Upstream default is `http://api:5001`, which does NOT resolve in our
      # topology — our backend container is `dify-api`, not `api`. Without this
      # override the Console's SSR calls fail (blank/errored Console). Set it to
      # the in-cluster dify-api address (dify-web and dify-api share the default
      # net). Static literal (no ${…}) so it is also safe to carry in .env.dify.
      - SERVER_CONSOLE_API_URL=http://dify-api:5001
      - CONSOLE_API_URL=https://${DIFY_DOMAIN:-dify.${MAIN_DOMAIN:-razzfazz-box}}
      - APP_API_URL=https://${DIFY_DOMAIN:-dify.${MAIN_DOMAIN:-razzfazz-box}}
      - CONSOLE_WEB_URL=https://${DIFY_DOMAIN:-dify.${MAIN_DOMAIN:-razzfazz-box}}
      - APP_WEB_URL=https://${DIFY_DOMAIN:-dify.${MAIN_DOMAIN:-razzfazz-box}}
      # F-020: restrict CORS to own domain instead of wildcard
      - WEB_API_CORS_ALLOW_ORIGINS=https://${DIFY_DOMAIN:-dify.${MAIN_DOMAIN:-razzfazz-box}}
      - CONSOLE_CORS_ALLOW_ORIGINS=https://${DIFY_DOMAIN:-dify.${MAIN_DOMAIN:-razzfazz-box}}
      - AMPLITUDE_API_KEY=${AMPLITUDE_API_KEY:-}
      - SENTRY_DSN=${WEB_SENTRY_DSN:-}
      - NEXT_TELEMETRY_DISABLED=${NEXT_TELEMETRY_DISABLED:-1}
      - TEXT_GENERATION_TIMEOUT_MS=${TEXT_GENERATION_TIMEOUT_MS:-60000}
      - CSP_WHITELIST=${CSP_WHITELIST:-}
      - ALLOW_EMBED=${ALLOW_EMBED:-false}
      - ALLOW_UNSAFE_DATA_SCHEME=${ALLOW_UNSAFE_DATA_SCHEME:-false}
      - MARKETPLACE_API_URL=${MARKETPLACE_API_URL:-https://marketplace.dify.ai}
      - MARKETPLACE_URL=${MARKETPLACE_URL:-https://marketplace.dify.ai}
      - TOP_K_MAX_VALUE=${TOP_K_MAX_VALUE:-}
      - INDEXING_MAX_SEGMENTATION_TOKENS_LENGTH=${INDEXING_MAX_SEGMENTATION_TOKENS_LENGTH:-}
      - PM2_INSTANCES=${PM2_INSTANCES:-2}
      - LOOP_NODE_MAX_COUNT=${LOOP_NODE_MAX_COUNT:-100}
      - MAX_TOOLS_NUM=${MAX_TOOLS_NUM:-10}
      - MAX_PARALLEL_LIMIT=${MAX_PARALLEL_LIMIT:-10}
      - MAX_ITERATIONS_NUM=${MAX_ITERATIONS_NUM:-99}
      - MAX_TREE_DEPTH=${MAX_TREE_DEPTH:-50}
      - ENABLE_WEBSITE_JINAREADER=${ENABLE_WEBSITE_JINAREADER:-true}
      - ENABLE_WEBSITE_FIRECRAWL=${ENABLE_WEBSITE_FIRECRAWL:-true}
      - ENABLE_WEBSITE_WATERCRAWL=${ENABLE_WEBSITE_WATERCRAWL:-true}
      # #2598: no stack .env key beyond .env.dify and this block is read; TZ for libc,
      # by name only: compose takes the value from the stack .env and leaves
      # the variable unset when the key is absent, as env_file did.
      - TZ
    # #2598: only Dify's own .env.dify; the stack keys Dify reads are named
    # in `environment:` below.
    env_file:
      - ../../.env.dify
    networks:
      - default
      - ssrf_proxy_network

  # ==========================================
  # Dify Sandbox: Code Execution Environment
  # ==========================================
  dify-sandbox:
    image: langgenius/dify-sandbox:${DIFY_SANDBOX_VERSION:-0.2.15}
    profiles: ["dify"]
    container_name: dify-sandbox
    restart: always
    mem_limit: 512m
    environment:
      # #2472 review: env_file hands every Dify container the whole stack .env,
      # MCP_INTERNAL_TOKEN included (the key to mcp-manager's /internal/*,
      # which the SSRF proxy also refuses). No Dify code uses it: emptied.
      MCP_INTERNAL_TOKEN: ""
      # #3292 (H-01): .env.dify carries Dify's database credentials; this container
      # uses no database, so they are emptied here (environment: beats env_file).
      DB_USERNAME: ""
      DB_PASSWORD: ""
      PGVECTOR_USER: ""
      PGVECTOR_PASSWORD: ""
      API_KEY: ${SANDBOX_API_KEY:-dify-sandbox}
      GIN_MODE: ${SANDBOX_GIN_MODE:-release}
      WORKER_TIMEOUT: ${SANDBOX_WORKER_TIMEOUT:-15}
      ENABLE_NETWORK: ${SANDBOX_ENABLE_NETWORK:-true}
      # Proxy via Caddy
      HTTP_PROXY: http://caddy:8195
      HTTPS_PROXY: http://caddy:8195
      SANDBOX_PORT: ${SANDBOX_PORT:-8194}
      # dify-sandbox 0.2.15 ships python at /opt/python/bin/python3 but its
      # default /conf/config.yaml points python_path at /usr/local/bin/python3,
      # so every code node fails with 'fork/exec .../python3: no such file'.
      # Override the path here (source-persistent across all boxes).
      PYTHON_PATH: ${SANDBOX_PYTHON_PATH:-/opt/python/bin/python3}
      # #2272: empty means the image's compiled-in default, mirrors.aliyun.com — a
      # host the egress policy does not list, and an index identity uv keys its
      # cache by, so the cache the offline package carries (warmed for PyPI) is
      # invisible to it. The default is the index everything else in the stack
      # is warmed for and allowed to reach; a corporate mirror still overrides.
      PIP_MIRROR_URL: ${PIP_MIRROR_URL:-https://pypi.org/simple}
      # #2272: the daemon AUTO-DETECTS a mirror when the URL is empty ("pip mirror
      # auto-detect selected a mirror … mirror_url=https://mirrors.aliyun.com/…",
      # main.go:84). Off, explicitly, so the URL above is the whole story.
      PIP_MIRROR_AUTO_DETECT: ${PIP_MIRROR_AUTO_DETECT:-false}
      # #2598: no stack .env key beyond .env.dify and this block is read; TZ for libc,
      # by name only: compose takes the value from the stack .env and leaves
      # the variable unset when the key is absent, as env_file did.
      TZ:
    volumes:
      - dify-sandbox-dependencies:/dependencies
      - dify-sandbox-conf:/conf
    healthcheck:
      test: ["CMD", "curl", "--noproxy", "*", "-f", "http://localhost:8194/health"]
    # #2598: only Dify's own .env.dify; the stack keys Dify reads are named
    # in `environment:` below.
    env_file:
      - ../../.env.dify
    networks:
      - ssrf_proxy_network
  
  # ==========================================
  # Dify Plugin Daemon: Plugin Management
  # ==========================================
  dify-plugin-daemon:
    image: langgenius/dify-plugin-daemon:${DIFY_PLUGIN_VERSION:-0.6.12-local}
    profiles: ["dify"]
    container_name: dify-plugin-daemon
    restart: always
    # 0.6.12 runs as the image's `dify` user (HOME=/home/dify), like upstream. The
    # storage volume was written by root on every existing box, so
    # dify-plugin-daemon-init-permissions hands it to that user first.
    environment:
      # #2472 review: env_file hands every Dify container the whole stack .env,
      # MCP_INTERNAL_TOKEN included (the key to mcp-manager's /internal/*,
      # which the SSRF proxy also refuses). No Dify code uses it: emptied.
      MCP_INTERNAL_TOKEN: ""
      # #3292 (H-01): the plugin daemon has its own DB role (below) and no vector
      # store; the vector-store credentials from .env.dify are emptied here.
      PGVECTOR_USER: ""
      PGVECTOR_PASSWORD: ""
      DB_DATABASE: ${DB_PLUGIN_DATABASE:-dify_plugin}
      DIFY_INNER_API_URL: http://dify-api:5001
      SERVER_PORT: ${PLUGIN_DAEMON_PORT:-5002}
      SERVER_KEY: ${PLUGIN_DAEMON_KEY:-lYkiYYT6owG+71oLerGzA7GXCgOT++6ovaezWAjpCjf+Sjc3ZtU+qUEi}
      MAX_PLUGIN_PACKAGE_SIZE: ${PLUGIN_MAX_PACKAGE_SIZE:-52428800}
      PPROF_ENABLED: ${PLUGIN_PPROF_ENABLED:-false}
      DIFY_INNER_API_KEY: ${PLUGIN_DIFY_INNER_API_KEY:-QaHbTe77CtuXmsfyhR7+vRjI/+XbV1AaFy691iy+kGDv2Jvy0/eAh8Y1}
      PLUGIN_REMOTE_INSTALLING_HOST: ${PLUGIN_DEBUGGING_HOST:-0.0.0.0}
      PLUGIN_REMOTE_INSTALLING_PORT: ${PLUGIN_DEBUGGING_PORT:-5033}
      PLUGIN_WORKING_PATH: ${PLUGIN_WORKING_PATH:-/app/storage/cwd}
      FORCE_VERIFYING_SIGNATURE: ${FORCE_VERIFYING_SIGNATURE:-true}
      PYTHON_ENV_INIT_TIMEOUT: ${PLUGIN_PYTHON_ENV_INIT_TIMEOUT:-120}
      PLUGIN_MAX_EXECUTION_TIMEOUT: ${PLUGIN_MAX_EXECUTION_TIMEOUT:-600}
      PLUGIN_STDIO_BUFFER_SIZE: ${PLUGIN_STDIO_BUFFER_SIZE:-1024}
      PLUGIN_STDIO_MAX_BUFFER_SIZE: ${PLUGIN_STDIO_MAX_BUFFER_SIZE:-5242880}
      # #2272: empty means the image's compiled-in default, mirrors.aliyun.com — a
      # host the egress policy does not list, and an index identity uv keys its
      # cache by, so the cache the offline package carries (warmed for PyPI) is
      # invisible to it. The default is the index everything else in the stack
      # is warmed for and allowed to reach; a corporate mirror still overrides.
      PIP_MIRROR_URL: ${PIP_MIRROR_URL:-https://pypi.org/simple}
      # #2272: the daemon AUTO-DETECTS a mirror when the URL is empty ("pip mirror
      # auto-detect selected a mirror … mirror_url=https://mirrors.aliyun.com/…",
      # main.go:84). Off, explicitly, so the URL above is the whole story.
      PIP_MIRROR_AUTO_DETECT: ${PIP_MIRROR_AUTO_DETECT:-false}
      PLUGIN_STORAGE_TYPE: ${PLUGIN_STORAGE_TYPE:-local}
      PLUGIN_STORAGE_LOCAL_ROOT: ${PLUGIN_STORAGE_LOCAL_ROOT:-/app/storage}
      PLUGIN_INSTALLED_PATH: ${PLUGIN_INSTALLED_PATH:-plugin}
      PLUGIN_PACKAGE_CACHE_PATH: ${PLUGIN_PACKAGE_CACHE_PATH:-plugin_packages}
      PLUGIN_MEDIA_CACHE_PATH: ${PLUGIN_MEDIA_CACHE_PATH:-assets}
      PLUGIN_STORAGE_OSS_BUCKET: ${PLUGIN_STORAGE_OSS_BUCKET:-}
      # Secrets from .env
      # Override both DB_USERNAME and DB_PASSWORD: .env.dify ships these as
      # ${DIFY_DB_USER}/${DIFY_DB_PASSWORD} (the dify-api-shared user), which
      # own dify_db but NOT dify_plugin_db. The plugin daemon needs to auth
      # as dify_plugin_user against the dedicated dify_plugin_db. Without the
      # DB_USERNAME override the daemon panics at db.Init with
      # "password authentication failed for user dify_user".
      DB_USERNAME: ${DIFY_PLUGIN_DB_USER:-}
      DB_PASSWORD: ${DIFY_PLUGIN_DB_PASSWORD:-}
      REDIS_HOST: valkey
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${VALKEY_PASSWORD:-}
      # #2598: no stack .env key beyond .env.dify and this block is read; TZ for libc,
      # by name only: compose takes the value from the stack .env and leaves
      # the variable unset when the key is absent, as env_file did.
      TZ:
    ports:
      # F-008: Bind to localhost only — plugin debugging port should not be externally reachable
      - "127.0.0.1:${EXPOSE_PLUGIN_DEBUGGING_PORT:-5033}:${PLUGIN_DEBUGGING_PORT:-5033}"
    volumes:
      - dify-plugin-daemon:/app/storage
      # #2445: tiktoken's fallback cache, filled from the image by the one-shot above.
      - dify-tiktoken-cache:/tmp/data-gym-cache
    depends_on:
      dify-plugin-daemon-init-permissions:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
        required: false
    # #2598: only Dify's own .env.dify; the stack keys Dify reads are named
    # in `environment:` below.
    env_file:
      - ../../.env.dify
    networks:
      - default

# ==========================================
# Volumes & Networks (Referenced)
# ==========================================
volumes:
  dify-app-data:
  dify-sandbox-dependencies:
  dify-sandbox-conf:
  dify-plugin-daemon:
  dify-tiktoken-cache:

networks:
  ssrf_proxy_network:
    driver: bridge
    internal: true
  # #36 security-review — shared egress-controlled net (declared in
  # core/compose.yml). Compose merges the identical `name:`-keyed declaration.
  coding-agents:
    name: coding-agents
    driver: bridge
