# ==============================================================================
# GITEA MODULE (Self-hosted Git Service)
# ==============================================================================
# Profile: gitea
# Description: Lightweight self-hosted Git service with web interface.
# Config: .env (global)
# Dependencies: postgres
# ==============================================================================
services:
  # ==========================================
  # Gitea: Git Repository Server
  # ==========================================
  gitea:
    image: gitea/gitea:${GITEA_VERSION:-28.4.0}
    profiles: ["gitea"]
    container_name: gitea
    restart: unless-stopped
    # #36 security-review — join egress-controlled coding-agents net for sandboxed coding agents
    networks:
      - default
      - coding-agents
    ports:
      - "127.0.0.1:${GITEA_HTTP_PORT:-3000}:3000"
      # F-067 (accepted risk): SSH binds to 0.0.0.0 intentionally — Git SSH access
      # requires external reachability. Gitea handles SSH auth (keys/tokens) internally.
      - "${GITEA_SSH_PORT:-2222}:22"
    environment:
      # General
      - USER_UID=1000
      - USER_GID=1000
      
      # Database (PostgreSQL)
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=postgres:5432
      - GITEA__database__NAME=${GITEA_DB:-gitea_db}
      - GITEA__database__USER=${GITEA_DB_USER:-}
      - GITEA__database__PASSWD=${GITEA_DB_PASSWORD:-}
      - GITEA__database__SSL_MODE=disable
      
      # Server
      - GITEA__server__DOMAIN=${GITEA_DOMAIN:-git.${MAIN_DOMAIN:-razzfazz-box}}
      - GITEA__server__SSH_DOMAIN=${GITEA_DOMAIN:-git.${MAIN_DOMAIN:-razzfazz-box}}
      - GITEA__server__ROOT_URL=https://${GITEA_DOMAIN:-git.${MAIN_DOMAIN:-razzfazz-box}}/
      - GITEA__server__SSH_PORT=${GITEA_SSH_PORT:-2222}
      - GITEA__server__SSH_LISTEN_PORT=22
      - GITEA__server__LFS_START_SERVER=true
      # #2507: an unauthenticated visitor lands on the login page, not the
      # public explore/home page. Every browser request is already Authentik-
      # authenticated by Caddy's forward_auth, but Gitea has no session of its
      # own yet, so `/` rendered the anonymous home page (the operator's report
      # on prod). With `login`, `/` -> /user/login, which Caddy sends on to
      # /user/oauth2/Authentik when ENABLE_GITEA_AUTHENTIK_OIDC=true
      # (core/Caddy/Caddyfile, @gitea_login_sso) — one click-free SSO hop.
      # Replaces prod's hand-made razzfazz-local/gitea-sso.override.yml.
      - GITEA__server__LANDING_PAGE=${GITEA_LANDING_PAGE:-login}
      # #2600: webhook delivery timeout. Gitea's default of 5 s marks a receiver
      # that does real work (a CI runner, a Dify or agent webhook) as failed
      # although it succeeds; the operator wants 120 s on every box.
      - GITEA__webhook__DELIVER_TIMEOUT=${GITEA_WEBHOOK_DELIVER_TIMEOUT:-120}
      
      # Security
      - GITEA__security__SECRET_KEY=${GITEA_SECRET_KEY:-}
      - GITEA__security__INTERNAL_TOKEN=${GITEA_INTERNAL_TOKEN:-}
      # #2526: X-Forwarded-For is trusted from loopback and, added by
      # init-gitea.sh at start, from Caddy's address on the stack network only.
      # Never `*`: any client reaching Gitea directly could forge its address.
      - GITEA__security__REVERSE_PROXY_TRUSTED_PROXIES=127.0.0.0/8,::1/128
      # #2526: access log on, to the console (the container log that the Wazuh
      # agent ships), in Gitea's default template, which the Wazuh rules parse.
      # Literal values, so a box picks them up on the next recreate.
      - GITEA__log__ENABLE_ACCESS_LOG=true
      - GITEA__log__logger_0X2E_access_0X2E_MODE=console
      
      # Registration settings — Gitea is behind Authentik SSO. Public signup
      # is never needed; users come through Authentik or pre-provisioned
      # accounts. Fixes N-1 from the 2026-04-23 security review.
      - GITEA__service__DISABLE_REGISTRATION=true
      - GITEA__service__ALLOW_ONLY_EXTERNAL_REGISTRATION=true
      - GITEA__service__REQUIRE_SIGNIN_VIEW=false
      
      # Google OAuth (configured via init-gitea.sh when ENABLE_GOOGLE_OAUTH=true)
      - ENABLE_GOOGLE_OAUTH=${ENABLE_GOOGLE_OAUTH:-false}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_OAUTH_DOMAIN=${GOOGLE_OAUTH_DOMAIN-seqis.com}
      # Authentik native OIDC (#29): init-gitea.sh runs `gitea admin auth add-oauth
      # --name Authentik --auto-discover-url .../gitea-oidc/...` when these are set
      # IN THE CONTAINER. Without the passthrough init-gitea always saw them unset
      # and logged "skipping Authentik OIDC" → no "Sign in with Authentik" button.
      - ENABLE_GITEA_AUTHENTIK_OIDC=${ENABLE_GITEA_AUTHENTIK_OIDC:-false}
      - GITEA_OIDC_CLIENT_ID=${GITEA_OIDC_CLIENT_ID:-}
      - GITEA_OIDC_CLIENT_SECRET=${GITEA_OIDC_CLIENT_SECRET:-}
      - AUTHENTIK_DOMAIN=${AUTHENTIK_DOMAIN:-auth.localhost}
      # Trust Caddy's self-signed CA so the Authentik OIDC discovery URL
      # (https://${AUTHENTIK_DOMAIN}/application/o/gitea-oidc/...) verifies on
      # TLS_MODE=internal. Go reads SSL_CERT_FILE. Without it, init-gitea's
      # add-oauth and Gitea's runtime OIDC discovery fail with x509
      # "certificate signed by unknown authority". (Mirrors vaultwarden; #29.)
      # On Let's Encrypt the cert is publicly trusted; the extra CA is harmless.
      - SSL_CERT_FILE=/usr/local/share/ca-certificates/caddy-ca.crt
      # #29: auto-register OAuth/OIDC users. Gated on the DERIVED
      # GITEA_OAUTH_AUTO_REGISTER (true if Google OR Authentik OIDC is enabled —
      # razzfazz-init.sh derives it). Previously this was tied to
      # ENABLE_GOOGLE_OAUTH only, so enabling JUST Authentik OIDC left
      # auto-registration off and Authentik users could not self-provision.
      - GITEA__oauth2_client__ENABLE_AUTO_REGISTRATION=${GITEA_OAUTH_AUTO_REGISTER:-${ENABLE_GOOGLE_OAUTH:-false}}
      - GITEA__oauth2_client__ACCOUNT_LINKING=auto
      # #2507: the username source for NEW OAuth/OIDC accounts is this GLOBAL
      # app.ini key — Gitea (1.27.3, still 28.4.0) has no per-source `add-oauth --username`
      # (the #218 flag that made init-gitea's add-oauth fail on every start).
      # Default `email` (the local part of the e-mail) is what every box has
      # actually run with, so the default changes nothing. `preferred_username`
      # (#218's intent: the Authentik username) is valid in 1.27.3 but Gitea
      # REFUSES the registration when the claim is missing (Google-direct
      # source) or not a valid Gitea name — opt in per box via .env.
      - GITEA__oauth2_client__USERNAME=${GITEA_OAUTH_USERNAME:-email}
      - GITEA__oauth2_client__UPDATE_AVATAR=true
      # True SSO group->role mapping (#33): init-gitea.sh maps this Authentik
      # group -> Gitea site admin on the OIDC source (--admin-group). Config-
      # driven, never a hardcoded user. Default = the superuser group.
      - SSO_ADMIN_GROUP=${SSO_ADMIN_GROUP:-razzfazz.ai Super Admins}
      
      # Mailer (uses internal smtp-relay container, no auth needed)
      - GITEA__mailer__ENABLED=true
      - GITEA__mailer__PROTOCOL=smtp
      - GITEA__mailer__SMTP_ADDR=smtp-relay
      - GITEA__mailer__SMTP_PORT=587
      - GITEA__mailer__FROM=${SMTP_FROM:-noreply@localhost}
      
      # Session & Cache (use Valkey/Redis)
      - GITEA__cache__ENABLED=true
      - GITEA__cache__ADAPTER=redis
      - GITEA__cache__HOST=redis://:${VALKEY_PASSWORD:-}@valkey:6379/2?pool_size=100&idle_timeout=180s
      - GITEA__session__PROVIDER=redis
      - GITEA__session__PROVIDER_CONFIG=redis://:${VALKEY_PASSWORD:-}@valkey:6379/3?pool_size=100&idle_timeout=180s
      - GITEA__queue__TYPE=redis
      - GITEA__queue__CONN_STR=redis://:${VALKEY_PASSWORD:-}@valkey:6379/4?pool_size=100&idle_timeout=180s
      
      # Installation & Admin (auto-install on first run)
      - GITEA__security__INSTALL_LOCK=true
      - GITEA_ADMIN_USER=${GITEA_ADMIN_USER:-admin}
      - GITEA_ADMIN_PASSWORD=${GITEA_ADMIN_PASSWORD:-}
      - GITEA_ADMIN_EMAIL=${GITEA_ADMIN_EMAIL:-admin@localhost}

      # The stack's time zone (.env TZ), instead of binding the host's
      # /etc/timezone and /etc/localtime (see volumes below).
      - TZ=${TZ:-UTC}

    volumes:
      - gitea-data:/data
      # Caddy internal CA for self-signed OIDC discovery trust (#29; see SSL_CERT_FILE).
      - ../../certs/caddy-ca.pem:/usr/local/share/ca-certificates/caddy-ca.crt:ro
      # No /etc/timezone or /etc/localtime bind: the time zone comes from TZ
      # (environment above). Ubuntu 26.04 no longer ships /etc/timezone, and
      # its release upgrade removes it; Docker then creates the missing bind
      # source as an empty directory at boot, and a container created while
      # it was a file cannot start again ("mount a directory onto a file",
      # exit 127). Gitea's binary carries its own time zone data, so TZ is
      # all it needs.
      - ./init-gitea.sh:/usr/local/bin/init-gitea.sh:ro
    entrypoint: ["/bin/sh", "-c", "/usr/local/bin/init-gitea.sh"]
    # #3059: init-gitea.sh forwards the stop to s6-svscan and waits for gitea's
    # graceful shutdown (queue flush, indexer close). Docker's default 10 s is
    # tight for that; the nightly backup's stop honours this value too.
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      postgres-db-reconcile:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    labels:
      - "docker-volume-backup.stop-during-backup=true"
    healthcheck:
      test: ["CMD", "curl", "--noproxy", "*", "-f", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # #2554: Gitea as a knowledge base for Open WebUI, Dify and the agents.
  # Stateless HTTP MCP; the Gitea credential arrives PER REQUEST from
  # mcp-manager's gateway (the caller's own OAuth token, or a technical
  # user's own token), so one container serves every user AS that user.
  # It holds no credential of its own: no -T, no GITEA_ACCESS_TOKEN(_FILE),
  # no env_file — without a request credential it would fall back to a
  # server token, so there must never be one (design record §7). The
  # gateway's `gitea` guard (mcp-manager gitea_guard.py) admits only its
  # pinned tools and refuses every write to a default branch.
  # On `default` only: it must reach gitea:3000; never on coding-agents.
  gitea-mcp:
    image: docker.gitea.com/gitea-mcp-server:${GITEA_MCP_VERSION:-1.7.0}
    profiles: ["gitea"]
    container_name: gitea-mcp
    restart: unless-stopped
    command: ["/app/gitea-mcp", "-t", "http", "-p", "8080", "-H", "http://gitea:3000"]
    networks:
      - default
    read_only: true
    # Only its log file falls back to /tmp when the home directory is
    # read-only. Downloads (job logs, artifacts, non-image attachments) go to
    # $HOME/.gitea-mcp with no fallback and would fail, so the gateway refuses
    # those methods and `output_path` (gitea_guard.DOWNLOAD_METHODS).
    tmpfs:
      - /tmp:size=64m
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # The upstream image's own HEALTHCHECK is CMD-SHELL, but the image is
    # distroless (no /bin/sh): it can never pass and the container stayed
    # "unhealthy" for good (measured on a box). Exec form, the binary's own
    # probe. Guard: tests/unit/consistency/test_2554_no_shell_healthcheck_on_a_shell_less_image.py
    healthcheck:
      test: ["CMD", "/app/gitea-mcp", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - gitea

# Volume for Gitea data (repos, LFS, avatars, etc.)
volumes:
  gitea-data:

# #36 security-review — shared egress-controlled net (declared in core/compose.yml).
networks:
  coding-agents:
    name: coding-agents
    driver: bridge
